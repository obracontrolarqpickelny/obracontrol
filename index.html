async function saveDocF(){
  const n=$('nd_n').value.trim();if(!n){toast('Nombre obligatorio','var(--red)');return;}
  const doc={id:uid(),projectId:S.proj,name:n,category:$('nd_c').value,url:$('nd_u').value,notes:$('nd_no').value,date:td(),updatedAt:nw()};
  const f=$('nd_f');
  if(f&&f.files&&f.files.length){
    const file=f.files[0];
    const fileSizeMB = file.size / (1024*1024);
    doc.fileName=file.name; doc.fileType=file.type; doc.fileSize=Math.round(file.size/1024);
    if(fileSizeMB > 15){
      toast('Archivo demasiado grande ('+fileSizeMB.toFixed(1)+' MB). Máx 15 MB. Usá un link de Drive.','var(--red)',5000);
      return;
    }
    if(fileSizeMB > 3){
      toast('Archivo grande ('+fileSizeMB.toFixed(1)+' MB) — puede demorar la sincronización','var(--orange)',3500);
    }
    // Intentar subir a Drive en carpeta Documentos
    const _docFid=(S.proj&&GD.moduleFolders[S.proj+'_documentos'])||GD.imagesFolderId||null;
    if(GD.online && GD.accessToken && (_docFid||GD.imagesFolderId) && file.type.startsWith('image/')){
      try{
        const b64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
        const result=await uploadImageToDrive(b64,'doc_'+uid()+'_'+file.name,_docFid);
        if(result&&result.url){ doc.url=result.url; doc.driveId=result.driveId; }
      }catch(e){}
    } else {
      // Guardar base64 solo si < 5 MB
      if(fileSizeMB <= 5){
        doc.fileData=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
        if(file.type.startsWith('image/'))doc.url=doc.fileData;
      } else {
        toast('Archivo no es imagen y pesa '+fileSizeMB.toFixed(1)+' MB — guardando solo referencia. Para verlo, subilo a Drive y pegá el link.','var(--orange)',5000);
      }
    }
  }
  D.documentos.push(doc);audit('documentos','create',n);sv();closeM('newDocM');render();
  toast('Documento guardado'+(doc.driveId?' en Drive ✓':doc.fileData?' localmente':' (sin archivo)'),'var(--green)');
}

function renderCmtItems(){

  _sb('cmt_tp_all',!S.cmtTipoFilter);

  if(S.cmtTipoFilter)filtered=filtered.filter(x=>x.tipo===S.cmtTipoFilter);

  const general=filtered.filter(x=>x.tipo!=='propietario');
  function cmtCard(cm,borderColor){

    h+='<div class="ts mb-6" style="'+(done?'text-decoration:line-through;color:#94a3b8':'')+'">'+cm.text+'</div>';

    if(ph.length)h+=photoGrid(ph,'comentarios',cm.id);
    if(af.length){h+='<div class="mt-6">';af.forEach(function(f){h+='<div class="flex items-center gap-8" style="padding:4px 0"><span style="color:var(--slate)">'+I.file+'</span><div class="flex-1 ts trun">'+f.name+'</div><button class="btn btn-sec btn-s" onclick="viewArchivo(\'comentarios\',\''+cm.id+'\',\''+(f.id||f.name||'')+'\')">'+I.eye+'</button><button class="btn btn-sec btn-s" style="color:var(--red)" onclick="delArchivoCmt(\''+cm.id+'\',\''+(f.id||f.name||'')+'\')">'+I.trash+'</button></div>';});h+='</div>';}

var FILE_LIMIT_MB=8;
async function readFilesWithLimit(inputId){
  var el=$(inputId);if(!el||!el.files||!el.files.length)return [];
  var res=[];
  for(var _fi=0;_fi<el.files.length;_fi++){
    var f=el.files[_fi],mb=f.size/(1024*1024);
    if(mb>FILE_LIMIT_MB){toast('"'+f.name+'" supera '+FILE_LIMIT_MB+' MB — subílo a Drive.','var(--orange)',5000);continue;}
    if(mb>3)toast('"'+f.name+'" ('+mb.toFixed(1)+' MB) guardando...','var(--pri)',2000);
    var d=await new Promise(function(resolve){var r=new FileReader();r.onload=function(e){resolve(e.target.result);};r.onerror=function(){resolve(null);};r.readAsDataURL(f);});
    if(d)res.push({id:uid(),name:f.name,type:f.type,size:Math.round(f.size/1024),data:d,date:td()});
  }
  return res;
}

function addCmtMedia(cmId, type){
  const cm=D.comentarios.find(x=>x.id===cmId);if(!cm)return;
  const inp=document.createElement('input');
  inp.type='file';
  inp.multiple=true;
  if(type==='photo'){inp.accept='image/*';}
  else{inp.accept='*/*';}
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=async ()=>{
    const files=Array.from(inp.files||[]);
    if(!files.length){document.body.removeChild(inp);return;}
    if(type==='photo'){
      if(!cm.photos)cm.photos=[];
      const _cmFid=(S.proj&&GD.moduleFolders[S.proj+'_comentarios'])||GD.imagesFolderId||null;
      for(const file of files){
        var _comp=await new Promise(res=>{const r=new FileReader();r.onload=async e=>res(await compressImage(e.target.result,800,0.7));r.readAsDataURL(file);});
        var _url=_comp;
        if(GD.online&&GD.accessToken&&(_cmFid||GD.imagesFolderId)){
          try{const _up=await uploadImageToDrive(_comp,'cmt_'+uid()+'.jpg',_cmFid);if(_up&&_up.url)_url=_up.url;}catch(e){}
        }
        cm.photos.push(mkPhoto(_url,''));
      }
      toast(files.length+' foto(s) agregada(s)');
    } else {
      if(!cm.archivos)cm.archivos=[];
      await Promise.all(files.map(file=>new Promise(res=>{const r=new FileReader();r.onload=e=>{cm.archivos.push({id:uid(),name:file.name,type:file.type,data:e.target.result,date:td()});res();};r.readAsDataURL(file);})));
      toast(files.length+' archivo(s) adjuntado(s)');
    }
    document.body.removeChild(inp);
    sv();render();
  };
  inp.click();
}

async function importHistorial(input) {
  if (!input.files || !input.files.length) return;
  const file = input.files[0];
  input.value = '';

  // Mostrar modal de progreso
  const prog = document.createElement('div');
  prog.id = 'importProgM';
  prog.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center;';
  prog.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.2)">
      <div style="font-size:16px;font-weight:800;margin-bottom:16px">📥 Importando historial...</div>
      <div id="imp_bar_wrap" style="background:#f1f5f9;border-radius:8px;height:10px;margin-bottom:12px;overflow:hidden">
        <div id="imp_bar" style="height:100%;background:var(--purple);border-radius:8px;width:0%;transition:width .3s"></div>
      </div>
      <div id="imp_status" style="font-size:12px;color:var(--text3);min-height:36px"></div>
    </div>`;
  document.body.appendChild(prog);

  const setProgress = (pct, msg) => {
    const bar = document.getElementById('imp_bar');
    const st  = document.getElementById('imp_status');
    if (bar) bar.style.width = pct + '%';
    if (st)  st.textContent = msg;
  };

  try {
    // ── 1. Leer y parsear el JSON ──────────────────────────────────
    setProgress(5, 'Leyendo archivo...');
    const raw = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = e => res(e.target.result);
      r.onerror = () => rej(new Error('No se pudo leer el archivo'));
      r.readAsText(file, 'utf-8');
    });

    let bk;
    try { bk = JSON.parse(raw); }
    catch(e) { throw new Error('Archivo JSON inválido: ' + e.message); }

    // ── 2. Validar estructura ──────────────────────────────────────
    setProgress(10, 'Validando estructura...');
    const TABLAS = ['visitas','tareas','materiales','matIngresos','alertas',
                    'checklists','documentos','enlaces','comentarios',
                    'colaboradores','economia','auditLog'];

    // Detectar si es backup propio o exportación de otra herramienta
    const hasProject = bk.project || bk.obra || bk.proyecto;
    if (!hasProject && !TABLAS.some(t => bk[t])) {
      throw new Error('No se reconoce el formato del archivo. Debe ser un backup de ObraControl.');
    }

    // Normalizar: puede venir como bk.obra o bk.proyecto
    if (!bk.project && bk.obra)    bk.project = bk.obra;
    if (!bk.project && bk.proyecto) bk.project = bk.proyecto;

    // ── 3. Fusionar proyecto ───────────────────────────────────────
    setProgress(20, 'Procesando proyecto...');
    let proj = null;
    if (bk.project) {
      proj = D.projects.find(x => x.id === bk.project.id);
      if (!proj) {
        D.projects.push(bk.project);
        proj = bk.project;
      }
    }
    // Si no hay proyecto, usar el actual
    const pid = proj?.id || S.proj;
    if (!pid) throw new Error('No hay proyecto destino. Abrí una obra primero.');

    // ── 4. Fusionar cada tabla sin duplicar ────────────────────────
    const stats = {};
    let step = 0;
    for (const tbl of TABLAS) {
      step++;
      setProgress(20 + Math.round(step / TABLAS.length * 50), `Procesando ${tbl}... (${bk[tbl]?.length || 0} registros)`);
      if (!bk[tbl] || !Array.isArray(bk[tbl])) continue;
      if (!D[tbl]) D[tbl] = [];
      const existingIds = new Set(D[tbl].map(x => x.id));
      let added = 0;
      for (const item of bk[tbl]) {
        if (!existingIds.has(item.id)) {
          item.projectId = pid; // asegurar que quede asociado al proyecto correcto
          D[tbl].push(item);
          added++;
        }
      }
      stats[tbl] = added;
      // Pequeña pausa para que la UI se actualice
      await new Promise(r => setTimeout(r, 15));
    }

    // ── 5. Guardar localmente ──────────────────────────────────────
    setProgress(75, 'Guardando localmente...');
    S.proj = pid;
    sv();
    await new Promise(r => setTimeout(r, 100));

    // ── 6. Subir a Google Drive si está conectado ──────────────────
    let driveOk = false;
    if (GD.accessToken || SYNC.method) {
      setProgress(82, 'Conectando con Google Drive...');
      try {
        if (SYNC.method === 'oauth' || GD.accessToken) {
          const ok = await ensureAuth(false);
          if (ok) {
            setProgress(88, 'Subiendo datos a Drive...');
            await saveToDrive();

            // Subir módulo por módulo a sus carpetas correspondientes
            setProgress(92, 'Distribuyendo en carpetas de Drive...');
            await ensureFolders(pid);

            // Guardar archivo de resumen por módulo en Drive
            const modulosConDatos = TABLAS.filter(t => stats[t] > 0);
            for (const mod of ['visitas','tareas','materiales','alertas','economia']) {
              if (!stats[mod]) continue;
              const modKey = `${pid}_${mod}`;
              const modFolderId = GD.moduleFolders[modKey];
              if (!modFolderId) continue;
              const modData = (D[mod] || []).filter(x => x.projectId === pid);
              if (!modData.length) continue;
              const modContent = JSON.stringify({ modulo: mod, proyecto: proj?.name, exportDate: nw(), datos: modData }, null, 2);
              const modBlob = new Blob([modContent], { type: 'application/json' });
              const modName = `ObraControl_${(proj?.name || pid).replace(/\s+/g,'_')}_${mod}.json`;
              // Buscar si ya existe el archivo del módulo
              const qMod = `name='${modName}' and '${modFolderId}' in parents and trashed=false`;
              const findRes = await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qMod)}&fields=files(id)`, {
                headers: driveHeaders()
              });
              const findData = await findRes.json();
              if (findData.files && findData.files.length > 0) {
                // Actualizar existente
                await fetchWithTimeout(`https://www.googleapis.com/upload/drive/v3/files/${findData.files[0].id}?uploadType=media`, {
                  method: 'PATCH',
                  headers: { 'Authorization': 'Bearer ' + GD.accessToken, 'Content-Type': 'application/json' },
                  body: modContent,
                });
              } else {
                // Crear nuevo
                const metaMod = { name: modName, parents: [modFolderId], mimeType: 'application/json' };
                const formMod = new FormData();
                formMod.append('metadata', new Blob([JSON.stringify(metaMod)], { type: 'application/json' }));
                formMod.append('file', modBlob);
                await fetchWithTimeout('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                  method: 'POST',
                  headers: { 'Authorization': 'Bearer ' + GD.accessToken },
                  body: formMod,
                });
              }
            }
            driveOk = true;
          }
        } else if (SYNC.method === 'appsscript' || SYNC.method === 'dropbox') {
          setProgress(88, 'Sincronizando...');
          await cloudSave();
          driveOk = true;
        }
      } catch(e) {
        console.warn('Drive sync en importación falló:', e);
        // No fatal — los datos ya están guardados localmente
      }
    }

    // ── 7. Resumen final ───────────────────────────────────────────
    setProgress(100, driveOk ? '✓ Sincronización exitosa con Drive' : '✓ Guardado localmente');
    await new Promise(r => setTimeout(r, 600));
    prog.remove();

    // Resumen detallado
    const totalRegistros = Object.values(stats).reduce((s,n) => s+n, 0);
    const resumenLineas = TABLAS
      .filter(t => stats[t] > 0)
      .map(t => `${t}: +${stats[t]}`)
      .join(' | ');

    // Modal de éxito
    const ok = document.createElement('div');
    ok.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center';
    ok.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:400px;text-align:center">
        <div style="font-size:40px;margin-bottom:12px">${driveOk ? '☁️' : '💾'}</div>
        <div style="font-size:18px;font-weight:800;color:var(--green);margin-bottom:8px">
          ${driveOk ? '¡Sincronización Exitosa!' : '¡Importación Exitosa!'}
        </div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:16px">
          ${totalRegistros} registros importados${driveOk ? ' y distribuidos en Drive' : ' (guardados localmente)'}
        </div>
        ${resumenLineas ? `<div style="font-size:10px;background:var(--gray-ll);border-radius:8px;padding:8px 12px;text-align:left;margin-bottom:16px;color:var(--text3)">${resumenLineas}</div>` : ''}
        ${driveOk ? `<div style="font-size:11px;color:var(--green);margin-bottom:16px">✓ Distribuido en carpetas:<br>📋 Visitas · ✅ Tareas · 🧱 Materiales · 🔔 Alertas · 💰 Economía</div>` : ''}
        <button class="btn btn-p btn-w" onclick="this.closest('div[style]').remove();render()">Continuar →</button>
      </div>`;
    document.body.appendChild(ok);
    render();

  } catch(err) {
    prog.remove();
    toast('Error al importar: ' + err.message, 'var(--red)', 6000);
    console.error('importHistorial error:', err);
  }
}

function _ecoSortItems(arr){
  const _s=S.ecoSort||'';
  return [...arr].sort(function(a,b){
    if(_s==='fecha_asc') return (a.fecha||a.date||'').localeCompare(b.fecha||b.date||'');
    if(_s==='monto_asc') return (parseFloat(a.monto)||0)-(parseFloat(b.monto)||0);
    if(_s==='monto_desc') return (parseFloat(b.monto)||0)-(parseFloat(a.monto)||0);
    if(_s==='modif') return (b.date||b.fecha||'').localeCompare(a.date||a.fecha||'');
    // Default: más reciente primero (por fecha)
    return (b.fecha||b.date||'').localeCompare(a.fecha||a.date||'');
  });
}

function _fmt2(n){
  // Format number with 2 decimal places, es-AR locale
  return n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function _pct2(num,den){
  // Percentage with 2 decimal places
  if(!den)return '0,00%';
  return (num/den*100).toFixed(2).replace('.',',')+'%';
}

function renderEcoDistrib(){
  var tog=$('eco_distrib_toggle');
  var body=$('eco_distrib_body');
  if(!body)return;
  if(tog)tog.textContent=S.ecoDistribOpen?'▲':'▼';
  if(!S.ecoDistribOpen){body.style.display='none';return;}
  body.style.display='block';body.style.marginTop='12px';
  // Use egresos respecting active date filter
  var egrs=pf('economia').filter(function(e){
    if(e.tipo!=='egreso'||e.interno)return false;
    var d=e.fecha||e.date||'';
    if(S.ecoFechaDesde&&d<S.ecoFechaDesde)return false;
    if(S.ecoFechaHasta&&d>S.ecoFechaHasta)return false;
    return true;
  });
  var totalEgr=egrs.reduce(function(s,e){return s+(parseFloat(e.monto)||0);},0);
  if(!totalEgr){body.innerHTML='<div class="txxs tc3 mt-4">Sin egresos en el período seleccionado</div>';return;}
  // Group by rubro → ítems
  var rubros={};
  egrs.forEach(function(e){
    var rKey=(e.rubro||'').trim()||'Sin rubro';
    if(!rubros[rKey])rubros[rKey]={monto:0,items:{}};
    rubros[rKey].monto+=parseFloat(e.monto)||0;
    var iKey=(e.item||'').trim();
    if(iKey){
      if(!rubros[rKey].items[iKey])rubros[rKey].items[iKey]=0;
      rubros[rKey].items[iKey]+=parseFloat(e.monto)||0;
    }
  });
  var sorted=Object.entries(rubros).sort(function(a,b){return b[1].monto-a[1].monto;});
  var palette=['#0891b2','#7c3aed','#ea580c','#16a34a','#D97706','#db2777','#3b82f6','#dc2626','#475569','#059669'];
  var _periodoLabel=(S.ecoFechaDesde||S.ecoFechaHasta)
    ?'<div class="txxs mb-6" style="color:var(--cyan);font-style:italic">Período: '+(S.ecoFechaDesde?fmt(S.ecoFechaDesde):'inicio')+' — '+(S.ecoFechaHasta?fmt(S.ecoFechaHasta):'hoy')+'</div>'
    :'';
  var activeRub=S.ecoRubroFilter||'';
  var activeItem=S.ecoItemFilter||'';

function renameEcoItem(rubEnc,itemEnc){
  var rub=decodeURIComponent(rubEnc);
  var oldItem=decodeURIComponent(itemEnc);
  var nuevo=prompt('Renombrar ítem "'+oldItem+'" en rubro "'+rub+'":\n(Se actualizará en todos los movimientos del proyecto)',oldItem);
  if(nuevo===null)return;
  nuevo=nuevo.trim();
  if(!nuevo){toast('El nombre no puede estar vacío','var(--red)');return;}
  if(nuevo===oldItem)return;
  // Update all economia records in this project with matching rubro+item
  var count=0;
  (pf('economia')||[]).forEach(function(e){
    if((e.rubro||'')===(rub==='Sin rubro'?'':rub)&&(e.item||'')===(oldItem)){
      e.item=nuevo;
      e.updatedAt=nw();
      count++;
    }
  });
  if(!count){toast('No se encontraron movimientos para renombrar','var(--orange)');return;}
  sv();
  renderEcoDistrib();
  toast('Ítem renombrado en '+count+' movimiento'+(count>1?'s':'')+' ✓','var(--green)');
}

// ─── AUTOCOMPLETE HELPER ─────────────────────────────────────────
// setupAC(inputId, items[]) — attaches a live-filter dropdown to any input
function setupAC(inputId, items){
  var inp=$(inputId); if(!inp)return;
  // ensure wrap has position:relative
  var wrap=inp.parentNode; if(!wrap)return;
  if(getComputedStyle(wrap).position==='static')wrap.style.position='relative';
  // remove old list if re-opened
  var old=wrap.querySelector('.ac-list'); if(old)old.remove();
  var list=document.createElement('div'); list.className='ac-list';
  wrap.appendChild(list);
  var _active=-1;

  function highlight(q,str){
    if(!q)return str;
    var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return str.replace(re,'<strong>$1</strong>');
  }
  function show(q){
    var q2=(q||'').toLowerCase().trim();
    var filtered=q2
      ? items.filter(function(s){return s.toLowerCase().includes(q2);})
      : items.slice(0,10);
    filtered=filtered.slice(0,10);
    if(!filtered.length){list.style.display='none';return;}
    list.innerHTML=filtered.map(function(s,idx){
      return '<div class="ac-item" data-idx="'+idx+'" data-val="'+s.replace(/"/g,'&quot;')+'" onmousedown="event.preventDefault()">'
        +highlight(q2,s)+'</div>';
    }).join('');
    list.querySelectorAll('.ac-item').forEach(function(el){
      el.addEventListener('click',function(){
        inp.value=this.getAttribute('data-val');
        inp.dispatchEvent(new Event('input'));
        list.style.display='none';
        _active=-1;
      });
    });
    list.style.display='block';
    _active=-1;
  }
  function hide(){setTimeout(function(){list.style.display='none';_active=-1;},160);}
  inp.addEventListener('input',function(){show(this.value);});
  inp.addEventListener('focus',function(){show(this.value);});
  inp.addEventListener('blur',hide);
  inp.addEventListener('keydown',function(e){
    var its=list.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();_active=Math.min(_active+1,its.length-1);its.forEach(function(i,n){i.classList.toggle('ac-active',n===_active);});}
    else if(e.key==='ArrowUp'){e.preventDefault();_active=Math.max(_active-1,0);its.forEach(function(i,n){i.classList.toggle('ac-active',n===_active);});}
    else if(e.key==='Enter'&&_active>=0&&its[_active]){e.preventDefault();inp.value=its[_active].getAttribute('data-val');list.style.display='none';_active=-1;}
    else if(e.key==='Escape'){list.style.display='none';_active=-1;}
  });
}
// Devuelve listas únicas de conceptos/proveedores/rubros/ítems del proyecto actual
function _acConceptos(){return [...new Set((pf('economia')).map(function(e){return(e.concepto||'').trim();}).filter(Boolean))].sort();}
function _acProveedores(){
  var ep=(pf('economia')).map(function(e){return(e.proveedor||'').trim();}).filter(Boolean);
  var mp=(pf('matIngresos')).map(function(i){return(i.proveedor||'').trim();}).filter(Boolean);
  return [...new Set([...ep,...mp])].sort();
}
function _acRubros(){return [...new Set((pf('economia')).map(function(e){return(e.rubro||'').trim();}).filter(Boolean))].sort();}
function _acItems(rubro){
  // If rubro given, only show ítems used under that rubro; otherwise all
  var src=pf('economia');
  if(rubro)src=src.filter(function(e){return(e.rubro||'')===(rubro||'');});
  return [...new Set(src.map(function(e){return(e.item||'').trim();}).filter(Boolean))].sort();
}

function verEco(id){
  const item=D.economia.find(x=>x.id===id);if(!item)return;
  if(!item.imagen){toast('Sin imagen adjunta','var(--orange)');return;}
  // Placeholder: still pending Drive upload
  // Referencia IDB [foto:imgId] — recuperar desde IndexedDB local
  if(item.imagen.startsWith('[foto:')){
    var _idbImgId=item.imagen.slice(6,-1);
    idbGet('images',_idbImgId).then(function(rec){
      if(rec&&rec.data){
        openFileData(rec.data,item.concepto||'comprobante');
      } else {
        toast('Imagen pendiente de subir a Drive — Reconectá y volvé a intentar.','var(--orange)',5000);
      }
    }).catch(function(){toast('No se pudo recuperar la imagen local','var(--orange)',3000);});
    return;
  }
  // Placeholder genérico — imagen no disponible localmente
  if(item.imagen.startsWith('[foto')){
    toast('Imagen guardada offline — pendiente de subir a Drive. Reconectá Drive para sincronizar.','var(--orange)',5000);
    return;
  }
  // data:image → mostrar inline; data:pdf u otro → Blob URL; http → link directo
  const isDataImg=item.imagen.startsWith('data:image');
  const isHttpImg=item.imagen.startsWith('http')&&/thumbnail\?id=|\.(jpg|jpeg|png|gif|webp)/i.test(item.imagen);
  if(isDataImg||isHttpImg){
    const d=document.createElement('div');d.className='lightbox';d.style.zIndex='3000';d.onclick=()=>d.remove();

    document.body.appendChild(d);
  } else {
    // PDF, doc, o link de Drive — usar openFileData para evitar bloqueo Chrome
    openFileData(item.imagen, item.concepto||'comprobante');
  }
}
function delEcoImagen(id){
  if(!confirmDel('¿Eliminar imagen/comprobante de este movimiento?'))return;
  const item=D.economia.find(x=>x.id===id);if(!item)return;
  // Borrar de Drive si es URL de Drive
  if(item.imagen&&item.imagen.includes('drive.google.com')&&GD.accessToken){
    var _m=item.imagen.match(/[?&]id=([^&]+)/);
    if(_m&&_m[1]){
      fetch('https://www.googleapis.com/drive/v3/files/'+_m[1],{
        method:'DELETE',headers:{'Authorization':'Bearer '+GD.accessToken}
      }).catch(function(){});
    }
  }
  // Limpiar cola IDB si es referencia [foto:imgId]
  if(item.imagen&&item.imagen.startsWith('[foto:')){
    var _delId=item.imagen.slice(6,-1);
    idbDelete('images',_delId).catch(function(){});
    idbDelete('pending','pend_'+_delId).catch(function(){});
  }
  item.imagen='';
  item.imagenDeletedAt=nw(); // marca explícita de eliminación — sobrevive al merge aunque updatedAt pierda
  item.updatedAt=nw(); // necesario para que el merge "gana el más reciente" preserve la eliminación
  sv();render();toast('Imagen eliminada');
}

async function saveEEco(id){
  const concepto=$('eeq_concepto')?.value.trim();
  const monto=$('eeq_monto')?.value;
  if(!concepto){toast('Concepto obligatorio','var(--red)');return;}
  // Collect all form values before any await to avoid stale-ref if _silentMerge fires
  var _eeVals={concepto,monto:parseFloat(monto)||0,tipo:$('eeq_tipo')?.value||'egreso',
    fecha:$('eeq_fecha')?.value||td(),interno:!!($('eeq_interno')?.checked),
    medioPago:$('eeq_medio')?.value||'',proveedor:$('eeq_prov')?.value||'',
    rubro:($('eeq_rubro')?.value||'').trim(),item:($('eeq_item')?.value||'').trim()};
  var _eeImagen=null; // will be set if image selected
  const imgF=$('eeq_img');
  if(imgF&&imgF.files&&imgF.files.length){
    const _ef=imgF.files[0];
    const _eb64=await new Promise(res=>{const r=new FileReader();
      r.onload=async e=>res(_ef.type.startsWith('image/')
        ?await compressImage(e.target.result,800,0.7):e.target.result);
      r.readAsDataURL(_ef);});
    // Try immediate Drive upload to Economia folder; fallback: queue in IDB
    const _eecoFid=(S.proj&&GD.moduleFolders[S.proj+'_economia'])||GD.imagesFolderId||null;
    const _eecoImgId='eco_'+uid();
    const _isEecoImg=_eb64&&_eb64.startsWith('data:image');
    const _eecoFname=_isEecoImg?('eco_'+_eecoImgId+'.jpg'):('ecodoc_'+_eecoImgId);
    if(_eb64&&_eb64.startsWith('data:')&&GD.accessToken&&navigator.onLine){
      try{
        const _eup=await uploadImageToDrive(_eb64,_eecoFname,_eecoFid);
        if(_eup&&_eup.url){
          _eeImagen={url:_eup.url,deletedAt:null};
        } else {
          await queueImageUpload(_eecoImgId,_eb64,_eecoFname,S.proj,_eecoFid).catch(function(){});
          _eeImagen={url:'[foto:'+_eecoImgId+']',deletedAt:null};
        }
      }catch(e){
        await queueImageUpload(_eecoImgId,_eb64,_eecoFname,S.proj,_eecoFid).catch(function(){});
        _eeImagen={url:'[foto:'+_eecoImgId+']',deletedAt:null};
      }
    } else if(_eb64&&_eb64.startsWith('data:')){
      await queueImageUpload(_eecoImgId,_eb64,_eecoFname,S.proj,_eecoFid).catch(function(){});
      _eeImagen={url:'[foto:'+_eecoImgId+']',deletedAt:null};
    } else {
      _eeImagen={url:_eb64||'',deletedAt:null};
    }
  }
  // Re-fetch item after awaits to avoid stale ref if _silentMerge replaced D.economia
  const item=D.economia.find(x=>x.id===id);if(!item)return;
  item.concepto=_eeVals.concepto;item.monto=_eeVals.monto;
  item.tipo=_eeVals.tipo;item.fecha=_eeVals.fecha;item.interno=_eeVals.interno;
  item.medioPago=_eeVals.medioPago;item.proveedor=_eeVals.proveedor;
  item.rubro=_eeVals.rubro;item.item=_eeVals.item;
  if(_eeImagen){item.imagen=_eeImagen.url;item.imagenDeletedAt=_eeImagen.deletedAt;}
  item.updatedAt=nw();
  // Propagar cambios al matIngreso vinculado
  var _miSync=(D.matIngresos||[]).find(function(mi){return mi.ecoId===id;});
  if(_miSync){
    _miSync.proveedor=item.proveedor;
    _miSync.fecha=item.fecha;
    _miSync.observations='Desde Economía: '+concepto;
    var _ns=$('eeq_mat_estado')?.value;
    if(_ns) _miSync.estado=_ns;
    var _nq=parseFloat($('eeq_mat_qty')?.value||'');
    if(!isNaN(_nq)&&_nq>0) _miSync.qty=_nq;
    var _nu=$('eeq_mat_unit')?.value;
    if(_nu) _miSync.unit=_nu;
    _miSync.updatedAt=nw();
  }
  audit('economia','update',concepto.slice(0,30));
  sv();document.getElementById('eecoM')?.remove();render();
  toast('Movimiento actualizado'+(_miSync?' + material sincronizado':''));
}

    csv+='"'+fmt(e.fecha||e.date)+'","'+e.tipo+'","'+(e.concepto||'').replace(/"/g,"''")+'","'+(e.medioPago||'')+'","'+(e.proveedor||'').replace(/"/g,"''")+'","'+(e.rubro||'').replace(/"/g,"''")+'","'+(e.item||'').replace(/"/g,"''")+'","'+monto+'"\n';
  });
  const tIng=items.filter(i=>i.tipo==='ingreso').reduce((s,i)=>s+(parseFloat(i.monto)||0),0);
  const tEgr=items.filter(i=>i.tipo==='egreso').reduce((s,i)=>s+(parseFloat(i.monto)||0),0);
  csv+='"","","","","SALDO","'+(tIng-tEgr)+'"\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download='economia_'+(p?.name||'obra').replace(/\s+/g,'_')+'_'+td()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('CSV descargado — abre con Excel');
}

// 1. Sync bootstrap from localStorage (immediate render)
load();render();
// 2. Async: init IDB + attempt Drive load in background
(async()=>{
  await initIDB();
  // Try loading better data from IDB — ONLY merge data arrays, never overwrite user/session
  const idbData=await loadFromIDB();
  if(idbData&&idbData.projects&&idbData.projects.length>=(D.projects||[]).length){
    const DATA_KEYS=['projects','visitas','tareas','materiales','matIngresos',
                     'alertas','checklists','documentos','enlaces','comentarios',
                     'colaboradores','economia','auditLog'];
    DATA_KEYS.forEach(k=>{if(idbData[k]!==undefined)D[k]=idbData[k];});
    // Preserve live session state — never overwrite
    if(idbData.driveConfig)D.driveConfig={...D.driveConfig,...idbData.driveConfig};
    if(idbData.lastSync)D.lastSync=idbData.lastSync;
    // Rescue any surviving base64 images stored in D after IDB load
    await _rescueBase64BeforeSync().catch(function(){});
    // Repair bidirectional eco↔matIngreso links broken by old saves or sync gaps
    _repairEcoMatLinks();
    render();
  }
  // Initialize Google Auth library
  await initGoogleAuth();

  // En producción (Netlify): intentar auth silenciosa si ya hay token guardado
  // o si ya dio consentimiento antes (sin mostrar popup)
  if (window.location.protocol === 'https:' && window.google?.accounts?.oauth2) {
    const tokenRestored = loadGToken();
    if (tokenRestored) {
      // Token guardado y vigente → marcar conectado
      updateSyncIndicator('ok');
      toast('Drive conectado ✓', 'var(--green)', 2000);
      if (GD.online) {
        // Activar sync si estaba configurado como OAuth
        if (!SYNC.method) { SYNC.method = 'oauth'; saveSyncConfig(); }
        loadFromDriveAndMerge().catch(() => {});
      }
    } else {
      // Sin token guardado → intentar silent (no muestra popup)
      ensureAuth(false).then(ok => {
        if (ok) {
          updateSyncIndicator('ok');
          if (!SYNC.method) { SYNC.method = 'oauth'; saveSyncConfig(); }
          loadFromDriveAndMerge().catch(() => {});
        } else {
          updateSyncIndicator('noauth');
        }
      }).catch(() => updateSyncIndicator('noauth'));
    }
  } else {
    updateSyncIndicator('noauth');
  }

  // Process any pending image uploads
  if(navigator.onLine&&GD.accessToken){
    await processPendingImages();
  }

  // ── Polling: sincronizar con Drive cada 30 seg para ver cambios de otros dispositivos
  setInterval(function(){
    if(GD.accessToken&&navigator.onLine&&SYNC.method){
      loadFromDriveAndMerge(true).catch(function(){});
    }
  },30000);
})().catch(console.warn);

async function initGoogleAuth() {
  // Si ya está cargada, no hacer nada
  if (window.google && window.google.accounts && window.google.accounts.oauth2) return true;

  return new Promise((resolve) => {
    // Verificar si ya existe el script tag
    if (document.querySelector('script[src*="accounts.google.com/gsi/client"]')) {
      // Script ya en el DOM — esperar hasta que cargue
      const wait = setInterval(() => {
        if (window.google?.accounts?.oauth2) {
          clearInterval(wait);
          resolve(true);
        }
      }, 100);
      setTimeout(() => { clearInterval(wait); resolve(false); }, 8000);
      return;
    }

    // Cargar Google Identity Services dinámicamente
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.defer = true;

    script.onload = () => {
      // Esperar que google.accounts.oauth2 esté disponible
      const wait = setInterval(() => {
        if (window.google?.accounts?.oauth2) {
          clearInterval(wait);
          resolve(true);
        }
      }, 50);
      setTimeout(() => { clearInterval(wait); resolve(false); }, 5000);
    };

    script.onerror = () => {
      console.warn('No se pudo cargar Google Identity Services');
      resolve(false);
    };

    document.head.appendChild(script);
  });
}
