// ─── PERSISTENCIA DE SESIÓN GOOGLE ────────────────────────────────
const GD_TOKEN_KEY = 'obracontrol-gtoken';

function saveGToken(accessToken, expiresInSec) {
  const expiry = Date.now() + (expiresInSec || 3600) * 1000;
  try {
    localStorage.setItem(GD_TOKEN_KEY, JSON.stringify({ accessToken, expiry }));
  } catch(e) {}
  GD.accessToken = accessToken;
  GD.tokenExpiry = expiry;
}

function loadGToken() {
  try {
    const raw = localStorage.getItem(GD_TOKEN_KEY);
    if (!raw) return false;
    const { accessToken, expiry } = JSON.parse(raw);
    // Válido si quedan más de 5 minutos
    if (accessToken && expiry && (expiry - Date.now()) > 5 * 60 * 1000) {
      GD.accessToken = accessToken;
      GD.tokenExpiry = expiry;
      return true;
    }
  } catch(e) {}
  return false;
}

function clearGToken() {
  localStorage.removeItem(GD_TOKEN_KEY);
  GD.accessToken = null;
  GD.tokenExpiry = null;
}

// Intentar restaurar sesión al arrancar
loadGToken();

/* ===== MÓDULO: DRIVE / SYNC / IDB ===== */
function initIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('data'))
        db.createObjectStore('data', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('images'))
        db.createObjectStore('images', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pending'))
        db.createObjectStore('pending', { keyPath: 'id' });
    };
    req.onsuccess = (e) => { idb = e.target.result; GD.idbReady = true; resolve(idb); };
    req.onerror = () => reject(req.error);
  });
}

function idbPut(store, value) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// Save D to IndexedDB
async function saveToIDB() {
  if (!GD.idbReady) return;
  try {
    // Guardar D completo con fotos — IDB es el backup local completo
    // buildCleanData se usa SOLO para Drive (JSON sin base64)
    var snapshot = JSON.parse(JSON.stringify(D));
    snapshot._savedAt = nw();
    await idbPut('data', {key: 'main', data: snapshot, ts: nw()});
  } catch(e) {
    console.warn('IDB save failed:', e);
  }
}

// Load from IndexedDB
async function loadFromIDB() {
  if (!GD.idbReady) return null;
  try {
    const rec = await idbGet('data', 'main');
    if (!rec || !rec.data) return null;
    var d = rec.data;
    // Validar que los datos no estén vacíos antes de retornar
    var hasData = (d.visitas&&d.visitas.length>0) || (d.tareas&&d.tareas.length>0) ||
      (d.materiales&&d.materiales.length>0) || (d.economia&&d.economia.length>0) ||
      (d.projects&&d.projects.length>0) || d.user;
    if (!hasData && !d._savedAt) {
      console.warn('IDB: datos vacíos ignorados');
      return null;
    }
    return d;
  } catch(e) {
    console.warn('IDB load failed:', e);
    return null;
  }
}

// Queue a pending image upload
async function queueImageUpload(imageId, base64Data, fileName, projectId, folderId) {
  if (!GD.idbReady) return;
  // Also store image locally in IDB
  try {
    await idbPut('images',{id:imageId,data:base64Data,fileName,projectId,folderId:folderId||null,uploaded:false,ts:nw()});
    var pend=await idbGetAll('pending');
    if (!(pend||[]).some(function(p){return p.imageId===imageId;})) {
      await idbPut('pending',{id:'pend_'+imageId,type:'image',imageId,fileName,projectId,folderId:folderId||null,ts:nw()});
    }
  } catch(e){console.warn('queueImageUpload failed:',e);}
}

// ─── FETCH CON TIMEOUT (20s) ────────────────────────────────────
const DRIVE_TIMEOUT_MS = 20000;
async function fetchWithTimeout(url, opts, ms) {
  var t=ms||DRIVE_TIMEOUT_MS, ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},t);
  try {
    var r=await fetch(url, Object.assign({},opts||{},{signal:ctrl.signal}));
    clearTimeout(timer); return r;
  } catch(e) {
    clearTimeout(timer);
    if (e.name==='AbortError') throw new Error('Timeout Drive API ('+t/1000+'s)');
    throw e;
  }
}


function initGoogleAuth() {
  return new Promise((resolve) => {
    // Load GSI (Google Identity Services)
    if (window.google?.accounts?.oauth2) { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.onload = resolve;
    script.onerror = () => { console.warn('GSI load failed'); resolve(); };
    document.head.appendChild(script);
  });
}

async function ensureAuth(forcePrompt = false) {
  // 1. Token en memoria y no expirado → usar directo
  if (GD.accessToken && GD.tokenExpiry && (GD.tokenExpiry - Date.now()) > 60000) return true;

  // 2. No hay librería GSI cargada (file://)
  if (!window.google?.accounts?.oauth2) {
    // Intentar cargar GSI si estamos en HTTPS
    if (window.location.protocol === 'https:') {
      await initGoogleAuth();
      if (!window.google?.accounts?.oauth2) {
        toast('Google Sign-In no disponible', 'var(--orange)', 3000);
        return false;
      }
    } else {
      return false;
    }
  }

  if (!GAPI_CLIENT_ID || GAPI_CLIENT_ID.includes('YOUR_')) {
    toast('Configura tu Google Client ID en el código', 'var(--orange)', 5000);
    return false;
  }

  return new Promise((resolve) => {
    const onToken = (resp) => {
      if (resp.error) {
        // Si falla el intento silencioso, mostrar popup real
        if (resp.error === 'interaction_required' || resp.error === 'consent_required') {
          GD.tokenClient.requestAccessToken({ prompt: 'consent' });
        } else {
          clearGToken();
          resolve(false);
        }
        return;
      }
      const expiresIn = parseInt(resp.expires_in) || 3600;
      saveGToken(resp.access_token, expiresIn);
      // Guardar email preferido para no volver a preguntar la cuenta
      if(D.user?.email)try{localStorage.setItem('obracontrol-gaccount',D.user.email);}catch(e){};
      // Programar auto-refresh 5 min antes de expirar
      const refreshIn = Math.max((expiresIn - 300) * 1000, 60000);
      setTimeout(() => {
        GD.accessToken = null;
        // Auto-refresh silencioso en background
        if (SYNC.method === 'oauth' || GD.rootId) {
          ensureAuth(false).then(ok => {
            if (ok && GD.pendingSync) cloudSave();
          }).catch(() => {});
        }
      }, refreshIn);
      resolve(true);
    };

    // Recuperar email guardado para evitar el selector de cuenta en cada sesión
    var _hint=localStorage.getItem('obracontrol-gaccount')||D.user?.email||'';
    GD.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GAPI_CLIENT_ID,
      scope: GAPI_SCOPES,
      hint: _hint, // pre-selecciona la cuenta si está guardada
      callback: onToken,
    });

    // Primer intento: silencioso (sin popup si ya dio consentimiento antes)
    // forcePrompt=true solo cuando el usuario hace click explícito en "Conectar"
    GD.tokenClient.requestAccessToken({ prompt: forcePrompt ? 'consent' : '' });
  });
}

function driveHeaders() {

// ─── DRIVE FOLDER MANAGEMENT ────────────────────────────────────────
async function findOrCreateFolder(name, parentId = null) {
  const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false${parentId ? " and '"+parentId+"' in parents" : ''}`;
  const res = await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
    headers: driveHeaders()
  });
  const data = await res.json();
  if (data.files && data.files.length > 0) return data.files[0].id;

  // Create it
  const body = { name, mimeType: 'application/vnd.google-apps.folder' };
  if (parentId) body.parents = [parentId];
  const createRes = await fetchWithTimeout('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: driveHeaders(),
    body: JSON.stringify(body),
  });
  const folder = await createRes.json();
  return folder.id;
}

async function ensureFolders(projId) {
  // Mutex: prevent concurrent calls creating duplicate folders
  if (GD._ensureRunning) {
    var _wait=0;
    while(GD._ensureRunning&&_wait<5000){await new Promise(r=>setTimeout(r,80));_wait+=80;}
    return;
  }
  GD._ensureRunning=true;
  try {
  // Always ensure the root folder exists
  if (!GD.rootId) {
    GD.rootId = await findOrCreateFolder(DRIVE_ROOT, null);
  }
  // Legacy compat: folderId points to root
  if (!GD.folderId) GD.folderId = GD.rootId;

  // If a specific project is provided, create its subfolder + module folders
  const pid = projId || S.proj;
  if (!pid) return;

  // Create / find the obra folder: SISTEMA_GESTION_OBRAS / OBRA_NAME
  if (!GD.obraFolders[pid]) {
    const proj = D.projects.find(p => p.id === pid);
    const obraName = (proj ? proj.name.toUpperCase() : pid).replace(/[<>:"/\|?*]/g, '_');
    GD.obraFolders[pid] = await findOrCreateFolder(obraName, GD.rootId);
  }
  const obraFolderId = GD.obraFolders[pid];

  // Create module subfolders inside the obra folder
  for (const [mod, folderName] of Object.entries(DRIVE_MODULE_FOLDERS)) {
    const key = `${pid}_${mod}`;
    if (!GD.moduleFolders[key]) {
      GD.moduleFolders[key] = await findOrCreateFolder(folderName, obraFolderId);
    }
  }

  // Legacy compat
  GD.imagesFolderId = GD.moduleFolders[`${pid}_imagenes`] || null;
  GD.backupFolderId = GD.moduleFolders[`${pid}_backups`]  || null;
  GD.logsFolderId   = GD.moduleFolders[`${pid}_logs`]     || null;
  } catch(e){ console.error('ensureFolders error:',e); }
  finally { GD._ensureRunning=false; }
}

// ─── DRIVE FILE OPERATIONS ──────────────────────────────────────────
async function findMainFile(projId) {
  const cacheKey = 'global';
  if (GD._fileIds && GD._fileIds[cacheKey]) { GD.mainFileId = GD._fileIds[cacheKey]; return GD.mainFileId; }
  const fname = getDriveFileName(projId);
  const q = `name='${fname}' and trashed=false${GD.folderId ? " and '"+GD.folderId+"' in parents" : ''}`;
  const res = await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,modifiedTime)`, {
    headers: driveHeaders()
  });
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    GD.mainFileId = data.files[0].id;
    return GD.mainFileId;
  }
  return null;
}

// Build a clean D without base64 blobs (only keep Drive IDs)
function buildCleanData() {
  // Copia profunda sin base64 — para Drive (JSON liviano)
  var clean = JSON.parse(JSON.stringify(D));
  function strip(obj) {
    if (!obj) return;
    if (Array.isArray(obj)) { obj.forEach(strip); return; }
    if (typeof obj === 'object') {
      for (var k in obj) {
        if (typeof obj[k] === 'string' && obj[k].startsWith('data:')) {
          // Solo stripear base64 local — las URLs de Drive (https://) se conservan
          obj[k] = '[foto-local-no-sincronizada]';
        } else { strip(obj[k]); }
      }
    }
  }
  strip(clean);
  return clean;
}

// ── Repara vínculos rotos entre D.economia y D.matIngresos.
// Para registros viejos (previos al campo matIngresoId/ecoId), reconstruye
// la referencia cruzada en AMBAS direcciones para que badge y botón funcionen.
function _repairEcoMatLinks(){
  var mis=D.matIngresos||[];
  var eco=D.economia||[];
  // Paso 1: para cada matIngreso con ecoId, asegurar que la economia apunta de vuelta
  mis.forEach(function(mi){
    if(!mi.ecoId)return;
    var eItem=eco.find(function(e){return e.id===mi.ecoId;});
    if(eItem&&!eItem.matIngresoId){eItem.matIngresoId=mi.id;}
  });
  // Paso 2: para cada economia con matIngresoId, asegurar que el matIngreso apunta de vuelta
  eco.forEach(function(eItem){
    if(!eItem.matIngresoId)return;
    var mi=mis.find(function(m){return m.id===eItem.matIngresoId;});
    if(mi&&!mi.ecoId){mi.ecoId=eItem.id;}
  });
}

// ── Rescata imágenes base64 de D.economia (y archivos de otros módulos)
// antes de que buildCleanData las stripee. Las encola en IDB y reemplaza
// item.imagen con '[foto:imgId]' para que persistan y sean subibles.
async function _rescueBase64BeforeSync(){
  if(!GD.idbReady)return;
  var _tables=['tareas','alertas','visitas','comentarios','materiales','matIngresos'];
  // 1. economia.imagen
  var _eco=D.economia||[];
  for(var _ei=0;_ei<_eco.length;_ei++){
    var _eitem=_eco[_ei];
    if(_eitem.imagen&&_eitem.imagen.startsWith('data:')){
      var _eid2='eco_rescue_'+uid();
      var _isImg=_eitem.imagen.startsWith('data:image');
      var _efname=_isImg?('eco_'+_eid2+'.jpg'):('ecodoc_'+_eid2);
      var _efid=(S.proj&&GD.moduleFolders[S.proj+'_economia'])||GD.imagesFolderId||null;
      await queueImageUpload(_eid2,_eitem.imagen,_efname,_eitem.projectId||S.proj||'',_efid).catch(function(){});
      _eitem.imagen='[foto:'+_eid2+']';
    }
  }
  // 2. archivos.data en todos los módulos
  _tables.forEach(function(tbl){
    (D[tbl]||[]).forEach(function(item){
      (item.archivos||[]).forEach(function(af){
        if(af.data&&af.data.startsWith('data:')){
          var _afid='af_rescue_'+uid();
          var _isAfImg=af.data.startsWith('data:image');
          var _affname=_isAfImg?('arch_'+_afid+'.jpg'):('arch_'+_afid+'_'+af.name);
          var _afFid=(S.proj&&GD.moduleFolders[S.proj+'_'+tbl])||GD.imagesFolderId||null;
          queueImageUpload(_afid,af.data,_affname,item.projectId||S.proj||'',_afFid).catch(function(){});
          af.data='[foto:'+_afid+']';
        }
      });
    });
  });
}

async function saveToDrive() {
  // Guard: nunca subir D vacío — previene sobrescribir Drive con nada
  var _hasDat=(D.visitas&&D.visitas.length)||(D.tareas&&D.tareas.length)||
    (D.materiales&&D.materiales.length)||(D.economia&&D.economia.length)||
    (D.projects&&D.projects.length);
  if(!_hasDat){
    console.warn('saveToDrive: D vacío — abortando');return;
  }
  if (!GD.online) {
    await saveToIDB();
    GD.pendingSync = true;
    updateSyncIndicator('offline');
    return;
  }
  const ok = await ensureAuth();
  if (!ok) { await saveToIDB(); return; }

  try {
    await ensureFolders(S.proj);
    updateSyncIndicator('syncing');
    // ── Rescue: queue any raw base64 imagen/archivos before buildCleanData strips them
    await _rescueBase64BeforeSync();
    // ── Read-merge-write: merge Drive snapshot before uploading ──
    // Prevents overwriting deletions/edits made on other devices.
    // Without this, Device B's stale auto-save would undo Device A's deletes.
    try {
      var _driveSnap=await loadFromDrive();
      if(_driveSnap){
        var _merged=_silentMerge(_driveSnap);
        if(_merged){
          // Data changed after merge — save locally and update UI (if no modal open)
          await saveToIDB();
          localStorage.setItem(SK,JSON.stringify(D));
          if(!document.querySelector('.mo.open'))render();
        }
      }
    }catch(_me){console.warn('Pre-upload merge skipped:',_me);}
    const content = JSON.stringify(buildCleanData(), null, 2);
    const blob = new Blob([content], { type: 'application/json' });
    const fname = getDriveFileName(S.proj);

    const fileId = await findMainFile(S.proj);
    let url, method;
    if (fileId) {
      // Update existing file
      url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`;
      method = 'PATCH';
    } else {
      // Create new file with metadata
      url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      method = 'POST';
    }

    if (!fileId) {
      // Multipart upload for new file
      const meta = { name: fname, parents: [GD.folderId], mimeType: 'application/json' }; if (!GD._fileIds) GD._fileIds = {}; GD._fileIds['global'] = GD.mainFileId;
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      form.append('file', blob);
      const res = await fetchWithTimeout('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + GD.accessToken },
        body: form,
      });
      const file = await res.json();
      GD.mainFileId = file.id;
      if (!GD._fileIds) GD._fileIds = {}; GD._fileIds['global'] = file.id;
    } else {
      // Simple media update
      await fetch(url, {
        method,
        headers: { 'Authorization': 'Bearer ' + GD.accessToken, 'Content-Type': 'application/json' },
        body: content,
      });
    }

    D.lastSync = nw();
    await saveToIDB(); // keep IDB in sync too
    localStorage.setItem(SK, JSON.stringify(D)); // fallback
    GD.pendingSync = false;
    updateSyncIndicator('ok');
    // Guardar log .txt en Drive (máx una vez cada 2 min)
    var _now=Date.now();
    if(!GD._lastLogSave||(_now-GD._lastLogSave)>120000){
      GD._lastLogSave=_now;
      saveLogToDrive().catch(function(){});
    }
  } catch(e) {
    console.error('Drive save failed:', e);
    await saveToIDB();
    updateSyncIndicator('error');
    if(GD.online&&GD.accessToken&&!GD._retrying){
      GD._retrying=true;
      setTimeout(async function(){GD._retrying=false;if(GD.online&&GD.accessToken)await saveToDrive();},10000);
      toast('Error Drive — reintentando en 10s...','var(--orange)',4000);
    } else{GD._retrying=false;toast('Drive no disponible — guardado local activo','var(--orange)',3000);}
  }
}

function buildLogContent(){
  // Genera exactamente el mismo contenido que "Informe completo (TXT)" del módulo Informes
  const p=D.projects?.find(x=>x.id===S.proj);
  const sep='-'.repeat(50);
  const NL='\n';
  let c='OBRACONTROL PRO v9.0 — INFORME COMPLETO'+NL+sep+NL;
  c+='Obra: '+(p?.name||'')+' | Cliente: '+(p?.client||'')+' | Estado: '+(p?.status||'')+NL;
  c+='Ubicacion: '+(p?.location||'-')+' | Director: '+(p?.director||'-')+NL;
  c+='Inicio: '+(fmts(p?.startDate)||'-')+' | Fin: '+(fmts(p?.endDate)||'-')+NL;
  c+='Generado: '+new Date().toLocaleString('es-AR')+NL+sep+NL+NL;
  const vis=pf('visitas').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  c+='VISITAS ('+vis.length+')'+NL+sep+NL;
  vis.forEach(function(v,i){
    c+=(i+1)+'. '+fmt(v.date)+' ['+(v.estado||'borrador')+'] — '+v.title+NL;
    if(v.description)c+='   Desc: '+v.description+NL;
    if(v.observations)c+='   Obs: '+v.observations+NL;
    const lT=(D.tareas||[]).filter(function(t){return t.visitaId===v.id;});
    if(lT.length)c+='   Tareas: '+lT.map(function(t){return t.title+' ['+t.status+']';}).join(', ')+NL;

async function saveLogToDrive(){
  if(!GD.logsFolderId||!GD.accessToken)return;
  try{
    const p=D.projects?.find(x=>x.id===S.proj);
    const fecha=new Date().toISOString().slice(0,10);
    const obraNom=p?p.name.replace(/[^a-zA-Z0-9\-_]/g,'_'):'global';
    const fname='ObraControl_Informe_'+obraNom+'_'+fecha+'.txt';
    const content=buildLogContent();
    // Buscar si ya existe el archivo de hoy — URL construida correctamente
    const _q="name='"+fname+"' and '"+GD.logsFolderId+"' in parents and trashed=false";
    const _srchUrl='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(_q)+'&fields=files(id)';
    const srch=await fetchWithTimeout(_srchUrl,{headers:{Authorization:'Bearer '+GD.accessToken}});
    const srchJ=await srch.json();
    const existId=srchJ.files&&srchJ.files[0]?srchJ.files[0].id:null;
    if(existId){
      // Actualizar contenido del archivo existente
      const patchRes=await fetchWithTimeout(
        'https://www.googleapis.com/upload/drive/v3/files/'+existId+'?uploadType=media',
        {method:'PATCH',headers:{Authorization:'Bearer '+GD.accessToken,'Content-Type':'text/plain;charset=utf-8'},body:'﻿'+content}
      );
      if(!patchRes.ok){console.warn('Log PATCH failed:',patchRes.status,await patchRes.text().catch(function(){return '';}));}
    } else {
      // Crear nuevo archivo de log para hoy
      const meta={name:fname,parents:[GD.logsFolderId],mimeType:'text/plain'};
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file',new Blob(['﻿'+content],{type:'text/plain;charset=utf-8'}));
      const createRes=await fetchWithTimeout(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
        {method:'POST',headers:{Authorization:'Bearer '+GD.accessToken},body:form}
      );
      if(!createRes.ok){console.warn('Log CREATE failed:',createRes.status);}
    }
  }catch(e){console.warn('saveLogToDrive:',e);}
}

async function loadFromDrive() {

// ─── IMAGE UPLOAD TO DRIVE ────────────────────────────────────────────
async function uploadImageToDrive(base64Data, fileName, folderId) {
  const ok = await ensureAuth();
  if (!ok) return null;
  try {
    await ensureFolders();
    // Convert base64 to blob
    const byteStr = atob(base64Data.split(',')[1]);
    const mime = base64Data.match(/data:([^;]+)/)[1];
    const arr = new Uint8Array(byteStr.length);
    for (let i = 0; i < byteStr.length; i++) arr[i] = byteStr.charCodeAt(i);
    const imgBlob = new Blob([arr], { type: mime });
    // Use module-specific folder if provided, else fallback to imagenes folder
    const targetFolder = folderId || GD.imagesFolderId;
    const meta = { name: fileName || ('img_' + uid() + '.jpg'), parents: [targetFolder] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', imgBlob);

    const res = await fetchWithTimeout('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + GD.accessToken },
      body: form,
    });
    const file = await res.json();
    if (!file.id) return null;

    // Make publicly readable (viewer)
    await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files/${file.id}/permissions`, {
      method: 'POST',
      headers: driveHeaders(),
      body: JSON.stringify({ role: 'reader', type: 'anyone' }),
    });

    // Return direct thumbnail URL
    return {
      driveId: file.id,
      url: `https://drive.google.com/thumbnail?id=${file.id}&sz=w800`,
      viewUrl: `https://drive.google.com/file/d/${file.id}/view`,
    };
  } catch(e) {
    console.error('Image upload failed:', e);
    return null;
  }
}

// Process pending image uploads from IDB queue
async function processPendingImages() {
  if (!GD.online || !GD.idbReady) return;
  const pending = await idbGetAll('pending');
  const imagePending = pending.filter(p => p.type === 'image');
  if (!imagePending.length) return;

  var _up=0,_fail=0;
  for(var _i=0;_i<imagePending.length;_i++){
    var item=imagePending[_i];
    try{
      var imgRec=await idbGet('images',item.imageId);
      if(!imgRec||imgRec.uploaded){await idbDelete('pending',item.id).catch(function(){});continue;}
      var result=await uploadImageToDrive(imgRec.data,imgRec.fileName,imgRec.folderId||null);
      if(result){
        replaceImageRef(D,item.imageId,result.url);
        // Actualizar updatedAt en TODOS los ítems que recibieron la URL real.
        // Sin esto, si Drive y local tienen el mismo timestamp, Drive gana en _silentMerge
        // y revierte la URL real al placeholder [foto:imgId] — causando ícono de nube.
        var _newUrl=result.url;
        var _photoTbls=['visitas','tareas','materiales','matIngresos','alertas','comentarios'];
        _photoTbls.forEach(function(tbl){
          (D[tbl]||[]).forEach(function(x){
            if((x.photos||[]).some(function(ph){return (typeof ph==='string'?ph:(ph&&ph.url)||'')===_newUrl;})){
              x.updatedAt=nw();
            }
          });
        });
        (D.economia||[]).forEach(function(e){if(e.imagen===_newUrl)e.updatedAt=nw();});
        imgRec.uploaded=true;imgRec.driveId=result.driveId;imgRec.driveUrl=_newUrl;
        await idbPut('images',imgRec);await idbDelete('pending',item.id);_up++;
      } else _fail++;
    }catch(e){console.warn('pending upload failed:',item.imageId,e);_fail++;}
  }
  if(_up>0){saveToDrive();toast(_up+' foto(s) subidas a Drive ✓','var(--green)',2500);}
  updatePendingBadge().catch(function(){});
}

function replaceImageRef(obj, oldId, newUrl) {
  if (!obj) return;
  if (Array.isArray(obj)) { obj.forEach(i => replaceImageRef(i, oldId, newUrl)); return; }
  if (typeof obj === 'object') {
    for (const k of Object.keys(obj)) {
      if (obj[k] === oldId || obj[k] === '[foto:'+oldId+']') { obj[k] = newUrl; }
      else { replaceImageRef(obj[k], oldId, newUrl); }
    }
  }
}

// ─── AUTO-VERSIONING / BACKUP ────────────────────────────────────────
async function createVersionBackup(reason = 'auto') {
  if (!GD.online) return;
  const ok = await ensureAuth();
  if (!ok) return;
  try {
    await ensureFolders(S.proj);
    const p = D.projects?.find(x => x.id === S.proj);
    const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
    const name = `${DRIVE_FILE_NAME.replace('.json','')}_${ts}_${reason}.json`;
    const content = JSON.stringify({
      version: '5.5',
      backupDate: nw(),
      reason,
      project: p,
      data: buildCleanData(),
    }, null, 2);

    const meta = { name, parents: [GD.backupFolderId], mimeType: 'application/json' };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', new Blob([content], { type: 'application/json' }));
    await fetchWithTimeout('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + GD.accessToken },
      body: form,
    });

    // Prune old backups: keep only last 20
    const q = `'${GD.backupFolderId}' in parents and trashed=false`;
    const res = await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,createdTime)&orderBy=createdTime`, {
      headers: driveHeaders()
    });
    const data = await res.json();
    if (data.files && data.files.length > 20) {
      const toDelete = data.files.slice(0, data.files.length - 20);
      for (const f of toDelete) {
        await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files/${f.id}`, {
          method: 'DELETE', headers: driveHeaders()
        });
      }
    }
    console.log('Backup created:', name);
  } catch(e) {
    console.warn('Backup failed:', e);
  }
}

// ─── DEBOUNCED AUTO-SAVE ─────────────────────────────────────────────
function scheduleSync(delay = 3000) {
  if (GD.syncTimer) clearTimeout(GD.syncTimer);
  GD.syncTimer = setTimeout(async () => {
    await saveToIDB(); // Always save locally first
    localStorage.setItem(SK, JSON.stringify(D)); // localStorage fallback
    if (GD.online && GD.accessToken) {
      await saveToDrive();
    } else if (GD.online && !GD.accessToken) {
      // Don't auto-prompt, just save locally
      updateSyncIndicator('offline');
    }
  }, delay);
}

window.addEventListener('online', async () => {
  GD.online = true;
  updateSyncIndicator('syncing');
  if (GD.accessToken) {
    await processPendingImages();
    await saveToDrive();
  } else {
    // Intentar auth silenciosa al reconectarse
    ensureAuth(false).then(ok => { if(ok) { saveToDrive(); } }).catch(()=>{});
  }
  toast('Conexión restaurada — sincronizando...', 'var(--green)', 2500);
});

window.addEventListener('offline', () => {
  GD.online = false;
  updateSyncIndicator('offline');
  toast('Sin conexión — guardando localmente', 'var(--orange)', 2500);
});

// Session end: create version backup
window.addEventListener('beforeunload', () => {
  // Synchronous localStorage save (can't await async here)
  localStorage.setItem(SK, JSON.stringify(D));
  // Queue async backup (best-effort)
  if (GD.online && GD.accessToken) {
    navigator.sendBeacon && navigator.sendBeacon('/ping'); // keep alive hint
    createVersionBackup('session_end');
  }
});

// ─── SYNC STATUS INDICATOR ──────────────────────────────────────────
function updateSyncIndicator(status) {
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  const cfg = {
    ok:      { color: 'var(--green)',  icon: '✓', title: 'Sincronizado con Drive' },
    syncing: { color: 'var(--pri)',    icon: '↻', title: 'Guardando...' },
    offline: { color: 'var(--orange)', icon: '⊘', title: 'Sin conexión — guardado local' },
    error:   { color: 'var(--red)',    icon: '⚠', title: 'Error al guardar en Drive' },
    noauth:  { color: 'var(--gray-l)', icon: '○', title: 'Drive no conectado' },
  };
  const c = cfg[status] || cfg.noauth;
  el.style.color = c.color;
  el.title = c.title;
  el.textContent = c.icon;
  el.dataset.status = status;
  // Mostrar badge de fotos pendientes si hay cola
  updatePendingBadge();
}

async function updatePendingBadge() {
  if (!GD.idbReady) return;
  try {
    const pending = await idbGetAll('pending');
    const imgPending = (pending || []).filter(p => p.type === 'image').length;
    let badge = document.getElementById('pendingBadge');
    if (imgPending > 0) {
      if (!badge) {
        badge = document.createElement('span');
        badge.id = 'pendingBadge';
        badge.style.cssText = 'position:absolute;top:-4px;right:-4px;background:var(--orange);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;pointer-events:none';
        const si = document.getElementById('syncIndicator');
        if (si) { si.style.position='relative'; si.appendChild(badge); }
      }
      badge.textContent = imgPending;
      badge.title = imgPending + ' foto(s) pendientes de subir a Drive';
    } else if (badge) {
      badge.remove();
    }
  } catch(e) {}
}

async function loadAll(){
  // Step 1: Initialize IndexedDB
  try{ await initIDB(); }catch(e){ console.warn('IDB init failed:', e); }

  // Step 2: Check embedded data (shared HTML)
  try{
    if(window.__PRELOADED__){
      D={...D,...window.__PRELOADED__};
      mergeLocalData();
      await saveToIDB();
    }
  }catch(e){}

  // Step 3: Try IndexedDB (more reliable than localStorage)
  const idbData = await loadFromIDB();
  if(idbData){
    D={...D,...idbData};
  } else {
    // Fallback to localStorage (con validación)
    try{
      const s=localStorage.getItem(SK);
      if(s){
        const d=JSON.parse(s);
        var _lv=(d.projects&&d.projects.length)||(d.visitas&&d.visitas.length)||
          (d.tareas&&d.tareas.length)||(d.economia&&d.economia.length)||d.user;
        if(_lv)D={...D,...d};
        else console.warn('loadAll LS fallback vacío ignorado');
      }
    }catch(e){console.warn('loadAll LS error:',e);}
  }

  // Step 4: Handle URL params
  try{
    const params=new URLSearchParams(window.location.search);
    const projParam=params.get('proj');
    if(projParam&&D.projects&&D.projects.find(p=>p.id===projParam)){
      S.proj=projParam;S.mod='dashboard';
    }
  }catch(e){}

  // Step 5: If authenticated, load from Drive (authoritative source)
  // Happens in background after initial render — non-blocking
  if(GD.accessToken && navigator.onLine){
    loadFromDriveAndMerge();
  }

  return D;
}
function load(){

  try{

    if(s){
      const d=JSON.parse(s);

function mergeLocalData(){
  try{
    const ls=localStorage.getItem(SK);if(!ls)return;
    const ld=JSON.parse(ls);
    const arrKeys=['visitas','tareas','materiales','matIngresos','alertas','checklists','documentos','enlaces','comentarios','colaboradores','economia','auditLog','projects'];
    arrKeys.forEach(k=>{
      if(ld[k]&&Array.isArray(ld[k])){
        const existing=new Set((D[k]||[]).map(x=>x.id));
        (ld[k]||[]).forEach(item=>{if(!existing.has(item.id))D[k].push(item);});

    });

}
// ── _silentMerge: merge Drive snapshot into local D without any I/O, render, or toast.
// Called both from loadFromDriveAndMerge and from saveToDrive (read-merge-write pattern).
// Returns true if any data actually changed (items added/removed/updated).
function _silentMerge(driveData){
  if(!driveData)return false;
  var arrKeys=['visitas','tareas','materiales','matIngresos','alertas','checklists','documentos','enlaces','comentarios','colaboradores','economia','auditLog','projects'];
  // Unir tombstones de Drive + local
  var driveTombs=(driveData.tombstones&&Array.isArray(driveData.tombstones))?driveData.tombstones:[];
  var localTombs=D.tombstones||[];
  var tombMap=new Map();
  driveTombs.concat(localTombs).forEach(function(t){if(t&&t.id&&(!tombMap.has(t.id)||new Date(t.ts)>new Date(tombMap.get(t.id).ts)))tombMap.set(t.id,t);});
  var allTombs=Array.from(tombMap.values());
  var tombIds=new Set(allTombs.map(function(t){return t.id;}));
  var changed=false;
  arrKeys.forEach(function(k){
    var dArr=(driveData[k]&&Array.isArray(driveData[k]))?driveData[k]:[];
    var lArr=D[k]||[];
    // Filtrar tombstoned de ambas fuentes antes de mergear
    dArr=dArr.filter(function(x){return !tombIds.has(x.id);});
    lArr=lArr.filter(function(x){return !tombIds.has(x.id);});
    if(!dArr.length){if(D[k]&&D[k].length!==lArr.length)changed=true;D[k]=lArr;return;}
    if(!lArr.length){if(D[k]&&D[k].length!==dArr.length)changed=true;D[k]=dArr;return;}
    // Merge: Drive como base, agregar/actualizar con local
    var merged=[...dArr];
    lArr.forEach(function(li){
      if(!li.id)return;
      var di=merged.find(function(d){return d.id===li.id;});
      if(!di){
        merged.push(li);changed=true; // Solo en local (y no está en tombstones) → conservar
      } else {
        // En ambos → gana el más reciente (updatedAt tiene prioridad sobre date)
        var ld=new Date(li.updatedAt||li.date||li.timestamp||0).getTime();
        var dd=new Date(di.updatedAt||di.date||di.timestamp||0).getTime();
        if(ld>dd){Object.assign(di,li);changed=true;}
        // Restaurar fotos locales si Drive tiene placeholders (stripped base64)
        if(li.photos&&di.photos&&di.photos.length){
          di.photos=di.photos.map(function(dp,idx){
            var du=typeof dp==='string'?dp:(dp&&dp.url)||'';
            var lp=li.photos[idx];
            // Restaurar localUrl para display inmediato si Drive lo perdió o lo strippeó
            // dp.localUrl puede ser '[foto-local-no-sincronizada]' (truthy pero inútil) — restaurar igual
            var _localUrlOk=lp&&typeof lp==='object'&&lp.localUrl&&lp.localUrl.startsWith('data:');
            var _driveNoLocal=typeof dp==='object'&&(!dp.localUrl||dp.localUrl.startsWith('[foto-local'));
            if(_localUrlOk&&_driveNoLocal){dp=Object.assign({},dp,{localUrl:lp.localUrl});}
            if(du.startsWith('[foto')){
              if(lp){var lu=typeof lp==='string'?lp:(lp&&lp.url)||'';
                if(lu&&!lu.startsWith('[foto')){
                  var _llu=(typeof lp==='object'&&lp.localUrl)||null;
                  var _merged=typeof dp==='string'?lu:Object.assign({},dp,{url:lu});
                  if(_llu&&typeof _merged==='object')_merged.localUrl=_llu;
                  return _merged;
                }
              }
            }
            return dp;
          });
        }
        // ── Imagen merge: tres reglas en orden de prioridad ──────────────────────
        // 1. imagenDeletedAt: borrado explícito. Gana siempre sobre cualquier URL,
        //    independientemente de timestamps (resuelve clock-skew y race conditions).
        //    Se usa el imagenDeletedAt MÁS RECIENTE entre local y Drive.
        //    Se anula sólo si una de las partes tiene una nueva imagen subida DESPUÉS del borrado.
        var _liDA=li.imagenDeletedAt?new Date(li.imagenDeletedAt).getTime():0;
        var _diDA=di.imagenDeletedAt?new Date(di.imagenDeletedAt).getTime():0;
        if(_liDA>0||_diDA>0){
          var _bestDelAt=Math.max(_liDA,_diDA);
          di.imagenDeletedAt=(_liDA>=_diDA?(li.imagenDeletedAt):di.imagenDeletedAt)||null;
          // Verificar si alguna parte tiene una imagen explícitamente subida DESPUÉS del borrado
          var _liNewImg=li.imagen&&li.imagen.startsWith('http')&&!li.imagenDeletedAt&&li.updatedAt&&new Date(li.updatedAt).getTime()>_bestDelAt;
          var _diNewImg=di.imagen&&di.imagen.startsWith('http')&&!di.imagenDeletedAt&&di.updatedAt&&new Date(di.updatedAt||di.date||0).getTime()>_bestDelAt;
          if(!_liNewImg&&!_diNewImg){di.imagen='';changed=true;} // borrado gana
        }
        // 2. _imgPri: upgrading de placeholder → URL real.
        //    SOLO se aplica cuando di tiene un placeholder (nunca sobreescribir un vacío intencional).
        //    Evita que [foto:], [foto-local] o base64 prevalezca sobre la URL de Drive.
        var _imgPri=function(v){if(!v||v==='')return 0;if(v==='[foto-local-no-sincronizada]')return 1;if(v.startsWith('data:'))return 2;if(v.startsWith('[foto:'))return 3;if(v.startsWith('http'))return 4;return 0;};
        if(di.imagen&&_imgPri(di.imagen)>0&&li.imagen&&_imgPri(li.imagen)>_imgPri(di.imagen)){di.imagen=li.imagen;changed=true;}
        // Restore archivos data if Drive stripped them
        if(li.archivos&&di.archivos&&di.archivos.length){
          di.archivos=di.archivos.map(function(da){
            if(da.data&&da.data.startsWith('[foto-local')){
              var la=(li.archivos||[]).find(function(x){return x.id===da.id;});
              if(la&&la.data&&!la.data.startsWith('[foto-local'))da.data=la.data;
            }
            return da;
          });
        }
        // Preserve ecoId / materialId / matIngresoId links — never overwrite a live link with null from Drive
        if(!di.ecoId&&li.ecoId)di.ecoId=li.ecoId;
        if(!di.materialId&&li.materialId)di.materialId=li.materialId;
        if(!di.matIngresoId&&li.matIngresoId)di.matIngresoId=li.matIngresoId;
        // Preserve matNombre / nombre when local has value and Drive doesn't
        if(!di.matNombre&&li.matNombre)di.matNombre=li.matNombre;
      }
    });
    if(merged.length!==D[k].length)changed=true;
    D[k]=merged;
  });
  D.tombstones=allTombs;
  applyTombstones(allTombs,D); // Aplicar eliminaciones de todos los dispositivos
  // ── Cascade tombstone: si un material está tombstoned, tombstonear sus matIngresos huérfanos.
  // Esto protege contra deletes que no llamaron addTombstone en cascada (por bugs previos o
  // código antiguo). Es seguro ejecutar siempre — addTombstone es idempotente.
  var _tombedMats=new Set(allTombs.filter(function(t){return t.tbl==='materiales';}).map(function(t){return t.id;}));
  if(_tombedMats.size>0){
    (D.matIngresos||[]).filter(function(mi){return _tombedMats.has(mi.materialId);}).forEach(function(mi){
      if(!tombIds.has(mi.id)){addTombstone('matIngresos',mi.id);changed=true;}
    });
    // Si se agregaron nuevos tombstones, aplicarlos ahora
    if(changed)applyTombstones(D.tombstones,D);
  }
  _repairEcoMatLinks(); // Rebuild any broken eco↔matIngreso links after merge
  _repairProjectIds();  // Fix items with missing or mismatched projectId
  return changed;
}
// ── Saneamiento: asegura que todos los ítems de enlace/documento de una visita
// tengan el projectId correcto y elimina referencias huérfanas.
function _repairProjectIds(){
  var projs=D.projects||[];
  if(!projs.length)return; // sin proyectos cargados — no tocar nada (evita borrar todo en estado inicial)
  var known=new Set(projs.map(function(p){return p.id;}));
  // Para tablas con projectId explícito: eliminar items de proyectos que no existen
  ['visitas','tareas','materiales','matIngresos','alertas','checklists','documentos','enlaces','comentarios','colaboradores','economia'].forEach(function(tbl){
    if(!D[tbl])return;
    var before=D[tbl].length;
    D[tbl]=D[tbl].filter(function(x){
      if(!x.projectId)return true; // sin projectId: conservar (legacy)
      return known.has(x.projectId); // solo conservar si el proyecto existe
    });
    // Solo logear si realmente removió algo
    if(D[tbl].length<before)console.warn('_repairProjectIds: removed '+(before-D[tbl].length)+' orphan(s) from '+tbl);
  });
}

async function loadFromDriveAndMerge(silent){
  try{
    if(!silent)updateSyncIndicator('syncing');
    const driveData = await loadFromDrive();
    if(!driveData){updateSyncIndicator('noauth');return;}
    _silentMerge(driveData);
    D.lastSync=nw();
    await saveToIDB();
    localStorage.setItem(SK,JSON.stringify(D));
    updateSyncIndicator('ok');
    // No re-renderizar si hay un modal abierto — evita destruir formularios en uso
    if(!document.querySelector('.mo.open'))render();
    if(!silent)toast('Datos sincronizados con Drive','var(--green)',2500);
  }catch(e){
    console.warn('Drive load failed:',e);
    if(!silent)updateSyncIndicator('error');
  }
}

function compressImage(dataUrl,maxW,quality){return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');const w=Math.min(img.width,maxW||800);const h=img.height*(w/img.width);c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality||0.6));}catch(e){resolve(dataUrl);}};img.onerror=()=>resolve(dataUrl);img.src=dataUrl;});}
async function readPhotos(inputId, modKey){
  var el=$(inputId);
  if(!el||!el.files||!el.files.length)return [];
  var files=Array.from(el.files);
  var results=[];
  // Determine target Drive folder: module-specific folder or fallback to imagenes
  var fid=(modKey&&S.proj&&GD.moduleFolders[S.proj+'_'+modKey])||GD.imagesFolderId||null;
  for(var i=0;i<files.length;i++){
    var file=files[i];
    var compressed=await new Promise(function(res){
      var rd=new FileReader();
      rd.onload=async function(e){ res(await compressImage(e.target.result,1024,0.72)); };
      rd.readAsDataURL(file);
    });
    // Si Drive disponible: subir como archivo a la carpeta del módulo
    if(GD.online&&GD.accessToken&&(fid||GD.imagesFolderId)){
      try{
        var result=await uploadImageToDrive(compressed,'foto_'+uid()+'.jpg',fid);
        if(result&&result.url){ results.push(result.url); continue; }
      }catch(ex){ console.warn('Foto Drive upload failed:',ex); }
    }
    // Sin Drive: guardar en IDB y usar placeholder (processPendingImages lo subirá luego)
    if(GD.idbReady){
      var imgId='img_'+uid();
      try{
        await queueImageUpload(imgId,compressed,'foto_'+i+'.jpg',S.proj,fid);
        results.push('[foto:'+imgId+']');
        continue;
      }catch(e){}
    }
    // Último recurso: base64 local
    results.push(compressed);
  }
  return results;
}

// Chrome bloquea data: URIs en tabs nuevas. Convertimos a Blob URL primero.
function openFileData(dataUrl, name){
  if(!dataUrl)return;
  if(dataUrl.startsWith('http')||dataUrl.startsWith('blob:')){window.open(dataUrl,'_blank');return;}
  if(dataUrl.startsWith('data:')){
    try{
      var arr=dataUrl.split(',');
      var mime=(arr[0].match(/:(.*?);/)||[])[1]||'application/octet-stream';
      var bstr=atob(arr[1]);
      var u8=new Uint8Array(bstr.length);
      for(var _i=0;_i<bstr.length;_i++)u8[_i]=bstr.charCodeAt(_i);
      var blob=new Blob([u8],{type:mime});
      var burl=URL.createObjectURL(blob);
      var win=window.open(burl,'_blank');
      setTimeout(function(){URL.revokeObjectURL(burl);},30000);
      if(!win)toast('Activá ventanas emergentes para ver el archivo','var(--orange)',4000);
    }catch(e){console.warn('openFileData error:',e);toast('No se pudo abrir el archivo','var(--red)',3000);}
    return;
  }
  window.open(dataUrl,'_blank');
}

      var maxH=window.innerHeight*0.68;
      var scale=Math.min(maxW/img.width, maxH/img.height, 1);
      canvas.width=Math.round(img.width*scale);

          e.preventDefault();

            pe.ctx.putImageData(pe.snapshot,0,0);

              pe.ctx.strokeRect(pe.startX,pe.startY,pt.x-pe.startX,pt.y-pe.startY);
            } else if(pe.tool==='arrow'){
              peDrawArrow(pe.ctx,pe.startX,pe.startY,pt.x,pt.y,col,sz);
            }
          }
        },{passive:false});
      });

        canvas.addEventListener(ev,function(e){

    };

function peGetPoint(e,canvas){
  var rect=canvas.getBoundingClientRect();
  var scaleX=canvas.width/rect.width;
  var scaleY=canvas.height/rect.height;
  var src=e.touches?e.touches[0]:e;
  return {x:(src.clientX-rect.left)*scaleX, y:(src.clientY-rect.top)*scaleY};
}

function peDrawArrow(ctx,x1,y1,x2,y2,col,sz){
  var headlen=Math.max(12,sz*3);
  var angle=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-headlen*Math.cos(angle-Math.PI/6),y2-headlen*Math.sin(angle-Math.PI/6));
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-headlen*Math.cos(angle+Math.PI/6),y2-headlen*Math.sin(angle+Math.PI/6));
  ctx.strokeStyle=col;ctx.lineWidth=sz;ctx.lineCap='round';ctx.stroke();
}

function setPETool(tool){
  window._pe.tool=tool;
  ['pe_pencil','pe_arrow','pe_rect'].forEach(function(id){
    var btn=document.getElementById(id);
    if(btn)btn.style.background='#6b7280';
  });
  var active=document.getElementById('pe_'+tool);

function pe_undo(){

// Finds a photo in a live array matching by id then url then index fallback.
// Returns {photo, idx} or null.
function _lbFindPhoto(livePhotos, refPhoto, fallbackIdx){
  if(!livePhotos||!livePhotos.length)return null;
  var ph=null;
  // 1. match by id
  if(refPhoto&&refPhoto.id){ph=livePhotos.find(function(x){return typeof x==='object'&&x.id===refPhoto.id;});}
  // 2. match by url
  if(!ph&&refPhoto&&refPhoto.url){
    var _ru=refPhoto.url;
    ph=livePhotos.find(function(x){return (typeof x==='string'?x:(x&&x.url)||'')===_ru;});
  }
  // 3. index fallback
  if(!ph&&fallbackIdx>=0&&fallbackIdx<livePhotos.length){ph=livePhotos[fallbackIdx];}
  if(!ph)return null;
  return {photo:ph,idx:livePhotos.indexOf(ph)};
}
function addLBCmt(){
  if(window._lbCmtBusy)return; // guard doble tap / doble Enter
  const inp=$('lbCmt');if(!inp||!inp.value.trim())return;
  window._lbCmtBusy=true;setTimeout(function(){window._lbCmtBusy=false;},700);
  const _txt=inp.value.trim();inp.value=''; // limpiar input ANTES para prevenir doble submit
  const p=S._lbP[S._lbI];
  if(typeof p==='object'){
    if(!p.comments)p.comments=[];
    var _nc={id:uid(),text:_txt,date:td(),author:D.user?.name||''};
    p.comments.push(_nc);
    // Sync to live D in case _silentMerge replaced the array while LB was open
    if(S._lbTbl&&S._lbId){
      var _it=(D[S._lbTbl]||[]).find(function(x){return x.id===S._lbId;});
      if(_it){
        _it.updatedAt=nw();
        if(_it.photos&&_it.photos!==S._lbP){
          // _silentMerge replaced array — find photo by id/url, NOT by index
          var _found=_lbFindPhoto(_it.photos,p,S._lbI);
          if(_found){
            var _lp=_found.photo;
            if(!_lp.comments)_lp.comments=[];
            // Dedup guard: only push if not already present
            if(!_lp.comments.some(function(c){return c.id===_nc.id;})){_lp.comments.push(_nc);}
            S._lbI=_found.idx; // re-anchor index to new position
          }
          S._lbP=_it.photos;
        }
      }
    }
    sv();drawLB();toast('Comentario agregado');
  }
}
function delLBCmt(cmtId){
  const p=S._lbP[S._lbI];if(typeof p!=='object'||!p.comments)return;

function editLBCmt(cmtId){

      _it.updatedAt=nw();

}
function lbPrev(){if(!S._lbP||!S._lbP.length)return;S._lbI=(S._lbI-1+S._lbP.length)%S._lbP.length;_lbSwap();}
function lbNext(){if(!S._lbP||!S._lbP.length)return;S._lbI=(S._lbI+1)%S._lbP.length;_lbSwap();}
function _lbSwap(){
  // Try to smoothly swap just the image; fall back to full redraw if LB not rendered yet
  var el=$('lbEl');
  var img=el&&el.querySelector('.lightbox img');
  if(!img){drawLB();return;}
  var p=S._lbP[S._lbI];
  var _ru=typeof p==='string'?p:(p.url||'');
  var url=(_ru.startsWith('[foto')&&typeof p==='object'&&p.localUrl)?p.localUrl:_ru;
  var cap=typeof p==='string'?'':(p.caption||'');
  var capEl=el.querySelector('.lb-cap');
  var cmts=(typeof p==='object'&&p.comments)?p.comments:[];
  var cmtBox=el.querySelector('.lb-comments');
  // Fade out → swap src → fade in
  img.classList.add('lb-fade');
  setTimeout(function(){
    img.src=url;
    if(capEl)capEl.textContent=(S._lbI+1)+'/'+S._lbP.length+(cap?' — '+cap:'');

    // Update comment display
    if(cmtBox){
      var oldCmtDiv=cmtBox.querySelector('div[style*="max-height"]');

      var cmtHtml=_lbCmtsHtml(cmts);

    const mc=['dashboard','visitas','tareas','materiales','economia','documentos','checklist','comentarios','informes','config','colaboradores','alertas'];

// ─── MÉTODO 1: Google Apps Script ────────────────────────────────────
async function syncViaAppsScript(data) {
  if (!SYNC.appsScriptUrl) throw new Error('URL de Apps Script no configurada');
  await fetch(SYNC.appsScriptUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'save', data: data, project: S.proj }),
  });
  return true;
}

async function loadViaAppsScript() {
  if (!SYNC.appsScriptUrl) return null;
  try {
    const url = SYNC.appsScriptUrl + '?action=load&project=' + encodeURIComponent(S.proj || '');
    const res = await fetch(url);
    if (!res.ok) return null;
    const json = await res.json();
    return json.data || null;
  } catch(e) { return null; }
}

// ─── MÉTODO 2: Dropbox API ───────────────────────────────────────────
async function syncViaDropbox(data) {
  if (!SYNC.dropboxToken) throw new Error('Token de Dropbox no configurado');
  const p = D.projects?.find(x => x.id === S.proj);
  const fileName = '/ObraControl_' + (p?.name || S.proj || 'obra').replace(/\s+/g, '_') + '.json';
  const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + SYNC.dropboxToken,
      'Content-Type': 'application/octet-stream',
      'Dropbox-API-Arg': JSON.stringify({ path: fileName, mode: 'overwrite', autorename: false, mute: true }),
    },
    body: JSON.stringify(data, null, 2),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error_summary || 'Error Dropbox ' + res.status);
  }
  return await res.json();
}

async function loadViaDropbox() {
  if (!SYNC.dropboxToken) return null;
  try {
    const p = D.projects?.find(x => x.id === S.proj);
    const fileName = '/ObraControl_' + (p?.name || S.proj || 'obra').replace(/\s+/g, '_') + '.json';
    const res = await fetch('https://content.dropboxapi.com/2/files/download', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + SYNC.dropboxToken,
        'Dropbox-API-Arg': JSON.stringify({ path: fileName }),
      },
    });
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}

// ─── DISPATCHER PRINCIPAL ────────────────────────────────────────────
async function cloudSave() {
  updateSyncIndicator('syncing');
  const cleanData = buildCleanData();
  try {
    if (SYNC.method === 'appsscript' && SYNC.appsScriptUrl) {
      await syncViaAppsScript(cleanData);
      D.lastSync = nw(); sv();
      updateSyncIndicator('ok');
      toast('Guardado en Drive via Apps Script \u2713', 'var(--green)');

    } else if (SYNC.method === 'dropbox' && SYNC.dropboxToken) {
      await syncViaDropbox(cleanData);
      D.lastSync = nw(); sv();
      updateSyncIndicator('ok');
      toast('Guardado en Dropbox \u2713', 'var(--green)');

    } else if (SYNC.method === 'oauth') {
      const ok = await ensureAuth();
      if (!ok) { updateSyncIndicator('noauth'); toast('Autenticaci\u00f3n cancelada', 'var(--orange)'); return; }
      await saveToDrive();
      toast('Guardado en Drive \u2713', 'var(--green)');

    } else {
      updateSyncIndicator('noauth');
      showDrivePanel();
    }
  } catch(e) {
    console.error('Sync error:', e);
    updateSyncIndicator('error');
    toast('Error: ' + e.message, 'var(--red)', 4000);
  }
}

    {t:'enlaces',    f:['title','url','description'],          l:'Enlace',        c:'var(--blue)',   m:'documentos',    nav:()=>`S.mod='documentos';`},
  ];
  // Sinónimos comunes en construcción
  const SYN={cemento:['portland','hormigon','concreto'],hierro:['acero','varilla','armadura'],
    sanitaria:['plomeria','cano','tuberia','agua'],electricidad:['electrico','cable','tension'],
    pintura:['revestimiento','latex','acabado'],piso:['ceramica','porcelanato','solado'],
    pared:['muro','tabique','mamposteria'],techo:['losa','cubierta'],
    vencer:['vence','vencida','plazo','fecha'],urgente:['critico','importante','prioritario'],
    factura:['remito','comprobante','recibo'],pago:['pagar','cobro','cobrar']};
  // Expandir query con sinónimos
  const qTerms=[q];
  Object.entries(SYN).forEach(([key,syns])=>{
    if(q.includes(key))qTerms.push(...syns);
    syns.forEach(s=>{if(q.includes(s))qTerms.push(key,...syns.filter(x=>x!==s));});
  });
  const qUniq=[...new Set(qTerms)];
  sources.forEach(tb=>{
    pf(tb.t).forEach(item=>{
      let searchText=tb.f.map(f=>item[f]||'').join(' ');
      if(tb.t==='checklists'&&item.items)searchText+=item.items.map(i=>i.text).join(' ');
      const stLow=searchText.toLowerCase();
      const matched=qUniq.some(term=>stLow.includes(term));
      if(matched){
        const navCode=tb.nav(item);
        r.push({l:tb.l,c:tb.c,text:item[tb.f[0]]||'',sub:tb.f.slice(1).map(f=>item[f]).filter(Boolean).join(' | '),date:item.date||item.fecha,mod:tb.m,nav:navCode,id:item.id});
      }
    });
  });
  if(!r.length){el.innerHTML='<div class="tac tc3 ts" style="padding:24px">Sin resultados para "'+q+'"</div>';return;}
  el.innerHTML=`<div class="txxs tc3 mb-8" style="padding:0 4px">${r.length} resultado${r.length>1?'s':''}</div>`+r.slice(0,30).map(x=>`<div class="card card-click" style="padding:10px;border-left:3px solid ${x.c}" onclick="S.searchOpen=false;${x.nav}render();"><div class="flex items-center gap-8"><span class="bg bg-s" style="background:${x.c}18;color:${x.c};border:1px solid ${x.c}30">${x.l}</span><span class="txxs tc3">${fmts(x.date)}</span></div><div class="ts fw6 mt-4">${(x.text||'').slice(0,80)}</div>${x.sub?`<div class="txxs tc3 mt-2">${x.sub.slice(0,60)}</div>`:''}</div>`).join('');
}

async function setupDrive(){
  closeM('driveSetupM');
  toast('Conectando con Google...','var(--pri)');
  await initGoogleAuth();
  const ok=await ensureAuth(true);
  if(!ok){toast('Autenticación cancelada','var(--orange)');return;}
  toast('Autenticado ✓ — cargando datos de Drive...','var(--green)',2500);
  try{
    await ensureFolders(S.proj);
    D.driveConfig=D.driveConfig||{};
    if(S.proj){
      const proj=D.projects.find(p=>p.id===S.proj);
      D.driveConfig[S.proj]={
        rootId:GD.rootId,
        obraFolderId:GD.obraFolders[S.proj],
        folderId:GD.folderId,
        imagesFolderId:GD.imagesFolderId,
        backupFolderId:GD.backupFolderId,
        folderName:DRIVE_ROOT+'/'+(proj?.name||S.proj),
        connectedAt:nw(),
        lastBackup:null
      };
      sv();
    }
    // Primero cargar Drive (para no pisar datos de otro dispositivo)
    await loadFromDriveAndMerge();
    updateSyncIndicator('ok');render();
    toast('Drive sincronizado ✓ — sync automático activo','var(--green)',4000);
  }catch(e){toast('Error al configurar Drive: '+e.message,'var(--red)');console.error(e);}
}

async function handleAddPhotos(vid,input){
  if(!input.files||!input.files.length)return;
  if(input._uploading)return;
  input._uploading=true;input.disabled=true;
  // Mostrar indicador visible en pantalla (no solo un span oculto)
  var _ul=document.getElementById("ul_lbl_"+vid);
  if(!_ul){_ul=document.createElement("span");_ul.id="ul_lbl_"+vid;_ul.style.cssText="font-size:11px;color:var(--orange);margin-left:6px;font-weight:600";}
  try{input.parentNode.insertBefore(_ul,input.nextSibling);}catch(e){}
  _ul.textContent="Subiendo fotos...";
  var _added=0;
  try{
    const v=D.visitas.find(x=>x.id===vid);
    if(!v){toast('Visita no encontrada','var(--red)');return;}
    if(!v.photos)v.photos=[];
    const files=Array.from(input.files);
    for(var _fi=0;_fi<files.length;_fi++){
      var file=files[_fi];
      _ul.textContent='Foto '+(_fi+1)+' de '+files.length+'...';
      // Comprimir — con onerror y try/catch la Promise SIEMPRE resuelve
      var compressed=await new Promise(function(res){
        var rd=new FileReader();
        rd.onload=async function(e){res(await compressImage(e.target.result,1024,0.72));};
        rd.onerror=function(){console.warn('FileReader error');res(null);};
        // Timeout de seguridad: si FileReader cuelga más de 15s, continuar
        var _frt=setTimeout(function(){console.warn('FileReader timeout');res(null);},15000);
        rd.onloadend=function(){clearTimeout(_frt);};
        try{rd.readAsDataURL(file);}catch(e){clearTimeout(_frt);res(null);}
      });
      if(!compressed){console.warn('Compresión falló para',file.name);continue;}
      // Intentar subir a Drive; fallback a IDB; fallback a base64
      var _vFid=(S.proj&&GD.moduleFolders[S.proj+'_visitas'])||GD.imagesFolderId||null;
      var url=compressed;
      if(GD.online&&GD.accessToken&&(_vFid||GD.imagesFolderId)){
        try{
          var result=await uploadImageToDrive(compressed,'visita_'+uid()+'.jpg',_vFid);
          if(result&&result.url){url=result.url;}
        }catch(ex){console.warn('Drive upload failed, using IDB fallback:',ex);}
      }
      // Si sigue siendo base64 y IDB disponible: encolar para sync posterior
      var _localUrl=null;
      if(url===compressed&&url.startsWith('data:')&&GD.idbReady){
        var imgId='img_'+uid();
        try{
          await queueImageUpload(imgId,compressed,'visita_'+imgId+'.jpg',S.proj,_vFid);
          _localUrl=compressed; // guardar base64 para mostrar de inmediato
          url='[foto:'+imgId+']';
        }catch(e){/* mantener base64 si IDB falla también */}
      }
      var _newPh=mkPhoto(url,'');
      // Siempre guardar localUrl = base64 comprimido, para display inmediato y fallback offline.
      // buildCleanData lo stripea antes de Drive; _silentMerge lo restaura desde local.
      _newPh.localUrl=compressed;
      v.photos.push(_newPh);
      _added++;
    }
    if(_added>0){
      // Re-fetch the live reference in case _silentMerge replaced D.visitas during awaits
      // (if it did, v became a detached object and sv/render would miss the new photos)
      var _liveV=D.visitas.find(function(x){return x.id===vid;});
      if(_liveV&&_liveV!==v){
        // D.visitas was replaced by merge — copy all photos to the live object
        _liveV.photos=v.photos;
        _liveV.updatedAt=nw();
      } else if(_liveV){
        _liveV.updatedAt=nw();
      } else {
        // visit not found in live D (deleted concurrently) — still update v for safety
        v.updatedAt=nw();
      }
      sv();render();
      toast(_added+' foto(s) agregada(s)'+(files.length>_added?' ('+(_added)+'/'+files.length+' ok)':''),'var(--green)');
    } else {
      toast('No se pudieron cargar las fotos — intentá de nuevo','var(--orange)',4000);
    }
  }catch(err){
    console.error('handleAddPhotos error:',err);
    toast('Error al cargar fotos: '+err.message,'var(--red)',5000);
  }finally{
    // SIEMPRE resetear aunque haya error — sin esto los siguientes intentos quedan bloqueados
    input._uploading=false;input.disabled=false;
    var _ul2=document.getElementById("ul_lbl_"+vid);if(_ul2)_ul2.remove();
    // Limpiar el input para permitir re-seleccionar las mismas fotos
    try{input.value='';}catch(e){}
  }
}
async function handleAddFiles(vid,input){
  if(!input.files||!input.files.length)return;
  const v=D.visitas.find(x=>x.id===vid);if(!v)return;
  if(!v.archivos)v.archivos=[];
  const files=Array.from(input.files);
  var added=0;
  try{
    for(var fi=0;fi<files.length;fi++){
      var file=files[fi];
      var mb=file.size/(1024*1024);
      if(mb>15){toast('"'+file.name+'" supera 15MB — subílo a Drive y pegá el link','var(--orange)',5000);continue;}
      var data=await new Promise(function(res){
        var r=new FileReader();r.onload=function(e){res(e.target.result);};r.readAsDataURL(file);
      });
      var archObj={id:uid(),name:file.name,type:file.type,size:Math.round(file.size/1024),data:data,date:td()};
      // Si es imagen y Drive disponible: subir a carpeta Visitas
      var _vFileFid=(S.proj&&GD.moduleFolders[S.proj+'_visitas'])||GD.imagesFolderId||null;
      if(file.type.startsWith('image/')&&GD.online&&GD.accessToken&&(_vFileFid||GD.imagesFolderId)){
        try{
          var result=await uploadImageToDrive(data,'visita_file_'+uid()+'_'+file.name,_vFileFid);
          if(result&&result.url){
            archObj.data=result.url;
            archObj.driveId=result.driveId;
            archObj.driveUrl=result.viewUrl;
          }
        }catch(ex){console.warn('File Drive upload failed:',ex);}
      }
      v.archivos.push(archObj);
      added++;
    }
    if(added>0){
      // Re-fetch in case _silentMerge replaced D.visitas during async awaits
      var _liveV2=D.visitas.find(function(x){return x.id===vid;});
      if(_liveV2&&_liveV2!==v){_liveV2.archivos=v.archivos;_liveV2.updatedAt=nw();}
      else if(_liveV2){_liveV2.updatedAt=nw();}
      else{v.updatedAt=nw();}
      sv();render();toast(added+' archivo(s) adjuntado(s)');
    }
  }catch(e){console.error('handleAddFiles:',e);toast('Error al adjuntar archivo','var(--red)',4000);}
}

function lmMatSelChange(){

function exportMatPDF(){
  try{

  const p=D.projects.find(x=>x.id===S.proj);
  const items=pf('materiales');const ings=pf('matIngresos');
  const cats={};items.forEach(m=>{
    const cat=m.category||'General';if(!cats[cat])cats[cat]=[];
    const totalIng=ings.filter(i=>i.materialId===m.id&&(i.estado==='ingresado'||!i.estado)).reduce((s,i)=>s+(i.qty||0),0);
    const comp=m.computado||0;const pct=comp>0?Math.round(totalIng/comp*100):0;
    cats[cat].push({...m,totalIng,pct});
  });

// ── TOMBSTONES: registro de eliminaciones para sync entre dispositivos ──
function addTombstone(tbl,id){
  if(!D.tombstones)D.tombstones=[];
  if(!D.tombstones.find(function(t){return t.id===id;}))
    D.tombstones.push({id:id,tbl:tbl,ts:nw()});
  // Limpiar tombstones > 60 días
  var cut=Date.now()-60*24*60*60*1000;
  D.tombstones=D.tombstones.filter(function(t){return new Date(t.ts).getTime()>cut;});
}
function applyTombstones(tombs,obj){
  if(!tombs||!tombs.length)return;
  var ids=new Set(tombs.map(function(t){return t.id;}));
  var tbls=['projects','visitas','tareas','materiales','matIngresos','alertas','checklists','documentos','enlaces','comentarios','economia'];
  tbls.forEach(function(tbl){
    if(Array.isArray(obj[tbl]))obj[tbl]=obj[tbl].filter(function(x){return !ids.has(x.id);});
  });
}
function delI(tbl,id){
  if(!requireDelete())return;
  // Limpiar referencias cruzadas según el tipo
  if(tbl==='visitas'){
    // Tareas y materiales vinculados a esta visita: desvincular
    (D.tareas||[]).forEach(function(t){if(t.visitaId===id)t.visitaId=null;});
    (D.matIngresos||[]).forEach(function(m){if(m.visitaId===id)m.visitaId=null;});
    (D.checklists||[]).forEach(function(c){if(c.visitaId===id)c.visitaId=null;});
  }
  if(tbl==='materiales'){
    // matIngresos vinculados a este material: eliminar
    if(confirm('¿Eliminar también todos los ingresos/pedidos de este material?')){
      // Tombstone antes de filtrar — necesario para sync multi-dispositivo
      (D.matIngresos||[]).filter(function(m){return m.materialId===id;}).forEach(function(m){addTombstone('matIngresos',m.id);});
      D.matIngresos=(D.matIngresos||[]).filter(function(m){return m.materialId!==id;});
    } else {
      (D.matIngresos||[]).forEach(function(m){if(m.materialId===id){m.materialId=null;m.updatedAt=nw();}});
    }
  }
  if(tbl==='economia'){
    var _mi=(D.matIngresos||[]).find(function(mi){return mi.ecoId===id;});
    if(_mi){
      var _nm=_mi.matNombre||'';
      if(confirm('¿Eliminar también el material vinculado ('+_nm+') en Materiales?')){
        // Tombstone antes de filtrar — necesario para sync multi-dispositivo
        addTombstone('matIngresos',_mi.id);
        D.matIngresos=D.matIngresos.filter(function(mi){return mi.ecoId!==id;});
        toast('Movimiento y material eliminados','var(--orange)',3000);
      } else {
        _mi.ecoId=null;_mi.updatedAt=nw();
        toast('Movimiento eliminado — material conservado','var(--blue)',3000);
      }
    }
  }
  D[tbl]=D[tbl].filter(function(x){return x.id!==id;});
  addTombstone(tbl,id);
  audit(tbl,'delete','');sv();render();
}

function rMat(mc){
  const allItems=pf('materiales').filter(m=>!m.visitaId);
  const ings=pf('matIngresos');const c=MC.materiales;
  // Build category list
  const cats_all=[...new Set(allItems.map(m=>m.category||'General'))].sort();

  let items=allItems;
  if(S.matCatFilter)items=items.filter(m=>(m.category||'General')===S.matCatFilter);
  if(S.matFilter){
    const q=S.matFilter.toLowerCase();
    items=items.filter(m=>(m.name||'').toLowerCase().includes(q)||(m.category||'').toLowerCase().includes(q)||(m.notes||'').toLowerCase().includes(q));
  }
  const hasFilter=S.matFilter||S.matCatFilter;
  // Build display categories from filtered items
  const cats={};
  items.forEach(m=>{
    const cat=m.category||'General';if(!cats[cat])cats[cat]=[];

function editSinComp(id){
  var i=(D.matIngresos||[]).find(function(x){return x.id===id;});
  if(!i)return;
  var nomb=prompt('Nombre:',i.matNombre);if(nomb===null)return;
  var qty=prompt('Cantidad:',i.qty);if(qty===null)return;
  var uni=prompt('Unidad:',i.unit||'u');if(uni===null)return;
  var obs=prompt('Observaciones:',i.observations||'');
  i.matNombre=nomb.trim()||i.matNombre;
  i.qty=parseFloat(qty)||i.qty;
  i.unit=uni.trim()||i.unit;
  i.observations=obs;
  audit('matIngresos','update',i.matNombre);
  sv();render();toast('Material actualizado');
}

function vincularSinComp(id){
  var i=(D.matIngresos||[]).find(function(x){return x.id===id;});
  if(!i)return;
  var mats=pf('materiales').filter(function(m){return !m.visitaId;});
  if(!mats.length){toast('No hay materiales computados para vincular','var(--orange)');return;}
  var opts=mats.map(function(m,idx){return (idx+1)+'. '+m.name+' ('+( m.unit||'u')+')';}).join('\n');
  var sel=prompt('Vincular a material computado:\n'+opts+'\n\nEscrib\u00ed el n\u00famero:');
  if(!sel)return;
  var idx=parseInt(sel)-1;
  if(isNaN(idx)||idx<0||idx>=mats.length){toast('N\u00famero inv\u00e1lido','var(--red)');return;}
  var mat=mats[idx];
  i.materialId=mat.id;
  i.matNombre=mat.name;
  i.unit=mat.unit||i.unit;
  i.updatedAt=nw(); // necesario para que el merge multi-dispositivo elija esta versión
  audit('matIngresos','update','vinculado a '+mat.name);
  sv();render();toast('Vinculado a: '+mat.name,'var(--green)');
}

function delMatIngreso(id){
  if(!confirm('\u00bfEliminar este registro de ingreso?'))return;
  D.matIngresos=(D.matIngresos||[]).filter(function(x){return x.id!==id;});
  addTombstone('matIngresos',id); // \u2190 necesario para sync multi-dispositivo
  audit('matIngresos','delete','');
  sv();render();toast('Registro eliminado');
}


function setMatSort(val){
  S.matSort=val;
  // Immediately update all sort buttons without waiting for full re-render
  document.querySelectorAll('[data-matsort]').forEach(function(b){
    var active=b.dataset.matsort===val;
    b.style.background=active?'var(--orange)':'';
    b.style.color=active?'#fff':'';
    b.className='btn btn-s '+(active?'btn-p':'btn-sec');
  });
  renderMatItems();
}

  const inp = document.getElementById('mat_voice_input');

function startMatVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  // Sin API de voz → avisamos sin abrir ningún panel
  if (!SpeechRecognition) { toast('Reconocimiento de voz no disponible en este navegador','var(--orange)',3500); return; }

  const micBtn = document.getElementById('mat_mic_btn');
  const rec = new SpeechRecognition();
  rec.lang = 'es-AR';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    if (micBtn) { micBtn.textContent = '🔴'; micBtn.title = 'Escuchando...'; }
    toast('🎤 Escuchando — decí: "cemento 50 bolsas" o "ingreso cemento 30"', 'var(--pri)', 3000);
  };

  rec.onend = () => {
    if (micBtn) { micBtn.textContent = '🎤'; micBtn.title = 'Dictar material o ingreso'; }
  };

  rec.onerror = (e) => {
    if (micBtn) { micBtn.textContent = '🎤'; micBtn.title = 'Dictar material o ingreso'; }
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      toast('Micrófono no disponible en archivo local — usá el formulario de texto','var(--orange)',3500);
      showMatVoiceInput();
    } else {
      toast('Micrófono no disponible: ' + e.error, 'var(--orange)', 3000);
      showMatVoiceInput();
    }
  };

  rec.onresult = (e) => {
    const texto = e.results[0][0].transcript.toLowerCase().trim();
    toast('🎤 Escuché: "' + texto + '"', 'var(--pri)', 2500);
    parseMatVoice(texto);
  };

  try { rec.start(); } catch(err) { toast('Error al iniciar el micrófono','var(--orange)',3000); }
}

function parseMatVoice(texto) {
  // ── 1. Detectar modo: ingreso vs nuevo material ─────────────────────
  const esIngreso = /\b(ingreso|ingres[oó]|entr[oó]|llegaron?|ingres[aá]r?)\b/.test(texto);

  // ── 2. Tabla de unidades reconocidas ────────────────────────────────
  const UNIDADES = [
    { re: /\bbolsa[s]?\s*(?:de\s*)?\s*50\s*kg\b/,       val: 'bolsa 50kg' },
    { re: /\bbolsa[s]?\s*(?:de\s*)?\s*40\s*kg\b/,       val: 'bolsa 40kg' },
    { re: /\bbolsa[s]?\s*(?:de\s*)?\s*25\s*kg\b/,       val: 'bolsa 25kg' },
    { re: /\bbolsa[s]?\b/,                               val: 'bolsa 25kg' },
    { re: /\bkilogramos?\b|\bkilo[s]?\b|\bkg\b/,         val: 'kg'         },
    { re: /\blitros?\b/,                                 val: 'l'          },
    { re: /\bm(?:etros?)?\s*c(?:uadrados?|2)\b|\bm2\b/,  val: 'm2'         },
    { re: /\bm(?:etros?)?\s*c(?:\u00fabicos?|3)\b|\bm3\b/, val: 'm3'       },
    { re: /\bmetros?\b/,                                 val: 'm'          },
    { re: /\bunidades?\b/,                               val: 'u'          },
    { re: /\bcajas?\b/,                                  val: 'caja'       },
    { re: /\brollos?\b/,                                 val: 'rollo'      },
    { re: /\bbarras?\b/,                                 val: 'barra'      },
    { re: /\bbaldes?\b/,                                 val: 'balde'      },
    { re: /\bpaquetes?\b|\bpaq\b/,                       val: 'paq'        },
    { re: /\bgalones?\b|\bgl\b/,                         val: 'gl'         },
  ];

  // ── 3. Extraer cantidad y unidad por separado ────────────────────────
  let qty = 0;
  let unit = 'u';
  let textoLimpio = texto;

  // Número: puede haber coma/punto decimal, puede estar separado de la unidad
  const numRe = /(\d+(?:[.,]\d+)?)/;
  const numMatch = textoLimpio.match(numRe);
  if (numMatch) {
    qty = parseFloat(numMatch[1].replace(',', '.'));
    textoLimpio = textoLimpio.replace(numMatch[0], ' ');
  }

  // Unidad: buscar en el texto ORIGINAL (antes de quitar el número)
  for (const u of UNIDADES) {
    if (u.re.test(texto)) {
      unit = u.val;
      textoLimpio = textoLimpio.replace(u.re, ' ');
      break;
    }
  }

  // ── 4. Limpiar nombre ────────────────────────────────────────────────
  let nombre = textoLimpio
    .replace(/\b(ingreso|ingres[oó]|entr[oó]|llegaron?|ingres[aá]r?|nuevo|nueva|material|agregar|a\u00f1adir|de|del|con|el|la|los|las|un|una)\b/gi, ' ')
    .replace(/[.,;:!?]/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();

  if (nombre) nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);

  if (!nombre) {
    toast('No entend\u00ed el nombre del material. Intent\u00e1: "cemento 50 bolsas"', 'var(--orange)', 4000);
    return;
  }

  // ── 5. INGRESO: buscar material computado y llenar modal ─────────────
  if (esIngreso) {
    const allItems = pf('materiales').filter(m => !m.visitaId);
    const found = allItems.find(m => {
      const mn = m.name.toLowerCase();
      const dn = nombre.toLowerCase();
      return mn.includes(dn) || dn.includes(mn) ||
        dn.split(' ').some(w => w.length > 3 && mn.includes(w));
    });
    if (!found) {
      toast('\u26a0 "' + nombre + '" no est\u00e1 en el c\u00f3mputo. Cre\u00e1lo primero.', 'var(--orange)', 4000);
      return;
    }
    openM('newIngM');
    setTimeout(() => {
      const selMat = document.getElementById('ni_mat');
      if (selMat) { selMat.value = found.id; selMat.dispatchEvent(new Event('change')); }
      const qInput = document.getElementById('ni_q');
      if (qInput) { qInput.value = qty || ''; if (!qty) qInput.focus(); }
      const dateInput = document.getElementById('ni_d');
      if (dateInput && !dateInput.value) dateInput.value = td();
      toast('\ud83c\udfa4 Ingreso: ' + found.name + (qty ? ' \u2014 ' + qty + ' ' + unit : ' (complet\u00e1 la cantidad)'), 'var(--green)', 3500);
    }, 250);

  // ── 6. NUEVO MATERIAL: llenar nombre + cantidad + unidad ─────────────
  } else {
    openM('newMatM');
    setTimeout(() => {
      const nInput = document.getElementById('nm_n');
      if (nInput) nInput.value = nombre;
      const compInput = document.getElementById('nm_comp');
      if (compInput && qty) compInput.value = qty;
      const uSelect = document.getElementById('nm_u');
      if (uSelect) {
        for (let i = 0; i < uSelect.options.length; i++) {
          if (uSelect.options[i].value === unit) { uSelect.selectedIndex = i; break; }
        }
      }
      if (nInput) nInput.focus();
      toast('\ud83c\udfa4 ' + nombre + (qty ? ' \u2014 ' + qty + ' ' + unit : '') + ' (revis\u00e1 y guard\u00e1)', 'var(--green)', 3500);
    }, 250);
  }
}

    +'<button class="btn btn-w btn-sec" onclick="document.getElementById(\'fusionMatM\').remove()">Cancelar</button>'

function previewFusionMat(){
  const keepId=$('fus_keep')?.value;
  const delId=$('fus_del')?.value;
  if(!keepId||!delId){toast('Seleccioná ambos materiales','var(--orange)');return;}
  if(keepId===delId){toast('Seleccioná materiales distintos','var(--red)');return;}
  const keep=(D.materiales||[]).find(m=>m.id===keepId);
  const del=(D.materiales||[]).find(m=>m.id===delId);
  if(!keep||!del)return;
  const ings=(D.matIngresos||[]).filter(i=>i.materialId===delId).length;
  const prev=$('fus_preview');
  if(prev){
    prev.innerHTML='<div style="background:#fff7ed;border-left:3px solid var(--orange);border-radius:6px;padding:10px 12px;margin-top:8px">'
      +'<div class="ts fw7 mb-6">Resultado de la fusión:</div>'
      +'<div class="txxs tc3">✔ Se conserva: <strong>'+keep.name+'</strong></div>'
      +'<div class="txxs tc3">🗑 Se elimina: <strong>'+del.name+'</strong></div>'
      +'<div class="txxs tc3">↩ Se migran: <strong>'+ings+' movimiento(s)</strong></div>'
      +'<div class="txxs tc3">Cómputo final: <strong>'+((keep.computado||0)+(del.computado||0))+'</strong> (suma de ambos)</div>'
      +'<button class="btn btn-w mt-8" style="background:var(--red);color:#fff;width:100%" '
      +'onclick="ejecutarFusionMat(\''+keepId+'\',\''+delId+'\')">⚠ Confirmar Fusión (irreversible)</button>'
      +'</div>';
  }
}

function ejecutarFusionMat(keepId,delId){
  if(!confirm('¿Fusionar? Acción irreversible.'))return;
  const keep=(D.materiales||[]).find(m=>m.id===keepId);
  const del=(D.materiales||[]).find(m=>m.id===delId);
  if(!keep||!del){toast('Error','var(--red)');return;}
  keep.computado=(keep.computado||0)+(del.computado||0);
  keep.updatedAt=nw();
  (D.matIngresos||[]).forEach(function(i){if(i.materialId===delId){i.materialId=keepId;i.matNombre=keep.name;i.updatedAt=nw();}});
  D.materiales=(D.materiales||[]).filter(m=>m.id!==delId);
  addTombstone('materiales',delId);
  audit('materiales','merge',keep.name+' <- '+del.name);
  sv();
  const el=document.getElementById('fusionMatM');
  if(el)el.remove();
  render();
  toast('Fusión completada: '+keep.name,'var(--green)',4000);
}


function delMatItem(itemId){
  if(!requireWrite())return;
  if(!confirm('\u00bfEliminar este registro?'))return;

function _downloadMatItemsICS(tipo){
  var _items=(D.matIngresos||[]).filter(function(i){return i.projectId===S.proj&&i.estado===tipo;});
  var p=D.projects.find(function(x){return x.id===S.proj;});
  var _label=tipo==='a_pedir'?'A pedir':'Pedidos pendientes';
  var _d=$('matcal_d')?.value||td();var _t=$('matcal_t')?.value||'08:00';
  var due=_d.replace(/-/g,'');var dtS=due+'T'+_t.replace(':','')+'00';
  var endH=String(parseInt(_t.split(':')[0])+1).padStart(2,'0')+_t.split(':')[1];var dtE=due+'T'+endH.replace(':','')+'00';
  var _listTxt=_items.map(function(i){return '- '+(i.matNombre||'Sin nombre')+': '+i.qty+' '+(i.unit||'')+(i.proveedor?' | '+i.proveedor:'');}).join('\\n');

async function saveEditMat(mid){
  const name=document.getElementById('em_name')?.value.trim();
  if(!name){toast('Nombre obligatorio','var(--red)');return;}
  // Read async data first, then re-fetch to avoid stale ref if _silentMerge fires during await
  const nuevasFotos=await readPhotos('em_ph','materiales');
  const m=D.materiales.find(x=>x.id===mid);if(!m)return;
  m.name=name;
  m.computado=parseFloat(document.getElementById('em_comp')?.value)||0;
  m.unit=document.getElementById('em_unit')?.value||'u';
  m.category=document.getElementById('em_cat')?.value||'General';
  m.notes=document.getElementById('em_notes')?.value||'';
  if(nuevasFotos.length){
    if(!m.photos)m.photos=[];
    m.photos.push(...nuevasFotos.map(u=>mkPhoto(u,'')));
  }
  m.updatedAt=nw();
  audit('materiales','update',name);sv();
  document.getElementById('editMatM')?.remove();
  render();toast('Material actualizado \u2713');
}

function rDocs(mc){
  var _dsort=S.docSort||'';
  function _sortArr(arr){
    var ds=_dsort;
    return [].concat(arr).sort(function(a,b){
      // Favoritos siempre primero
      var aStar=a.starred?1:0, bStar=b.starred?1:0;
      if(aStar!==bStar) return bStar-aStar;
      // Nombre: documentos usan 'name', enlaces usan 'title'
      var aN=(a.name||a.title||'').toLowerCase().trim();
      var bN=(b.name||b.title||'').toLowerCase().trim();
      var aD=a.date||a.createdAt||'';
      var bD=b.date||b.createdAt||'';
      if(ds==='az') return aN<bN?-1:aN>bN?1:0;
      if(ds==='za') return bN<aN?-1:bN>aN?1:0;
      if(ds==='asc') return aD<bD?-1:aD>bD?1:0;
      return bD<aD?-1:bD>aD?1:0;
    });
  }
