/* ══════════ VISTA RECURSOS ══════════ */
function Recursos({rec,setRec,tareas,rubros=[],proyecto,prof,imprevistos=0,setImprevistos,nota='',matIncr={},setMatIncr}){
  const [editId,setEditId]=useState(null);const [ed,setEd]=useState({});
  const [showAdd,setShowAdd]=useState(false);
  const [nv,setNv]=useState({item:tareas[0]?.item||"",rec:"",und:"un",qty:1,pu:0});
  const [buscar,setBuscar]=useState('');
  const [showIncrModal,setShowIncrModal]=useState(false);
  const [incrEdit,setIncrEdit]=useState({});
  const [incrGlobal,setIncrGlobal]=useState('');

  // ── Incremento efectivo de un recurso ──────────────────────────────
  // Prioridad: el % propio del recurso (r.incr) por encima del % del ítem (matIncr).
  // Así se puede fijar un incremento general por ítem y luego ajustar recursos puntuales.
  const pctDeItem=itemName=>{const t=tareas.find(x=>x.item===itemName);return t?(+matIncr[t.id]||0):0;};
  const tieneIncrPropio=r=>r.incr!==undefined&&r.incr!==null&&r.incr!=='';
  const pctDeRec=r=>pctIncrRec(r,pctDeItem(r.item));
  const totalRec=r=>r.qty*r.pu;                       // sin incremento
  const totalRecIncr=r=>r.qty*r.pu*(1+pctDeRec(r)/100); // final

  const costo=rec.reduce((s,r)=>s+totalRec(r),0);
  const costoConIncr=rec.reduce((s,r)=>s+totalRecIncr(r),0);
  // Los imprevistos se calculan SOBRE los materiales ya incrementados.
  const montoImprevistos=costoConIncr*(+imprevistos||0)/100;
  const costoTotal=costoConIncr+montoImprevistos;
  const hayIncr=rec.some(r=>pctDeRec(r)>0);
  // Agrupar recursos por ítem, respetando el orden de la pestaña Rubros/Ítems
  const todoGrupos=useMemo(()=>{
    const raw={};
    rec.forEach(r=>{(raw[r.item]=raw[r.item]||[]).push(r);});
    const order=tareas.reduce((m,t,i)=>{m[t.item]=i;return m;},{});
    return Object.fromEntries(
      Object.entries(raw).sort(([a],[b])=>(order[a]??999)-(order[b]??999))
    );
  },[rec,tareas]);
  // Filtrado por buscador (nombre de material o de ítem)
  const grupos=useMemo(()=>{
    if(!buscar.trim())return todoGrupos;
    const q=buscar.trim().toLowerCase();
    const f={};
    Object.entries(todoGrupos).forEach(([item,rs])=>{
      if(item.toLowerCase().includes(q)){f[item]=rs;}
      else{
        const m=rs.filter(r=>r.rec.toLowerCase().includes(q));
        if(m.length)f[item]=m;
      }
    });
    return f;
  },[todoGrupos,buscar]);
  // Catálogo de recursos únicos (para autocompletar nombre, unidad y precio sugerido)
  const catalogo=useMemo(()=>{
    const map={};
    rec.forEach(r=>{if(r.rec)map[r.rec.toLowerCase()]={rec:r.rec,und:r.und,pu:r.pu};});
    return Object.values(map);
  },[rec]);
  // Auto-llenar und y pu cuando el nombre coincide con un recurso del catálogo
  const fillFromCatalog=(v,setter)=>{
    const match=catalogo.find(c=>c.rec.toLowerCase()===v.toLowerCase());
    setter(d=>({...d,rec:v,...(match?{und:match.und,pu:match.pu}:{})}));
  };
  const onRecChange=v=>fillFromCatalog(v,setNv);
  const onEdRecChange=v=>fillFromCatalog(v,setEd);
  const addRec=()=>{if(!nv.rec.trim())return;const mid=rec.length?Math.max(...rec.map(r=>r.id)):0;setRec(p=>[...p,{...nv,id:mid+1,qty:+nv.qty,pu:+nv.pu}]);setNv(d=>({...d,rec:"",qty:1,pu:0}));setShowAdd(false);};
  // Guardado del modal de edición: un solo camino para el botón y para Enter.
  const saveRecurso=()=>{
    if(!ed.rec?.trim()){alert('El nombre del recurso no puede estar vacío.');return;}
    const incrLimpio=(ed.incr===undefined||ed.incr===null||String(ed.incr).trim()==='')
      ?undefined:Math.max(0,+ed.incr||0);
    setRec(p=>p.map(x=>{
      if(x.id!==editId)return x;
      const{incr,...resto}=x;   // se descarta el % viejo; se re-agrega sólo si quedó definido
      return{...resto,item:ed.item,rec:ed.rec.trim(),und:ed.und,qty:+ed.qty,pu:+ed.pu,
        ...(incrLimpio!==undefined?{incr:incrLimpio}:{})};
    }));
    setEditId(null);
  };
  const exportPDF=()=>{
    // El PDF es el documento que ve el cliente: todos los importes salen ya
    // incrementados y no se detalla ni el % ni el valor base.
    const pdfRows=[];let grandIncr=0;
    const $=n=>'$'+Math.round(n).toLocaleString('es-AR');
    Object.entries(grupos).forEach(([item,rs])=>{
      grandIncr+=rs.reduce((s,r)=>s+totalRecIncr(r),0);
      rs.forEach((r,i)=>{
        const f=1+pctDeRec(r)/100;
        pdfRows.push([i===0?item:'',r.rec,r.und,
          r.qty%1===0?String(r.qty):r.qty.toFixed(1),
          $(r.pu*f), $(totalRecIncr(r))]);
      });
    });
    const impPDF=grandIncr*(+imprevistos||0)/100;
    if(impPDF>0){
      pdfRows.push(['','COSTO TOTAL MATERIALES','','','',$(grandIncr)]);
      pdfRows.push(['',`Imprevistos / Mat. menores (${imprevistos}%)`,'','','',$(impPDF)]);
      pdfRows.push(['','COSTO TOTAL FINAL','','','',$(grandIncr+impPDF)]);
    }else{
      pdfRows.push(['','COSTO TOTAL MATERIALES','','','',$(grandIncr)]);
    }
    makePDF({
      titulo:'Recursos y Materiales',subtitulo:'Insumos y costos por ítem de obra',proyecto,
      kpis:[
        {label:'Costo total',value:$(grandIncr+impPDF)},
        {label:'Ítems',value:Object.keys(grupos).length},
        {label:'Recursos',value:rec.length},
      ],
      cols:['Ítem','Recurso','Unidad','Cantidad','Precio unitario','Total'],
      rows:pdfRows,
      colStyles:{2:{halign:'center',cellWidth:44},3:{halign:'right',cellWidth:50},
        4:{halign:'right',cellWidth:88},5:{halign:'right',cellWidth:88}},
      tableOptions:{
        didParseCell:(data)=>{
          const{section,column,row,cell}=data;
          if(section==='head'){
            if([2,3].includes(column.index))cell.styles.fillColor=[215,232,250];
            if(column.index===4)cell.styles.fillColor=[210,238,222];
            if(column.index===5)cell.styles.fillColor=[255,218,215];
          }
          if(section==='body'){
            if(column.index===0&&cell.raw)
              Object.assign(cell.styles,{fontStyle:'bold',textColor:[30,58,138],fillColor:[240,245,255]});
            if(column.index===4&&String(cell.raw||'').startsWith('$'))
              Object.assign(cell.styles,{textColor:[22,101,52],fontStyle:'bold'});
            if(column.index===5&&String(cell.raw||'').startsWith('$'))
              Object.assign(cell.styles,{textColor:[180,50,0],fontStyle:'bold'});
            if(row.raw[1]==='COSTO TOTAL MATERIALES')
              Object.assign(cell.styles,{fontStyle:'bold',fillColor:[245,245,245],textColor:[100,100,100]});
            if(String(row.raw[1]||'').startsWith('Imprevistos'))
              Object.assign(cell.styles,{fillColor:[250,250,250],textColor:[120,120,120],fontSize:7.5});
            if(row.raw[1]==='COSTO TOTAL FINAL')
              Object.assign(cell.styles,{fontStyle:'bold',fillColor:[255,237,213],textColor:[154,52,18],...(column.index===5?{fontSize:9}:{})});
          }
        },
        willDrawCell:(data)=>{
          if([4,5].includes(data.column.index)){
            data.doc.setDrawColor(100,140,160);data.doc.setLineWidth(0.65);
            data.doc.line(data.cell.x,data.cell.y,data.cell.x,data.cell.y+data.cell.height);
          }
        },
      },
      prof,nota,
    });
  };
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:"10px",marginBottom:"12px"}}>
        <KPI label={hayIncr?"Subtotal s/incr.":"Subtotal mat."} value={fM(costo)} accent={C.red}/>
        {hayIncr&&<KPI label="Subtotal c/incr." value={fM(costoConIncr)} accent={C.accent}/>}
        <KPI label={`Total c/${imprevistos}% imprev.`} value={fM(costoTotal)} accent={C.accent}/>
        <KPI label="Actividades" value={Object.keys(todoGrupos).length} accent={C.blue}/>
        <KPI label="Recursos" value={rec.length} accent={C.t3}/>
      </div>
      <div style={{display:"flex",gap:"8px",marginBottom:"9px",alignItems:"center",flexWrap:"wrap"}}>
        {/* Buscador */}
        <div style={{position:"relative",flex:"1 1 200px",maxWidth:"340px"}}>
          <span style={{position:"absolute",left:"8px",top:"50%",transform:"translateY(-50%)",
            fontSize:"12px",color:C.t3,pointerEvents:"none"}}>🔍</span>
          <input value={buscar} onChange={e=>setBuscar(e.target.value)}
            placeholder="Buscar material o ítem..."
            style={{width:"100%",paddingLeft:"28px",padding:"6px 10px 6px 28px",
              border:`1px solid ${C.border}`,borderRadius:"6px",background:C.surface,
              color:C.t1,fontSize:"11px"}}/>
          {buscar&&<button onClick={()=>setBuscar('')}
            style={{position:"absolute",right:"6px",top:"50%",transform:"translateY(-50%)",
              background:"none",border:"none",cursor:"pointer",color:C.t3,fontSize:"13px"}}>×</button>}
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:"8px"}}>
          <Btn onClick={()=>{setIncrEdit(Object.fromEntries(tareas.map(t=>[t.id,matIncr[t.id]??''])));setIncrGlobal('');setShowIncrModal(true);}} accent={C.blue} sm>📈 Incr. Mat.</Btn>
          <Btn onClick={exportPDF} accent={C.orange} sm>📄 PDF</Btn>
          <Btn onClick={()=>setShowAdd(v=>!v)} accent={C.green} sm>+ Recurso</Btn>
        </div>
      </div>
      {/* Datalists siempre disponibles (se usan en el form de agregar y en el modal de edición) */}
      <datalist id="dl-rec-nombres">
        {catalogo.map(c=><option key={c.rec} value={c.rec}>{c.rec} — {c.und} — ${fN(c.pu)}</option>)}
      </datalist>
      <datalist id="dl-rec-unds">
        {['m²','m³','ml','un','gl','kg','bolsa','hora','viaje','glb','lt','ton','km','día',
          ...catalogo.map(c=>c.und)].filter((v,i,a)=>a.indexOf(v)===i)
          .map(u=><option key={u} value={u}/>)}
      </datalist>

      {showAdd&&(
        <div style={{background:C.card,border:`1px solid ${C.green}44`,borderRadius:"9px",padding:"11px",marginBottom:"10px",display:"flex",flexWrap:"wrap",gap:"8px",alignItems:"flex-end"}}>

          {/* ÍTEM DE OBRA */}
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>ÍTEM DE OBRA</div>
            <select value={nv.item} onChange={e=>setNv(d=>({...d,item:e.target.value}))}
              style={{border:`1px solid ${C.border}`,borderRadius:"4px",padding:"5px 7px",background:C.surface,color:C.t1,fontSize:"11px",minWidth:"165px"}}>
              {tareas.map(t=><option key={t.id} value={t.item}>{t.item}</option>)}
            </select>
          </div>

          {/* RECURSO — autocomplete desde catálogo, auto-llena und y precio */}
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>
              RECURSO <span style={{color:C.t3,fontWeight:400,fontSize:"8px"}}>(elige o escribí uno nuevo)</span>
            </div>
            <input list="dl-rec-nombres" value={nv.rec} onChange={e=>onRecChange(e.target.value)}
              placeholder="Cemento Portland"
              style={{border:`1px solid ${C.border}`,borderRadius:"4px",padding:"5px 7px",
                background:C.bg,color:C.t1,fontSize:"11px",width:"180px"}}/>
          </div>

          {/* UNIDAD — autocomplete desde unidades conocidas */}
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>UNIDAD</div>
            <input list="dl-rec-unds" value={nv.und} onChange={e=>setNv(d=>({...d,und:e.target.value}))}
              style={{border:`1px solid ${C.border}`,borderRadius:"4px",padding:"5px 7px",
                background:C.bg,color:C.t1,fontSize:"11px",width:"72px"}}/>
          </div>

          {/* CANT. */}
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>CANT.</div>
            <Inp value={nv.qty} onChange={v=>setNv(d=>({...d,qty:v}))} type="number" w="68px" right/>
          </div>

          {/* P. UNIT. — sugerido si el recurso ya existe */}
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>
              P. UNIT.{catalogo.find(c=>c.rec.toLowerCase()===nv.rec.toLowerCase())&&
                <span style={{color:C.green,fontWeight:400,fontSize:"8px"}}> ✓ sugerido</span>}
            </div>
            <Inp value={nv.pu} onChange={v=>setNv(d=>({...d,pu:v}))} type="number" w="88px" right/>
          </div>

          <Btn onClick={addRec} accent={C.green} sm>Agregar</Btn>
          <Btn onClick={()=>setShowAdd(false)} accent={C.red} sm>✕</Btn>
        </div>
      )}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",overflowX:"auto"}}>
        <table className="trhov" style={{width:"100%",borderCollapse:"collapse",fontSize:"11px"}}>
          <thead><tr>
            <TH w="18px"/><TH>ÍTEM / RECURSO</TH><TH align="center" w="60px">UND</TH>
            <TH align="right" w="80px" bg="#1d4ed8">CANT.</TH>
            <TH align="right" w="95px" bg="#065f46">P.UNIT.</TH>
            <TH align="center" w="66px">% INCR.</TH>
            <TH align="right" w="105px" bg="#7f1d1d">TOTAL</TH>
            <TH w="55px" align="center"/>
          </tr></thead>
          <tbody>
            {Object.entries(grupos).flatMap(([item,rs])=>{
              const ct=rs.reduce((s,r)=>s+totalRec(r),0);
              const ctIncr=rs.reduce((s,r)=>s+totalRecIncr(r),0);
              const hayIncrItem=ctIncr>ct+0.005;
              return[
                <tr key={`h-${item}`} style={{background:`${C.red}10`,borderTop:`2px solid ${C.red}44`}}>
                  <td style={{padding:"8px 10px",borderBottom:`1px solid ${C.border}`,color:C.t3,fontSize:"9px",width:"18px"}}>▶</td>
                  <td colSpan={4} style={{padding:"8px 10px",fontWeight:700,fontSize:"12px",color:C.t1,borderBottom:`1px solid ${C.border}`,letterSpacing:".2px"}}>{item}</td>
                  <td colSpan={2} style={{padding:"8px 12px",textAlign:"right",borderBottom:`1px solid ${C.border}`,background:`${C.red}18`}}>
                    <div style={{fontFamily:"monospace",fontWeight:900,fontSize:"17px",color:C.red,lineHeight:1}}>{fM(ct)}</div>
                    <div style={{fontSize:"9px",color:`${C.red}99`,marginTop:"1px"}}>{hayIncrItem?"subtotal":"total ítem"}</div>
                    {hayIncrItem&&<div style={{marginTop:"5px"}}><div style={{fontFamily:"monospace",fontWeight:800,fontSize:"14px",color:C.accent,lineHeight:1}}>{fM(Math.round(ctIncr))}</div>
                    <div style={{fontSize:"9px",color:`${C.accent}99`,marginTop:"1px"}}>c/incremento</div></div>}
                  </td>
                  <TD/>
                </tr>,
                ...rs.map((r,i)=>{
                  const pctR=pctDeRec(r);
                  const propio=tieneIncrPropio(r);
                  return(
                  <tr key={r.id} style={{background:i%2===0?C.card:`${C.surface}88`}}>
                    <td style={{padding:"6px 8px",paddingLeft:"20px",color:C.t3,fontSize:"9px",borderBottom:`1px solid ${C.border2}`}}>↳</td>
                    <TD col={C.t2}>{r.rec}</TD><TD align="center" col={C.t3}>{r.und}</TD>
                    <TD align="right" mono col={C.blue} fw={700}>{fN(r.qty,r.qty%1===0?0:2)}</TD>
                    <TD align="right" mono col={C.green}>{fM(r.pu)}</TD>
                    <td style={{padding:"4px 6px",textAlign:"center",borderBottom:`1px solid ${C.border2}`}}>
                      {pctR>0?(
                        <span title={propio?'Incremento propio de este recurso':'Heredado del incremento del ítem'}
                          style={{fontFamily:"monospace",fontWeight:800,fontSize:"10px",padding:"1px 6px",
                            borderRadius:"4px",color:C.accent,background:`${C.accent}18`,
                            border:`1px solid ${C.accent}${propio?'88':'33'}`,whiteSpace:"nowrap"}}>
                          {propio?'':'≈'}{fN(pctR,pctR%1===0?0:1)}%
                        </span>
                      ):<span style={{color:C.t3,fontSize:"10px"}}>—</span>}
                    </td>
                    <TD align="right" mono col={C.red} fw={700}>{fM(totalRecIncr(r))}</TD>
                    <td style={{padding:"4px 6px",textAlign:"center",borderBottom:`1px solid ${C.border2}`}}>
                      <button onClick={()=>{setEditId(r.id);setEd({item:r.item,rec:r.rec,und:r.und,qty:r.qty,pu:r.pu,incr:tieneIncrPropio(r)?String(r.incr):''});}} style={{...btnS(C.blue),marginRight:"2px"}}>✏</button>
                      <button onClick={()=>setRec(p=>p.filter(x=>x.id!==r.id))} style={btnS(C.red)}>✕</button>
                    </td>
                  </tr>
                );})
              ];
            })}
          </tbody>
          <tfoot>
            {/* Fila 1: subtotal */}
            <tr style={{background:C.surface}}>
              <td colSpan={6} style={{padding:"8px 12px",fontWeight:700,fontSize:"11px",color:C.t2}}>SUBTOTAL MATERIALES</td>
              <td style={{padding:"8px 10px",textAlign:"right",fontFamily:"monospace",fontWeight:700,fontSize:"12px",color:C.t1}}>{fM(costo)}</td><td/>
            </tr>
            {/* Fila incremento materiales */}
            {hayIncr&&<tr style={{background:`${C.accent}09`,borderTop:`1px solid ${C.border}`}}>
              <td colSpan={6} style={{padding:"7px 12px",fontWeight:700,fontSize:"11px",color:C.accent}}>
                Subtotal c/incremento de materiales
              </td>
              <td style={{padding:"7px 10px",textAlign:"right",fontFamily:"monospace",fontWeight:700,fontSize:"12px",color:C.accent}}>{fM(costoConIncr)}</td><td/>
            </tr>}
            {/* Fila 2: % imprevistos — se calcula sobre el subtotal ya incrementado */}
            <tr style={{background:`${C.accent}09`,borderTop:`1px solid ${C.border}`}}>
              <td colSpan={6} style={{padding:"7px 12px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",fontSize:"11px",color:C.t2,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700}}>Imprevistos / Mat. menores</span>
                  <input type="number" min="0" max="100" step="0.5"
                    value={imprevistos}
                    onChange={e=>setImprevistos&&setImprevistos(Math.max(0,Math.min(100,+(e.target.value)||0)))}
                    style={{width:"58px",border:`1px solid ${C.accent}55`,borderRadius:"5px",
                      padding:"3px 6px",textAlign:"right",fontFamily:"monospace",fontWeight:700,
                      fontSize:"12px",background:C.bg,color:C.accent}}/>
                  <span style={{fontWeight:700,color:C.accent}}>%</span>
                  {hayIncr&&<span style={{fontSize:"9px",color:C.t3,fontStyle:"italic"}}>
                    sobre el subtotal c/incremento
                  </span>}
                </div>
              </td>
              <td style={{padding:"7px 10px",textAlign:"right",fontFamily:"monospace",fontWeight:600,fontSize:"12px",color:C.accent}}>
                {fM(montoImprevistos)}
              </td><td/>
            </tr>
            {/* Fila 3: total final */}
            <tr style={{background:C.surface,borderTop:`2px solid ${C.accent}66`}}>
              <td colSpan={6} style={{padding:"9px 12px",fontWeight:800,fontSize:"12px",color:C.t1}}>COSTO TOTAL FINAL</td>
              <td style={{padding:"9px 10px",textAlign:"right",fontFamily:"monospace",fontWeight:800,fontSize:"14px",color:C.accent}}>{fM(costoTotal)}</td><td/>
            </tr>
          </tfoot>
        </table>
      </div>

      {/* ── Modal: incremento general por ítem ── */}
      {showIncrModal&&(
        <Modal title="Incremento aplicado a materiales por ítem" onClose={()=>setShowIncrModal(false)} wide>
          <div style={{background:`${C.blue}0d`,border:`1px solid ${C.blue}33`,borderRadius:"7px",
            padding:"9px 12px",fontSize:"11px",color:C.blue,marginBottom:"10px"}}>
            Ingresá el % de incremento (margen, utilidad, IVA, etc.) sobre el costo de materiales de cada ítem.
            Se aplica a todos sus recursos, salvo los que tengan un % propio cargado desde “Editar recurso”.
          </div>
          {/* Aplicar global */}
          <div style={{display:"flex",alignItems:"center",gap:"8px",padding:"8px 12px",
            background:C.surface,borderRadius:"7px",marginBottom:"10px",flexWrap:"wrap"}}>
            <span style={{fontSize:"11px",fontWeight:700,color:C.t2}}>Aplicar a todos:</span>
            <input type="number" step="1" min="0" placeholder="%" value={incrGlobal}
              onChange={e=>setIncrGlobal(e.target.value)}
              style={{width:"70px",border:`1px solid ${C.blue}55`,borderRadius:"4px",padding:"3px 7px",
                background:`${C.blue}08`,color:C.blue,fontWeight:700,fontSize:"12px",
                fontFamily:"monospace",textAlign:"right"}}/>
            <span style={{fontSize:"11px",color:C.t2,fontWeight:700}}>%</span>
            <Btn onClick={()=>{const g=parseFloat(incrGlobal)||0;setIncrEdit(Object.fromEntries(tareas.map(t=>[t.id,g>0?String(g):''])));}} accent={C.blue} sm>✓ Aplicar a todos</Btn>
            <Btn onClick={()=>setIncrEdit(Object.fromEntries(tareas.map(t=>[t.id,""])))} accent={C.t3} sm>✕ Limpiar todo</Btn>
          </div>
          <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"11px"}}>
            <thead><tr>
              <TH w="28px">#</TH><TH>Ítem</TH><TH>Rubro</TH>
              <TH align="right" w="90px">Mat. base</TH>
              <TH align="center" w="120px">% Incremento</TH>
              <TH align="right" w="100px">Mat. c/incr.</TH>
            </tr></thead>
            <tbody>
              {tareas.map((t,i)=>{
                const rub=rubros.find(r=>r.id===t.rubroId);
                const rsItem=rec.filter(r=>r.item===t.item);
                const matBase=rsItem.reduce((s,r)=>s+totalRec(r),0);
                const pctStr=String(incrEdit[t.id]??'');
                const pct=parseFloat(pctStr)||0;
                // Los recursos con % propio no se ven afectados por este valor.
                const conPropio=rsItem.filter(tieneIncrPropio);
                const matFinal=rsItem.reduce((s,r)=>
                  s+(tieneIncrPropio(r)?totalRecIncr(r):totalRec(r)*(1+pct/100)),0);
                return(
                  <tr key={t.id} style={{background:i%2===0?C.card:C.surface}}>
                    <TD mono col={C.t3} style={{fontSize:"9px"}}>{t.id}</TD>
                    <TD fw={500}>{t.item}
                      {conPropio.length>0&&<span title={`${conPropio.length} recurso(s) con % propio: no cambian con este valor`}
                        style={{marginLeft:"5px",fontSize:"9px",color:C.accent,fontWeight:700}}>
                        ({conPropio.length} c/% propio)
                      </span>}
                    </TD>
                    <TD>{rub&&<Chip label={rub.nombre} color={rub.color} sm/>}</TD>
                    <TD align="right" mono col={C.t2}>{matBase>0?fM(matBase):'—'}</TD>
                    <td style={{padding:"4px 8px",borderBottom:`1px solid ${C.border2}`}}>
                      <div style={{display:"flex",alignItems:"center",gap:"5px",justifyContent:"center"}}>
                        <input type="number" step="1" min="0" value={pctStr}
                          onChange={e=>setIncrEdit(p=>({...p,[t.id]:e.target.value}))}
                          placeholder="0"
                          style={{width:"65px",border:`1px solid ${C.blue}55`,borderRadius:"4px",padding:"3px 6px",
                            background:`${C.blue}08`,color:C.blue,fontWeight:700,fontSize:"12px",
                            fontFamily:"monospace",textAlign:"right"}}/>
                        <span style={{fontSize:"11px",color:C.t2,fontWeight:700}}>%</span>
                      </div>
                    </td>
                    <TD align="right" mono col={matFinal>matBase?C.accent:C.t2} fw={matFinal>matBase?700:400}>
                      {matFinal>0?fM(Math.round(matFinal)):'—'}
                    </TD>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:"10px",marginTop:"16px"}}>
            <Btn onClick={()=>setShowIncrModal(false)} accent={C.t3}>Cancelar</Btn>
            <Btn onClick={()=>{
              const ni={};
              Object.entries(incrEdit).forEach(([k,v])=>{const n=parseFloat(v);if(!isNaN(n)&&n>0)ni[+k]=n;});
              setMatIncr&&setMatIncr(ni);setShowIncrModal(false);
            }} accent={C.green}>Guardar incrementos</Btn>
          </div>
        </Modal>
      )}

      {/* ── Modal edición completa de recurso ── */}
      {editId!==null&&(
        <Modal title="Editar recurso" onClose={()=>setEditId(null)} onEnter={saveRecurso}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>

            {/* ÍTEM DE OBRA */}
            <Fld label="ÍTEM DE OBRA" style={{gridColumn:"1/-1"}}>
              <select value={ed.item||''} onChange={e=>setEd(d=>({...d,item:e.target.value}))}
                style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:"6px",padding:"7px 10px",
                  background:C.surface,color:C.t1,fontSize:"13px"}}>
                {tareas.map(t=><option key={t.id} value={t.item}>#{t.id} — {t.item}</option>)}
              </select>
            </Fld>

            {/* NOMBRE DEL RECURSO */}
            <Fld label="RECURSO / MATERIAL" style={{gridColumn:"1/-1"}}>
              <input list="dl-rec-nombres" value={ed.rec||''} onChange={e=>onEdRecChange(e.target.value)}
                placeholder="Cemento Portland"
                style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:"6px",padding:"7px 10px",
                  background:C.surface,color:C.t1,fontSize:"13px"}}/>
            </Fld>

            {/* UNIDAD */}
            <Fld label="UNIDAD">
              <input list="dl-rec-unds" value={ed.und||''} onChange={e=>setEd(d=>({...d,und:e.target.value}))}
                style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:"6px",padding:"7px 10px",
                  background:C.surface,color:C.t1,fontSize:"13px"}}/>
            </Fld>

            {/* CANTIDAD */}
            <Fld label="CANTIDAD">
              <FInp value={ed.qty} onChange={v=>setEd(d=>({...d,qty:v}))} type="number" step="any"/>
            </Fld>

            {/* PRECIO UNITARIO */}
            <Fld label="PRECIO UNITARIO ($)">
              <FInp value={ed.pu} onChange={v=>setEd(d=>({...d,pu:v}))} type="number" step="any"/>
            </Fld>

            {/* % INCREMENTO — propio de este recurso; vacío = hereda el del ítem */}
            {(()=>{
              const heredado=pctDeItem(ed.item);
              const propio=ed.incr!==undefined&&ed.incr!==null&&ed.incr!=='';
              const pctAplic=propio?(+ed.incr||0):heredado;
              const base=+(ed.qty||0)*+(ed.pu||0);
              return(<>
                <Fld label="% INCREMENTO">
                  <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                    <FInp value={ed.incr??''} onChange={v=>setEd(d=>({...d,incr:v}))} type="number" step="any"
                      ph={heredado>0?`${heredado} (del ítem)`:'0'}/>
                    <span style={{fontWeight:800,color:C.accent,fontSize:"14px"}}>%</span>
                  </div>
                  <div style={{fontSize:"9px",color:C.t3,marginTop:"4px",lineHeight:1.4}}>
                    {propio
                      ?`Incremento propio de este recurso.${heredado>0?` Ignora el ${heredado}% del ítem.`:''}`
                      :heredado>0
                        ?`Vacío: hereda el ${heredado}% definido para el ítem. Escribí un valor para sobrescribirlo.`
                        :'Vacío: sin incremento. Escribí un valor para aplicarlo sólo a este recurso.'}
                  </div>
                </Fld>

                {/* TOTAL CALCULADO */}
                <Fld label="TOTAL FINAL">
                  <div style={{padding:"8px 10px",borderRadius:"6px",background:`${C.red}0d`,
                    border:`1px solid ${C.red}33`,fontFamily:"monospace",fontWeight:800,fontSize:"15px",color:C.red}}>
                    {fM(base*(1+pctAplic/100))}
                  </div>
                  {pctAplic>0&&<div style={{fontSize:"9px",color:C.t3,marginTop:"4px"}}>
                    Base {fM(base)} + {fN(pctAplic,pctAplic%1===0?0:1)}%
                  </div>}
                </Fld>
              </>);
            })()}

          </div>
          <div style={{display:"flex",gap:"10px",marginTop:"16px",justifyContent:"flex-end"}}>
            <Btn onClick={()=>setEditId(null)} accent={C.t3}>Cancelar</Btn>
            <Btn accent={C.green} onClick={saveRecurso}>✓ Guardar cambios</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ══════════ EDITOR RUBROS + ÍTEMS (fuente única de verdad) ══════════ */
function EditorRubros({grupos,setGrupos,rubros,setRubros,tareas,setTareas,rec,setRec,proyecto,moItems,setMoItems,prof,nota=''}){
  const exportPDF=()=>{
    const rows=[];
    grupos.forEach(g=>{rubros.filter(r=>r.grupo===g.id).forEach(r=>{
      tareas.filter(t=>t.rubroId===r.id).forEach(t=>{
        rows.push([g.nombre,r.nombre,t.item,t.und,
          t.qty%1===0?String(t.qty):t.qty.toFixed(1),
          t.hsOf.toFixed(2),t.hsAy.toFixed(2)]);
      });
    });});
    makePDF({
      titulo:'Rubros e Ítems',subtitulo:'Estructura de trabajo de la obra',proyecto,
      kpis:[{label:'Grupos',value:grupos.length},{label:'Rubros',value:rubros.length},{label:'Ítems',value:tareas.length}],
      cols:['Grupo','Rubro','Ítem','Und.','Cant.','Hs·Of/u','Hs·Ay/u'],
      rows,
      colStyles:{3:{halign:'center',cellWidth:28},4:{halign:'right',cellWidth:36},5:{halign:'right',cellWidth:36},6:{halign:'right',cellWidth:36}},
      prof,nota,
    });
  };
  const [showAddG,setShowAddG]=useState(false);
  const [showAddR,setShowAddR]=useState(false);
  const [addItemRid,setAddItemRid]=useState(null); // rubroId para agregar ítem
  const [editGid,setEditGid]=useState(null);
  const [editRid,setEditRid]=useState(null);
  const [editIid,setEditIid]=useState(null); // id tarea para editar
  const [ng,setNg]=useState({nombre:"",color:"#3b82f6"});
  const [nr,setNr]=useState({grupo:grupos[0]?.id||"",nombre:"",color:"#64748b"});
  const [ni,setNi]=useState({item:"",und:"m²"});
  const [eg,setEg]=useState({});
  const [er,setEr]=useState({});
  const [ei,setEi]=useState({item:"",und:"m²"});

  const UNDS=["m²","m³","ml","un","gl","kg"];
  const inpS={width:"100%",border:`1px solid ${C.border}`,borderRadius:"5px",padding:"6px 9px",background:C.surface,color:C.t1,fontSize:"12px"};

  // ── Grupos ──
  const addG=()=>{if(!ng.nombre.trim())return;setGrupos(p=>[...p,{id:uid(),...ng}]);setNg({nombre:"",color:"#3b82f6"});setShowAddG(false);};
  const saveG=()=>{setGrupos(p=>p.map(x=>x.id===editGid?{...x,...eg}:x));setEditGid(null);};
  const delG=id=>{if(rubros.some(r=>r.grupo===id)){alert("Primero eliminá los rubros de este grupo.");return;}setGrupos(p=>p.filter(g=>g.id!==id));};

  // ── Rubros ──
  const addR=()=>{if(!nr.nombre.trim())return;setRubros(p=>[...p,{id:uid(),...nr}]);setNr({grupo:grupos[0]?.id||"",nombre:"",color:"#64748b"});setShowAddR(false);};
  const moveRubro=(rubroId,dir)=>{
    const rub=rubros.find(r=>r.id===rubroId);if(!rub)return;
    const gr=rubros.filter(r=>r.grupo===rub.grupo);
    const idx=gr.findIndex(r=>r.id===rubroId);
    if((dir<0&&idx===0)||(dir>0&&idx===gr.length-1))return;
    const swap=gr[idx+dir];
    const nr2=[...rubros];
    const i1=nr2.findIndex(r=>r.id===rubroId),i2=nr2.findIndex(r=>r.id===swap.id);
    [nr2[i1],nr2[i2]]=[nr2[i2],nr2[i1]];
    setRubros(nr2);
    // Reordenar tareas según nuevo orden de rubros + renumerar
    const ordered=nr2.flatMap(r=>tareas.filter(t=>t.rubroId===r.id));
    const seen=new Set(ordered.map(t=>t.id));
    tareas.filter(t=>!seen.has(t.id)).forEach(t=>ordered.push(t));
    const{tareas:rt,moItems:rmo}=renumberTareas(ordered.map(toRaw),moItems||{});
    setTareas(rt);if(setMoItems)setMoItems(rmo);
  };
  const saveR=()=>{setRubros(p=>p.map(x=>x.id===editRid?{...x,...er}:x));setEditRid(null);};
  const delR=id=>{if(tareas.some(t=>t.rubroId===id)){alert("Primero eliminá los ítems de este rubro.");return;}setRubros(p=>p.filter(r=>r.id!==id));};

  // ── Ítems ──
  const addItem=(rubroId)=>{
    if(!ni.item.trim())return;
    // Insertar después del último ítem del mismo rubro (como en PlanObra)
    let insertIdx=tareas.length;
    for(let i=tareas.length-1;i>=0;i--){if(tareas[i].rubroId===rubroId){insertIdx=i+1;break;}}
    const newTask={rubroId,item:ni.item,und:ni.und,qty:1,hsOf:1,hsAy:.7,nOf:1,nAy:1,pred:"",obs:"",id:0};
    const raw=[...tareas.slice(0,insertIdx).map(toRaw),newTask,...tareas.slice(insertIdx).map(toRaw)];
    const{tareas:rt,moItems:rmo}=renumberTareas(raw,moItems||{});
    setTareas(rt);if(setMoItems)setMoItems(rmo);
    setNi({item:"",und:"m²"});setAddItemRid(null);
  };
  const saveItem=()=>{
    const oldName=tareas.find(t=>t.id===editIid)?.item;
    setTareas(p=>p.map(t=>t.id===editIid?{...t,item:ei.item,und:ei.und}:t));
    // Propagar cambio de nombre a recursos
    if(oldName&&oldName!==ei.item) setRec(p=>p.map(r=>r.item===oldName?{...r,item:ei.item}:r));
    setEditIid(null);
  };
  const delItem=id=>{
    const t=tareas.find(x=>x.id===id);
    if(!t)return;
    if(!window.confirm(`¿Eliminar "${t.item}"? También se eliminarán sus recursos asociados.`))return;
    setRec(p=>p.filter(r=>r.item!==t.item));
    const raw=tareas.filter(x=>x.id!==id).map(toRaw);
    const{tareas:rt,moItems:rmo}=renumberTareas(raw,moItems||{});
    setTareas(rt);if(setMoItems)setMoItems(rmo);
  };
  const moveItem=(id,dir)=>{
    const i=tareas.findIndex(t=>t.id===id);
    if(i===-1)return;
    const ni=i+dir;
    if(ni<0||ni>=tareas.length)return;
    // No cruzar el límite entre rubros distintos
    if(tareas[ni].rubroId!==tareas[i].rubroId)return;
    const n=[...tareas];[n[i],n[ni]]=[n[ni],n[i]];
    const{tareas:rt,moItems:rmo}=renumberTareas(n.map(toRaw),moItems||{});
    setTareas(rt);if(setMoItems)setMoItems(rmo);
  };

  const headerBtns=(label,onClick,accent)=>(
    <button onClick={onClick} style={btnS(accent)}>{label}</button>
  );

  return(
    <div>
      {/* ── BARRA SUPERIOR ── */}
      <div style={{display:"flex",gap:"8px",marginBottom:"14px",flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontWeight:800,fontSize:"12px",color:C.t1,letterSpacing:".3px"}}>ESTRUCTURA DE OBRA</span>
        <span style={{color:C.border}}>—</span>
        <span style={{fontSize:"10px",color:C.t3}}>Todo lo que cargues aquí se propaga automáticamente al resto del documento</span>
        <div style={{marginLeft:"auto",display:"flex",gap:"6px"}}>
          <Btn onClick={()=>{setShowAddG(v=>!v);setShowAddR(false);}} accent={showAddG?C.accent:C.blue} sm>+ Grupo</Btn>
          <Btn onClick={()=>{setShowAddR(v=>!v);setShowAddG(false);}} accent={showAddR?C.accent:C.green} sm>+ Rubro</Btn>
        </div>
      </div>

      {/* Formulario nuevo grupo */}
      {showAddG&&(
        <div style={{background:C.card,border:`1px solid ${C.blue}44`,borderRadius:"9px",padding:"12px",marginBottom:"12px",display:"flex",flexWrap:"wrap",gap:"10px",alignItems:"flex-end"}}>
          <div style={{flex:"1 1 200px"}}><Fld label="NOMBRE GRUPO"><input value={ng.nombre} onChange={e=>setNg(d=>({...d,nombre:e.target.value}))} placeholder="Ej: Obra Gruesa" style={inpS} autoFocus/></Fld></div>
          <div><Fld label="COLOR"><input type="color" value={ng.color} onChange={e=>setNg(d=>({...d,color:e.target.value}))} style={{width:"40px",height:"32px",border:"none",borderRadius:"4px",cursor:"pointer"}}/></Fld></div>
          <Btn onClick={addG} accent={C.blue}>Agregar grupo</Btn><Btn onClick={()=>setShowAddG(false)} accent={C.red} sm>✕</Btn>
        </div>
      )}
      {/* Formulario nuevo rubro */}
      {showAddR&&(
        <div style={{background:C.card,border:`1px solid ${C.green}44`,borderRadius:"9px",padding:"12px",marginBottom:"12px",display:"flex",flexWrap:"wrap",gap:"10px",alignItems:"flex-end"}}>
          <div style={{flex:"1 1 200px"}}><Fld label="NOMBRE RUBRO"><input value={nr.nombre} onChange={e=>setNr(d=>({...d,nombre:e.target.value}))} placeholder="Ej: Revoques" style={inpS} autoFocus/></Fld></div>
          <div style={{minWidth:"160px"}}><Fld label="GRUPO"><select value={nr.grupo} onChange={e=>setNr(d=>({...d,grupo:e.target.value}))} style={inpS}>{grupos.map(g=><option key={g.id} value={g.id}>{g.nombre}</option>)}</select></Fld></div>
          <div><Fld label="COLOR"><input type="color" value={nr.color} onChange={e=>setNr(d=>({...d,color:e.target.value}))} style={{width:"40px",height:"32px",border:"none",borderRadius:"4px",cursor:"pointer"}}/></Fld></div>
          <Btn onClick={addR} accent={C.green}>Agregar rubro</Btn><Btn onClick={()=>setShowAddR(false)} accent={C.red} sm>✕</Btn>
        </div>

      <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
        {grupos.map(g=>{
          const gRubs=rubros.filter(r=>r.grupo===g.id);

            <div key={g.id} style={{background:C.card,border:`2px solid ${g.color}44`,borderRadius:"12px",overflow:"hidden"}}>

                <div style={{padding:"10px 14px",background:`${g.color}15`,borderBottom:`1px solid ${C.border}`,display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
                  <input value={eg.nombre} onChange={e=>setEg(d=>({...d,nombre:e.target.value}))} style={{...inpS,flex:"1 1 140px",fontSize:"13px",fontWeight:700}} autoFocus/>
                  <input type="color" value={eg.color} onChange={e=>setEg(d=>({...d,color:e.target.value}))} style={{width:"36px",height:"30px",border:"none",borderRadius:"4px",cursor:"pointer"}}/>
                  <Btn onClick={saveG} accent={C.green} sm>Guardar</Btn>
                  <Btn onClick={()=>setEditGid(null)} accent={C.t3} sm>Cancelar</Btn>
                </div>
              ):(
                <div className="rowflex" style={{padding:"10px 14px",background:`${g.color}15`,borderBottom:`1px solid ${g.color}33`,display:"flex",alignItems:"center",gap:"10px"}}>
                  <div style={{width:"13px",height:"13px",borderRadius:"3px",background:g.color,flexShrink:0}}/>
                  <span style={{fontWeight:800,fontSize:"13px",color:g.color,flex:1,letterSpacing:".2px"}}>{g.nombre}</span>
                  <span style={{fontSize:"10px",color:C.t3}}>{gRubs.length} rubro{gRubs.length!==1?"s":""} · {gItems.length} ítem{gItems.length!==1?"s":""}</span>
                  <span className="rowbreak"/>
                  <button onClick={()=>{setEditGid(g.id);setEg({nombre:g.nombre,color:g.color});}} style={btnS(C.blue)}>✏ grupo</button>
                  <button onClick={()=>delG(g.id)} style={btnS(C.red)}>✕ grupo</button>
                </div>
              )}

              {/* Rubros del grupo */}
              <div style={{padding:"10px 12px",display:"flex",flexDirection:"column",gap:"8px"}}>
                {gRubs.length===0&&(
                  <div style={{fontSize:"11px",color:C.t3,padding:"8px",textAlign:"center"}}>Sin rubros — agregá uno con el botón "+ Rubro"</div>
                )}
                {gRubs.map(r=>{
                  const rItems=tareas.filter(t=>t.rubroId===r.id);
                  return(
                    <div key={r.id} style={{background:C.surface,borderRadius:"8px",border:`1px solid ${r.color}33`,overflow:"hidden"}}>
                      {/* Cabecera rubro */}
                      {editRid===r.id?(
                        <div style={{padding:"8px 12px",background:`${r.color}11`,borderBottom:`1px solid ${C.border2}`,display:"flex",gap:"7px",alignItems:"center",flexWrap:"wrap"}}>
                          <input value={er.nombre} onChange={e=>setEr(d=>({...d,nombre:e.target.value}))} style={{...inpS,flex:"1 1 120px",fontSize:"12px",fontWeight:600}} autoFocus/>
                          <select value={er.grupo} onChange={e=>setEr(d=>({...d,grupo:e.target.value}))} style={{...inpS,width:"140px"}}>
                            {grupos.map(g2=><option key={g2.id} value={g2.id}>{g2.nombre}</option>)}
                          </select>
                          <input type="color" value={er.color} onChange={e=>setEr(d=>({...d,color:e.target.value}))} style={{width:"32px",height:"28px",border:"none",borderRadius:"4px",cursor:"pointer"}}/>
                          <Btn onClick={saveR} accent={C.green} sm>✓</Btn>
                          <Btn onClick={()=>setEditRid(null)} accent={C.t3} sm>✕</Btn>

                      ):(
                        <div className="rowflex" style={{padding:"8px 12px",display:"flex",alignItems:"center",gap:"8px"}}>
                          <div style={{width:"9px",height:"9px",borderRadius:"2px",background:r.color,flexShrink:0}}/>
                          <Chip label={r.nombre} color={r.color}/>
                          <span style={{fontSize:"10px",color:C.t3,flex:1}}>{rItems.length} ítem{rItems.length!==1?"s":""}</span>
                          <span className="rowbreak"/>
                          {(()=>{
                            const gr2=rubros.filter(x=>x.grupo===r.grupo);
                            const ri=gr2.findIndex(x=>x.id===r.id);
                            return(<>
                              <button onClick={()=>moveRubro(r.id,-1)} title="Subir rubro"

                              <button onClick={()=>moveRubro(r.id,1)} title="Bajar rubro"
                                disabled={ri===gr2.length-1}
                                style={{...btnS(ri===gr2.length-1?C.t3:C.violet),padding:"2px 7px",opacity:ri===gr2.length-1?.35:1}}>▼ rubro</button>
                            </>);
                          })()}
                          <button onClick={()=>{setEditRid(r.id);setEr({nombre:r.nombre,color:r.color,grupo:r.grupo});}} style={btnS(C.blue)}>✏</button>
                          <button onClick={()=>delR(r.id)} style={btnS(C.red)}>✕ rubro</button>
                          <Btn onClick={()=>{setAddItemRid(r.id);setNi({item:"",und:"m²"});}} accent={C.green} sm>+ Ítem</Btn>
                        </div>
                      )}

                      {/* Formulario nuevo ítem */}
                      {addItemRid===r.id&&(
                        <div style={{padding:"8px 12px",background:`${C.green}0a`,borderBottom:`1px solid ${C.green}33`,display:"flex",gap:"8px",alignItems:"flex-end",flexWrap:"wrap"}}>
                          <div style={{flex:"1 1 200px"}}>
                            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>NOMBRE DEL ÍTEM</div>
                            <input value={ni.item} onChange={e=>setNi(d=>({...d,item:e.target.value}))}
                              onKeyDown={e=>{if(e.key==="Enter")addItem(r.id);if(e.key==="Escape")setAddItemRid(null);}}
                              placeholder="Ej: Revoque grueso interior" autoFocus
                              style={{width:"100%",border:`1px solid ${C.green}55`,borderRadius:"5px",padding:"6px 9px",background:C.bg,color:C.t1,fontSize:"12px"}}/>
                          </div>
                          <div>
                            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>UNIDAD</div>
                            <select value={ni.und} onChange={e=>setNi(d=>({...d,und:e.target.value}))}
                              style={{border:`1px solid ${C.green}55`,borderRadius:"5px",padding:"6px 9px",background:C.bg,color:C.t1,fontSize:"12px",width:"75px"}}>
                              {UNDS.map(u=><option key={u}>{u}</option>)}
                            </select>
                          </div>
                          <Btn onClick={()=>addItem(r.id)} accent={C.green} sm>Agregar</Btn>
                          <Btn onClick={()=>setAddItemRid(null)} accent={C.red} sm>✕</Btn>
                        </div>
                      )}

                      {/* Lista de ítems */}
                      {rItems.length===0&&addItemRid!==r.id&&(
                        <div style={{padding:"7px 14px",fontSize:"10px",color:C.t3,fontStyle:"italic"}}>
                          Sin ítems — clic en "+ Ítem" para agregar
                        </div>
                      )}
                      {rItems.map((t,idx)=>(
                        <div key={t.id}>
                          {editIid===t.id?(
                            <div style={{padding:"7px 14px",background:`${C.blue}0d`,borderTop:`1px solid ${C.border2}`,display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
                              <div style={{flex:"1 1 200px"}}>
                                <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>NOMBRE</div>
                                <input value={ei.item} onChange={e=>setEi(d=>({...d,item:e.target.value}))}
                                  onKeyDown={e=>{if(e.key==="Enter")saveItem();if(e.key==="Escape")setEditIid(null);}}
                                  autoFocus style={{width:"100%",border:`1px solid ${C.blue}`,borderRadius:"5px",padding:"5px 8px",background:C.bg,color:C.t1,fontSize:"12px"}}/>
                              </div>
                              <div>
                                <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>UNIDAD</div>
                                <select value={ei.und} onChange={e=>setEi(d=>({...d,und:e.target.value}))}
                                  style={{border:`1px solid ${C.blue}`,borderRadius:"5px",padding:"5px 8px",background:C.bg,color:C.t1,fontSize:"12px",width:"75px"}}>
                                  {UNDS.map(u=><option key={u}>{u}</option>)}
                                </select>
                              </div>
                              <Btn onClick={saveItem} accent={C.green} sm>✓ Guardar</Btn>
                              <Btn onClick={()=>setEditIid(null)} accent={C.t3} sm>Cancelar</Btn>
                            </div>
                          ):(
                            <div className="rowflex" style={{padding:"7px 14px",borderTop:`1px solid ${C.border2}`,
                              display:"flex",alignItems:"center",gap:"10px",
                              background:idx%2===0?"transparent":C.bg+"44"}}>
                              <span style={{fontSize:"9px",color:C.t3,fontFamily:"monospace",minWidth:"18px"}}>{t.id}</span>
                              <span style={{flex:1,fontSize:"12px",color:C.t1,fontWeight:500}}>{t.item}</span>
                              <span style={{fontSize:"10px",fontFamily:"monospace",color:r.color,background:`${r.color}15`,
                                padding:"1px 7px",borderRadius:"4px",fontWeight:700,border:`1px solid ${r.color}33`}}>{t.und}</span>
                              <button onClick={()=>moveItem(t.id,-1)} style={{...btnS(C.t3),padding:"1px 5px"}} title="Subir">↑</button>
                              <button onClick={()=>moveItem(t.id,1)} style={{...btnS(C.t3),padding:"1px 5px"}} title="Bajar">↓</button>
                              <button onClick={()=>{setEditIid(t.id);setEi({item:t.item,und:t.und});}} style={btnS(C.blue)}>✏ editar</button>
                              <button onClick={()=>delItem(t.id)} style={btnS(C.red)}>✕</button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  );
                })}
                {/* Botón agregar rubro al grupo */}
                <button onClick={()=>{setShowAddR(true);setNr(d=>({...d,grupo:g.id}));setShowAddG(false);}}
                  style={{...btnS(C.green),padding:"6px 12px",fontSize:"11px",border:`1px dashed ${C.green}44`,background:"transparent",width:"100%"}}>
                  + Agregar rubro a {g.nombre}
                </button>
              </div>
            </div>
          );
        })}
        {grupos.length===0&&(
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"30px",textAlign:"center",color:C.t3}}>
            Sin grupos todavía. Cliqueá "+ Grupo" para crear el primer grupo de rubros.
          </div>
        )}
      </div>

      {/* ── RESUMEN ── */}
      {tareas.length>0&&(
        <div style={{marginTop:"16px",background:C.surface,border:`1px solid ${C.border}`,borderRadius:"9px",padding:"10px 14px",
          display:"flex",gap:"20px",flexWrap:"wrap",fontSize:"11px",color:C.t2,alignItems:"center"}}>
          <span>Grupos: <b style={{color:C.t1}}>{grupos.length}</b></span>
          <span>Rubros: <b style={{color:C.t1}}>{rubros.length}</b></span>
          <span>Ítems totales: <b style={{color:C.accent}}>{tareas.length}</b></span>
          <span style={{color:C.t3,fontSize:"10px"}}>
            ✓ Cambios en nombre/unidad se propagan a Plan de Obra, Recursos, Incidencia y Gantt
          </span>
          <Btn onClick={exportPDF} accent={C.orange} sm style={{marginLeft:"auto"}}>📄 PDF</Btn>
        </div>
      )}
    </div>
  );
}

/* ── IndexedDB: persistir file handle entre sesiones ── */
const _IDB='obragestion_fsh';
const _dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open(_IDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const _fhSave=async h=>{try{const db=await _dbOpen();const tx=db.transaction('h','readwrite');tx.objectStore('h').put(h,'k');await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});db.close();}catch(e){console.warn('IDB:',e);}};
const _fhLoad=async()=>{try{const db=await _dbOpen();const tx=db.transaction('h','readonly');const h=await new Promise(res=>{const r=tx.objectStore('h').get('k');r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});db.close();return h;}catch{return null;}};

/* ══════════ ASISTENTE CONVERSACIONAL (IA) ══════════
   Cargá el plan hablando o escribiendo: el asistente interpreta lo que le decís
   y completa rubros, ítems, cantidades, cuadrillas, predecesoras y fechas.
   ═══════════════════════════════════════════════════ */
const AI_KEY_LS='obragestion_ai_key';
const AI_MODEL='claude-sonnet-4-6';
const getAIKey=()=>{try{return localStorage.getItem(AI_KEY_LS)||'';}catch{return'';}};
const setAIKey=k=>{try{k?localStorage.setItem(AI_KEY_LS,k):localStorage.removeItem(AI_KEY_LS);}catch{}};

const AI_SYSTEM=`Sos un asistente experto en planificación de obra de construcción en Argentina. Trabajás dentro de la app ObraGestión del Arq. Federico Pickelny (San Juan). Hablás en español rioplatense, breve y de oficio.

Tu trabajo: el usuario te va CONTANDO la obra de a poco (a veces un ítem, a veces diez, en desorden, con datos incompletos). Vos traducís eso a acciones concretas que llenan el plan de trabajo, y le respondés confirmando qué cargaste y qué te falta.

REGLAS DE TRABAJO
1. NUNCA le pidas que complete todos los datos antes de cargar. Cargá con lo que tenés y estimá el resto vos.
2. Rendimientos (hsOf = horas de oficial por unidad, hsAy = horas de ayudante por unidad): si el usuario no los dice, estimalos vos con criterio profesional argentino. Usá la BASE DE RENDIMIENTOS que te paso cuando el ítem coincida o se parezca.
3. Cuadrilla (nOf = cantidad de oficiales, nAy = cantidad de ayudantes): si el usuario dice "van 4 personas" o "una cuadrilla de 3", repartilo con criterio (ej: 4 personas ≈ 2 oficiales + 2 ayudantes). Si no dice nada, poné 1 y 1.
4. Predecesoras: inferí el encadenamiento lógico de obra (no se revoca antes de mampostear, no se pinta antes de revocar). En "pred" poné el NOMBRE EXACTO del ítem predecesor, o varios separados por coma. La app los convierte a números sola.
5. Si el usuario nombra un rubro que no existe, creálo primero con una acción "rubro". Si nombra un ítem sin decir rubro, asignalo al rubro que corresponda por oficio.
6. Si el usuario da una FECHA DE ENTREGA / fin de obra, no la cargues como config (la app calcula el fin sola). Avisale en el mensaje si el plan cargado se pasa o entra, y sugerí reforzar cuadrillas. La fecha de INICIO sí va en config.
7. Todo lo que hagas explicalo en "mensaje": qué cargaste, con qué supuestos, y UNA sola pregunta al final si hace falta (nunca una lista larga de preguntas).
8. Si el usuario sólo charla o pregunta algo, respondé con "acciones": [] y contestá en "mensaje".

FORMATO DE RESPUESTA — CRÍTICO
Respondé SIEMPRE con un único objeto JSON válido, sin markdown, sin backticks, sin texto antes ni después:
{
  "mensaje": "texto para el usuario",
  "acciones": [ ... ]
}
