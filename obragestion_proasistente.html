/* ══════════ MÓVIL / TABLET ══════════
   El header y las filas de acciones son flex de una sola línea: en pantallas
   angostas eso forzaba el documento a ~860px y el navegador hacía zoom-out.
   Acá se dejan envolver para que todo entre sin cortarse.
   ═══════════════════════════════════ */
@media (max-width:860px){

  .hdr-brand{min-width:0!important;flex:1 1 100%!important;border-right:none!important;

  .hdr-tabs{flex:1 1 100%!important;order:3;border-top:1px solid #e2e8f0;

  .rowbreak{display:block!important;flex:1 0 100%!important;height:0}
}

const _driveLoad=async(obraName)=>{

  }catch{return null;}
};

// __SNAP__: null en el archivo base.
// Cuando el usuario hace "Guardar HTML", se embebe el estado completo aquí.
// Cada archivo guardado lleva un _pid único → su propia clave en localStorage → sin conflictos entre obras.
const __SNAP__=/* @SNAP */null/* /@SNAP */;
const _activeKey=__SNAP__?._pid?`obracalc_pro_v4_p_${__SNAP__._pid}`:_urlObra?`obracalc_pro_v4_w_${_urlObra.replace(/[^a-z0-9áéíóúüñÁÉÍÓÚÜÑ]/gi,'_').slice(0,32)}`:SK;

function guardarStorage(data){
  try{localStorage.setItem(_activeKey,JSON.stringify({...data,_ts:Date.now()}));}catch(e){console.warn('localStorage:',e);}
}

const _saved=(()=>{
  if(!__SNAP__){
    // Versión web: cargar desde localStorage (clave por URL param o clave por defecto)
    try{const r=localStorage.getItem(_activeKey);if(r)return JSON.parse(r);}catch{}
    return null;
  }
  // Archivo guardado → prioridad: localStorage con clave PID, luego snapshot embebido
  let d=null;
  try{const r=localStorage.getItem(_activeKey);if(r)d=JSON.parse(r);}catch{}
  if(!d)d={...__SNAP__};
  if(!d)return null;
  // Migración automática: re-ordenar tareas según jerarquía grupos→rubros y renumerar IDs
  if(d?.tareas?.length&&d.grupos?.length&&d.rubros?.length){
    const sorted=d.grupos.flatMap(g=>
      d.rubros.filter(r=>r.grupo===g.id).flatMap(r=>
        d.tareas.filter(t=>t.rubroId===r.id)
      )
    );
    // Incluir ítems huérfanos (rubro eliminado) al final
    const seen=new Set(sorted.map(t=>t.id));
    d.tareas.filter(t=>!seen.has(t.id)).forEach(t=>sorted.push(t));
    // Mapa: id anterior → nuevo id secuencial
    const mp={};sorted.forEach((t,i)=>{mp[t.id]=i+1;});
    d.tareas=sorted.map((t,i)=>({
      ...t,id:i+1,
      pred:t.pred?String(t.pred).split(',').map(p=>{
        const n=parseInt(p.trim());return isNaN(n)?p.trim():(mp[n]?String(mp[n]):null);
      }).filter(Boolean).join(','):'',
    }));
    if(d.moItems){
      const mo={};
      Object.entries(d.moItems).forEach(([k,v])=>{const nk=mp[+k];if(nk!==undefined)mo[nk]=v;});
      d.moItems=mo;
    }
  }
  return d;
})();

/* ══════════ HELPERS ══════════ */
const pF=s=>{if(!s)return new Date(2025,0,1);const p=String(s).split("/");return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):new Date(s);};
const fF=d=>{if(!d||isNaN(d.getTime()))return"—";return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;};
const aD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const fN=(n,d=0)=>new Intl.NumberFormat("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(+(n||0));
const fM=n=>`$${fN(n)}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const btnS=acc=>({background:`${acc}22`,border:`1px solid ${acc}44`,color:acc,borderRadius:"4px",padding:"2px 7px",cursor:"pointer",fontSize:"10px",fontWeight:700});

/* ── Helpers días hábiles ── */
const isWeekend=(d,sabado=false)=>{const n=d.getDay();return n===0||(n===6&&!sabado);};
const nextWorkDay=(d,sabado=false)=>{const r=new Date(d);while(isWeekend(r,sabado))r.setDate(r.getDate()+1);return r;};
const addWorkDays=(d,n,sabado=false)=>{
  if(n<=0)return new Date(d);
  const r=new Date(d);let remaining=n;
  while(remaining>0.001){
    r.setDate(r.getDate()+1);
    const day=r.getDay();
    if(day===0)continue;
    if(day===6){if(sabado)remaining-=0.5;}
    else remaining-=1;
  }
  return r;
};

/* ── Duración (lógica Excel) ── */
const isGL=t=>/^gl$/i.test((t.und||'').trim());
/* Incremento de materiales: cada recurso puede llevar su propio % (r.incr).
   Si no lo tiene, hereda el % cargado para el ítem. Se usa en Recursos $ y en el Gantt,
   para que ambos muestren siempre el mismo importe final. */
const pctIncrRec=(r,pctItem)=>
  (r.incr!==undefined&&r.incr!==null&&r.incr!=='')?(+r.incr||0):(+pctItem||0);
const sumRecIncr=(rs,pctItem)=>
  rs.reduce((s,r)=>s+r.qty*r.pu*(1+pctIncrRec(r,pctItem)/100),0);

const cDur=(t,hsDia)=>{
  // GL: duración manual (t.dias), sin cálculo de horas
  if(isGL(t)){const d=Math.max(1,+(t.dias)||1);return{hOf:0,hAy:0,dOf:d,dAy:d,dFin:d};}
  const hOf=+t.qty*+t.hsOf,hAy=+t.qty*+t.hsAy;
  const dOf=Math.max(1,Math.ceil(hOf/(Math.max(1,+t.nOf)*hsDia)));
  const dAy=Math.max(1,Math.ceil(hAy/(Math.max(1,+t.nAy)*hsDia)));
  return{hOf,hAy,dOf,dAy,dFin:Math.max(dOf,dAy)};
};

/* ── Detección de conflictos en predecesoras ── */
function detectConflicts(tareas){
  const errors=[];
  const idSet=new Set(tareas.map(t=>t.id));
  const predMap={};
  tareas.forEach(t=>{
    predMap[t.id]=[];
    if(!t.pred||!String(t.pred).trim())return;
    String(t.pred).split(",").map(p=>parseInt(p.trim())).filter(n=>!isNaN(n)).forEach(pid=>{
      if(pid===t.id){errors.push({taskId:t.id,tipo:"self",msg:`El ítem #${t.id} "${t.item}" se referencia a sí mismo`});}
      else if(!idSet.has(pid)){errors.push({taskId:t.id,tipo:"invalid",msg:`El ítem #${t.id} "${t.item}" referencia a #${pid} que no existe`});}
      else predMap[t.id].push(pid);
    });
  });
  // DFS detección de ciclos
  const WHITE=0,GRAY=1,BLACK=2;
  const color={};tareas.forEach(t=>color[t.id]=WHITE);
  const cycleIds=new Set();
  function dfs(id){
    color[id]=GRAY;
    for(const p of(predMap[id]||[])){
      if(color[p]===GRAY){cycleIds.add(id);cycleIds.add(p);}
      else if(color[p]===WHITE)dfs(p);
    }
    color[id]=BLACK;
  }
  tareas.forEach(t=>{if(color[t.id]===WHITE)dfs(t.id);});
  if(cycleIds.size>0){
    const names=tareas.filter(t=>cycleIds.has(t.id)).map(t=>`#${t.id} "${t.item}"`).join(", ");
    errors.push({taskId:null,tipo:"cycle",msg:`Dependencia circular entre: ${names}`});
    cycleIds.forEach(id=>errors.push({taskId:id,tipo:"cycle_node",msg:"Parte de un ciclo circular"}));
  }
  return errors;
}

/* ── Scheduling con predecesoras (orden topológico) ── */
function calcFechas(tareas,inicioStr,hsDia,sabado=false){
  const fi=nextWorkDay(pF(inicioStr),sabado);
  const idSet=new Set(tareas.map(t=>t.id));
  const finMap={},durMap={},iniMap={};
  const visited=new Set(),inStack=new Set();

  const getPreds=t=>{
    if(!t.pred||!String(t.pred).trim())return[];
    return String(t.pred).split(",").map(p=>parseInt(p.trim())).filter(n=>!isNaN(n)&&n!==t.id&&idSet.has(n));
  };

  function visit(t){
    if(inStack.has(t.id)||visited.has(t.id))return;
    inStack.add(t.id);
    getPreds(t).forEach(pid=>{const p=tareas.find(x=>x.id===pid);if(p)visit(p);});
    const dur=cDur(t,hsDia);
    let ini=fi;
    const valids=getPreds(t).filter(id=>finMap[id]);
    if(t.fIniManual){
      ini=nextWorkDay(pF(t.fIniManual),sabado);                                  // fecha manual → prioridad máxima
    }else if(t.solapa&&valids.length){
      const mx=Math.max(...valids.map(id=>iniMap[id].getTime()));
      ini=nextWorkDay(new Date(mx),sabado);                                      // SS: mismo inicio que el predecesor
    }else if(valids.length){
      const mx=Math.max(...valids.map(id=>finMap[id].getTime()));
      ini=nextWorkDay(aD(new Date(mx),1),sabado);                                // FS (por defecto)
    }
    const fin=addWorkDays(ini,dur.dFin-1,sabado);
    finMap[t.id]=fin;durMap[t.id]=dur;iniMap[t.id]=ini;
    inStack.delete(t.id);visited.add(t.id);
  }

  tareas.forEach(t=>visit(t));
  return tareas.map(t=>({
    ...t,...(durMap[t.id]||cDur(t,hsDia)),
    fIni:iniMap[t.id]||fi,
    fFin:finMap[t.id]||addWorkDays(fi,(durMap[t.id]||cDur(t,hsDia)).dFin-1,sabado),
  }));
}

/* ══════════ INICIO EDITABLE (fecha manual o auto) ══════════ */
function IniCell({t,onSave,onClear}){
  const manual=!!t.fIniManual;
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState('');

  const open=()=>{
    // Pre-llenar con la fecha actual del ítem
    setVal(fF(t.fIni));
    setEditing(true);
  };

  const commit=v=>{
    const d=pF(v);
    if(!d||isNaN(d.getTime())){alert('Fecha inválida. Ingresá DD/MM/AAAA.');return;}
    onSave(v);setEditing(false);
  };

  // Mascara automática: solo dígitos, inserta / en posición 2 y 5
  const handleKD=e=>{
    if(e.key==='Escape'){setEditing(false);return;}
    if(e.key==='Enter'){commit(val);return;}
    if(e.key==='Backspace'){
      e.preventDefault();
      setVal(v=>{let s=v;if(s.endsWith('/'))s=s.slice(0,-1);return s.slice(0,-1);});
      return;
    }
    if(!/^\d$/.test(e.key))return;
    e.preventDefault();
    setVal(prev=>{
      const digs=(prev.replace(/\//g,'')+e.key).slice(0,8);
      let r=digs;
      if(digs.length>2)r=digs.slice(0,2)+'/'+digs.slice(2);
      if(digs.length>4)r=digs.slice(0,2)+'/'+digs.slice(2,4)+'/'+digs.slice(4);
      if(r.length===10)setTimeout(()=>commit(r),0); // fecha completa → auto-guardar
      return r;
    });
  };

  if(editing)return(
    <td style={{padding:"3px 5px",borderBottom:`1px solid ${C.border2}`,background:`${C.accent}11`}}>
      <div style={{display:"flex",alignItems:"center",gap:"3px"}}>
        <input autoFocus value={val} onChange={()=>{}} onKeyDown={handleKD}
          placeholder="DD/MM/AAAA" maxLength={10}
          style={{width:"90px",border:`1px solid ${C.accent}`,borderRadius:"4px",padding:"3px 6px",
            background:C.bg,color:C.accent,fontFamily:"monospace",fontWeight:700,fontSize:"12px",
            textAlign:"center",letterSpacing:"1px"}}/>
        <button onClick={()=>commit(val)} style={btnS(C.green)}>✓</button>
        <button onClick={()=>setEditing(false)} style={{...btnS(C.t3),padding:"1px 4px"}}>✕</button>
      </div>
    </td>
  );
  return(
    <td style={{padding:"4px 6px",textAlign:"center",borderBottom:`1px solid ${C.border2}`,
      background:manual?`${C.accent}0d`:undefined,minWidth:"82px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"3px"}}>
        <span onClick={open}
          title={manual?"📌 Fecha fijada — clic para cambiar":"Fecha automática — clic para fijar"}
          style={{fontFamily:"monospace",fontSize:"10px",cursor:"pointer",
            color:manual?C.accent:C.t2,fontWeight:manual?700:400,
            borderBottom:manual?`1px dashed ${C.accent}`:'none'}}>
          {fF(t.fIni)}{manual?' 📌':''}
        </span>
        {manual&&<button onClick={onClear} title="Volver a fecha automática"
          style={{...btnS(C.t3),padding:"0 3px",fontSize:"9px",lineHeight:"14px"}}>×</button>}
      </div>
    </td>
  );
}

/* ══════════ PRED EDITOR ══════════ */
function PredCell({t,todos,erroresMap,onSave}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(t.pred||"");
  const idSet=new Set(todos.map(x=>x.id));
  const hasErr=erroresMap[t.id]&&erroresMap[t.id].length>0;

  if(editing){
    // Validación en tiempo real
    const preds=val.split(",").map(p=>parseInt(p.trim())).filter(n=>!isNaN(n));
    const warns=[];
    preds.forEach(pid=>{
      if(pid===t.id)warns.push(`#${pid}: sí mismo`);
      else if(!idSet.has(pid))warns.push(`#${pid}: no existe`);
    });
    return(
      <td style={{padding:"4px 6px",borderBottom:`1px solid ${C.border2}`,background:`${C.blue}0d`,minWidth:"120px"}}>
        <div style={{display:"flex",flexDirection:"column",gap:"3px"}}>
          <div style={{display:"flex",gap:"3px",alignItems:"center"}}>
            <input autoFocus value={val} onChange={e=>setVal(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"){onSave(val);setEditing(false);}if(e.key==="Escape")setEditing(false);}}
              placeholder="Ej: 3,5"
              style={{width:"90px",border:`1px solid ${warns.length?C.red:C.blue}`,borderRadius:"4px",padding:"3px 5px",
                background:C.bg,color:C.t1,fontSize:"11px",fontFamily:"monospace"}}/>
            <button onClick={()=>{if(!warns.length){onSave(val);setEditing(false);}}} style={{...btnS(C.green)}}>✓</button>
            <button onClick={()=>setEditing(false)} style={{...btnS(C.red)}}>✕</button>
          </div>
          {warns.length>0&&<div style={{fontSize:"9px",color:C.red}}>{warns.join(" · ")}</div>}
          <div style={{fontSize:"9px",color:C.t3}}>IDs disponibles: {todos.filter(x=>x.id!==t.id).map(x=>`#${x.id}`).slice(0,8).join(", ")}</div>
        </div>
      </td>
    );
  }
  return(
    <td className="editable-cell" onClick={()=>{setVal(t.pred||"");setEditing(true);}}
      title={hasErr?"⚠ Error en predecesoras — clic para editar":"Clic para editar predecesoras"}
      style={{padding:"6px 9px",textAlign:"center",borderBottom:`1px solid ${C.border2}`,cursor:"pointer",
        background:hasErr?`${C.red}0d`:"transparent",color:hasErr?C.red:"#2563eb",fontFamily:"monospace",fontSize:"11px",fontWeight:400}}>
      {t.pred||"—"}
      {hasErr&&<span style={{marginLeft:"4px",fontSize:"10px"}}>⚠</span>}
    </td>
  );
}

/* ══════════ PANEL CUADRILLAS 3 NIVELES (Grupo > Rubro > Ítem) ══════════ */
function CuadrillasPanel({tareas,rubros,grupos,cuadGrupos,setCuadGrupos,cuadRubros,setCuadRubros}){
  const rubrosActivos=rubros.filter(r=>tareas.some(t=>t.rubroId===r.id));
  const getCG=gid=>cuadGrupos[gid]||{nOf:2,nAy:2,global:false};
  const getCR=rid=>cuadRubros[rid]||{nOf:1,nAy:1,global:false};

  // Togglear grupo: si se activa, quitar overrides de rubros del grupo
  const toggleGrupo=(gid,checked)=>{
    setCuadGrupos(p=>({...p,[gid]:{...getCG(gid),global:checked}}));
    if(checked){
      setCuadRubros(p=>{
        const nxt={...p};
        rubrosActivos.filter(r=>r.grupo===gid).forEach(r=>{if(nxt[r.id])nxt[r.id]={...nxt[r.id],global:false};});
        return nxt;
      });
    }
  };
  // Togglear rubro override
  const toggleRubro=(rid,checked)=>setCuadRubros(p=>({...p,[rid]:{...getCR(rid),global:checked}}));
  const setCGVal=(gid,k,v)=>setCuadGrupos(p=>({...p,[gid]:{...getCG(gid),[k]:v}}));
  const setCRVal=(rid,k,v)=>setCuadRubros(p=>({...p,[rid]:{...getCR(rid),[k]:v}}));

  const numInput=(val,onChange,active)=>(
    <input type="number" min="1" max="20" value={val} onChange={e=>onChange(+e.target.value)}
      style={{width:"52px",border:`1px solid ${active?C.green+"55":C.border}`,borderRadius:"4px",
        padding:"3px 6px",background:active?`${C.green}0d`:C.bg,
        color:active?C.green:C.t2,fontFamily:"monospace",fontWeight:700,fontSize:"13px",textAlign:"right"}}/>
  );

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",overflow:"hidden",marginBottom:"14px"}}>
      <div style={{padding:"9px 14px",background:C.surface,borderBottom:`1px solid ${C.border}`,
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontWeight:700,fontSize:"11px",color:C.t3,letterSpacing:".5px"}}>👷 CUADRILLAS — 3 NIVELES</span>
        <span style={{fontSize:"10px",color:C.t3}}>Grupo engloba todo · Rubro sobrescribe grupo · Ítem edita en tabla</span>
      </div>
      {/* Leyenda niveles */}
      <div style={{padding:"7px 14px",background:`${C.blue}09`,borderBottom:`1px solid ${C.border2}`,display:"flex",gap:"16px",fontSize:"9px"}}>
        {[["🔵 GRUPO","Aplica a todos los rubros e ítems del grupo",C.blue],
          ["🟢 RUBRO","Sobrescribe al grupo para ese rubro",C.green],
          ["⬜ ÍTEM","Sin tilde grupal/rubro → editá directamente en la tabla",C.t3]].map(([lbl,desc,col])=>(
          <div key={lbl} style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <span style={{fontWeight:700,color:col}}>{lbl}</span>
            <span style={{color:C.t3}}>{desc}</span>
          </div>
        ))}
      </div>
      <div style={{padding:"12px",display:"flex",flexWrap:"wrap",gap:"10px"}}>
        {grupos.map(g=>{
          const rubs=rubrosActivos.filter(r=>r.grupo===g.id);
          if(!rubs.length)return null;
          const cg=getCG(g.id);
          const rubsConOverride=rubs.filter(r=>getCR(r.id).global);
          const countCovered=cg.global?rubs.length-rubsConOverride.length:0;
          return(
            <div key={g.id} style={{flex:"1 1 260px",minWidth:"260px",background:C.surface,borderRadius:"9px",
              padding:"11px 13px",border:`2px solid ${cg.global?g.color+"55":C.border}`}}>
              {/* Nivel GRUPO */}
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px",
                padding:"8px 10px",background:cg.global?`${g.color}18`:C.bg,borderRadius:"7px",
                border:`1px solid ${cg.global?g.color+"44":C.border2}`}}>
                <label style={{display:"flex",alignItems:"center",gap:"5px",cursor:"pointer",flex:1,minWidth:0}}>
                  <input type="checkbox" checked={cg.global} onChange={e=>toggleGrupo(g.id,e.target.checked)}
                    style={{accentColor:g.color,cursor:"pointer",width:"14px",height:"14px"}}/>
                  <span style={{fontWeight:800,fontSize:"12px",color:cg.global?g.color:C.t1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.nombre}</span>
                  {cg.global&&<span style={{fontSize:"9px",color:g.color,flexShrink:0}}>({countCovered} rubros)</span>}
                </label>
                {[["OF",cg.nOf,"nOf"],[" AY",cg.nAy,"nAy"]].map(([lbl,val,k])=>(
                  <div key={k} style={{display:"flex",alignItems:"center",gap:"3px",flexShrink:0}}>
                    <span style={{fontSize:"9px",fontWeight:700,color:cg.global?g.color:C.t3}}>{lbl}</span>
                    {numInput(val,v=>setCGVal(g.id,k,v),cg.global)}
                  </div>
                ))}
              </div>

              {/* Nivel RUBRO */}
              {rubs.map(r=>{
                const cr=getCR(r.id);
                const siguiendoGrupo=cg.global&&!cr.global;
                const tieneOverride=cr.global;
                return(
                  <div key={r.id} style={{marginBottom:"6px",padding:"7px 9px",
                    background:tieneOverride?`${r.color}18`:siguiendoGrupo?`${g.color}08`:C.card,
                    borderRadius:"6px",border:`1px solid ${tieneOverride?r.color+"44":siguiendoGrupo?g.color+"22":C.border2}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:"7px"}}>
                      {/* Chip rubro */}
                      <div style={{flexShrink:0}}>
                        <Chip label={r.nombre} color={r.color} sm/>
                      </div>

                      {siguiendoGrupo&&(
                        <span style={{fontSize:"9px",color:g.color,flex:1}}>
                          ← grupo ({cg.nOf}of/{cg.nAy}ay)
                        </span>
                      )}

                      {!siguiendoGrupo&&!tieneOverride&&(
                        <span style={{fontSize:"9px",color:C.t3,flex:1}}>Ítem por ítem en tabla</span>
                      )}

                      {tieneOverride&&(
                        <>
                          <span style={{fontSize:"9px",color:r.color,flex:1}}>Override activo</span>
                          {[["OF",cr.nOf,"nOf"],["AY",cr.nAy,"nAy"]].map(([lbl,val,k])=>(
                            <div key={k} style={{display:"flex",alignItems:"center",gap:"2px",flexShrink:0}}>
                              <span style={{fontSize:"9px",fontWeight:700,color:r.color}}>{lbl}</span>
                              {numInput(val,v=>setCRVal(r.id,k,v),true)}
                            </div>
                          ))}
                        </>
                      )}

                      {/* Toggle override rubro */}
                      <label title={tieneOverride?"Quitar personalización del rubro":"Personalizar este rubro"}
                        style={{display:"flex",alignItems:"center",gap:"4px",cursor:"pointer",flexShrink:0}}>
                        <input type="checkbox" checked={tieneOverride}
                          onChange={e=>toggleRubro(r.id,e.target.checked)}
                          style={{accentColor:r.color,cursor:"pointer",width:"12px",height:"12px"}}/>
                        <span style={{fontSize:"9px",color:tieneOverride?r.color:C.t3,fontWeight:tieneOverride?700:400}}>
                          {tieneOverride?"✓ Propio":"Personalizar"}
                        </span>
                      </label>
                    </div>
                    {/* Cuántos ítems aplica */}
                    {(tieneOverride||siguiendoGrupo)&&(
                      <div style={{marginTop:"4px",fontSize:"9px",color:tieneOverride?r.color:g.color}}>
                        Aplica a {tareas.filter(t=>t.rubroId===r.id).length} ítem{tareas.filter(t=>t.rubroId===r.id).length!==1?"s":""}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════ PDF EXPORT ENGINE ══════════ */
const NOTA_PDF_DEFAULT=
  'NOTA: Los valores, porcentajes, montos y demás datos incluidos en este documento son de carácter estimativo. '+
  'Están sujetos a variación según múltiples factores: rendimiento real de los materiales, cotizaciones vigentes al '+
  'momento de ejecución, disponibilidad en el mercado, adicionales de obra, imprevistos, condiciones climáticas y otros '+
  'agentes propios de cada proyecto. Se recomienda actualizar y verificar todos los valores antes de su aplicación.';

function makePDF({titulo,subtitulo,proyecto,kpis=[],cols,rows,colStyles={},orientation='portrait',tableOptions={},prof={},nota=''}){
  if(!window.jspdf)return void alert('jsPDF no cargó. Verificá tu conexión a internet.');
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation,unit:'pt',format:'letter'});
  const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();
  const MG=38;
  const ORG=[217,119,6],DRK=[34,34,34],GRY=[100,100,100],LGY=[232,236,240],VLG=[248,250,252];

  const hdr=(pn)=>{
    // Título grande (izquierda)
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...DRK);
    doc.text(titulo,MG,31);
    // Badge "ObraGestión v4" (naranja, derecha)
    doc.setFillColor(...ORG);doc.roundedRect(PW-MG-68,16,68,17,2.5,2.5,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,255,255);
    doc.text('ObraGestión  v4',PW-MG-5,27,{align:'right'});
    // Línea separadora naranja
    doc.setFillColor(...ORG);doc.rect(MG,40,PW-MG*2,2.5,'F');
    // Subtítulo: descripción · proyecto · fecha
    const dStr=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
    const sub=subtitulo?`${subtitulo}  ·  ${proyecto}  ·  ${dStr}`:`${proyecto}  ·  ${dStr}`;
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...GRY);
    doc.text(sub,MG,52);
  };
  const hasNota=!!(nota&&nota.trim());
  const hasProfData=!!(prof&&prof.nombre);
  // Altura reservada para la nota al pie (0 si no hay nota)
  const NH=hasNota?80:0;
  const FTRH=hasProfData?62:37;
  const botMargin=FTRH+(hasNota?NH+8:10);

  const ftr=(pn,tot)=>{
    const dtStr=new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    // ── NOTA arriba del pie de página ──
    if(hasNota){
      const nW=PW-2*MG;const nHH=NH-6;
      const ny=PH-FTRH-nHH-4;
      doc.setFillColor(248,250,253);doc.setDrawColor(190,205,220);doc.setLineWidth(.5);
      doc.roundedRect(MG,ny,nW,nHH,2.5,2.5,'FD');
      const px=MG+5,tw=nW-10,lh=7;
      let cy=ny+10;
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(65,65,65);
      doc.text('NOTA:',px,cy);cy+=lh+1;
      doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(85,85,85);
      doc.splitTextToSize(nota.trim(),tw).slice(0,8).forEach(l=>{doc.text(l,px,cy);cy+=lh;});
    }
    // ── Pie de página ──
    if(hasProfData){
      doc.setDrawColor(...LGY);doc.setLineWidth(.4);doc.line(MG,PH-62,PW-MG,PH-62);
      doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...GRY);
      doc.text(`ObraGestión v4 — ${dtStr}`,MG,PH-51);
      doc.text(`Pág. ${pn} / ${tot}`,PW-MG,PH-51,{align:'right'});
      doc.setFillColor(...ORG);doc.rect(MG,PH-44,PW-MG*2,3.5,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...ORG);
      doc.text((prof.nombre||'').toUpperCase(),MG,PH-31);
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...DRK);
      if(prof.titulo)doc.text((prof.titulo||'').toUpperCase(),MG,PH-21);
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...GRY);
      if(prof.matricula)doc.text(prof.matricula,MG,PH-12);
      doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...GRY);
      if(prof.telefono)doc.text(String(prof.telefono),PW-MG,PH-31,{align:'right'});
      if(prof.email)doc.text(String(prof.email),PW-MG,PH-21,{align:'right'});
      if(prof.direccion)doc.text(String(prof.direccion),PW-MG,PH-12,{align:'right'});
    }else{
      doc.setDrawColor(...LGY);doc.setLineWidth(.4);doc.line(MG,PH-37,PW-MG,PH-37);
      doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...GRY);
      doc.text(`ObraGestión v4 — ${dtStr}`,MG,PH-25);
      doc.text(`Pág. ${pn} / ${tot}`,PW-MG,PH-25,{align:'right'});
    }
  };

  let sy=62;
  if(kpis.length){
    const kW=(PW-MG*2)/kpis.length;
    kpis.forEach((k,i)=>{
      const kx=MG+i*kW;
      doc.setFillColor(...VLG);doc.roundedRect(kx+3,sy,kW-6,29,2.5,2.5,'F');
      doc.setDrawColor(...LGY);doc.setLineWidth(.5);doc.roundedRect(kx+3,sy,kW-6,29,2.5,2.5,'S');
      doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(...GRY);
      doc.text(String(k.label),kx+kW/2,sy+10,{align:'center'});
      doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(...DRK);
      doc.text(String(k.value),kx+kW/2,sy+22,{align:'center'});
    });
    sy+=37;
  }
  sy+=4;

  const{didDrawPage:xDDP,...restTO}=tableOptions;
  doc.autoTable({
    startY:sy,head:[cols],body:rows,
    margin:{left:MG,right:MG,top:64,bottom:botMargin},
    styles:{font:'helvetica',fontSize:7.5,textColor:DRK,cellPadding:{top:4,bottom:4,left:4,right:4},lineColor:[200,210,220],lineWidth:.5},
    headStyles:{fillColor:VLG,textColor:GRY,fontStyle:'bold',fontSize:6.8,lineWidth:.5,lineColor:[200,210,220],cellPadding:{top:5,bottom:5,left:4,right:4}},
    alternateRowStyles:{fillColor:[241,245,249]},
    columnStyles:colStyles,
    ...restTO,
    didDrawPage:(d)=>{hdr(d.pageNumber);xDDP&&xDDP(d);},
  });

  const tot=doc.internal.getNumberOfPages();
  for(let i=1;i<=tot;i++){doc.setPage(i);ftr(i,tot);}
  const safe=titulo.toLowerCase().replace(/[^a-z0-9]+/g,'_');
  doc.save(`obraGestion_${safe}.pdf`);
}

/* ══════════ RENUMERACIÓN DE ÍTEMS ══════════ */
// Asigna ids secuenciales (1,2,3…) y actualiza referencias en pred y moItems
function renumberTareas(arr, moItems){
  const map={};arr.forEach((t,i)=>{map[t.id]=i+1;});
  const tareas=arr.map((t,i)=>({
    ...t,id:i+1,
    pred:t.pred?String(t.pred).split(',').map(p=>{
      const n=parseInt(p.trim());
      return isNaN(n)?p.trim():map[n]?String(map[n]):null;
    }).filter(Boolean).join(','):'',
  }));
  const mo={};
  Object.entries(moItems||{}).forEach(([k,v])=>{const nk=map[+k];if(nk!==undefined)mo[nk]=v;});
  return{tareas,moItems:mo};
}

  ...(t.solapa?{solapa:true}:{}),
