            {rows.map((r,i)=>(
              <tr key={i} style={{background:i%2===0?C.card:C.surface}}>
                <TD col={C.t3} style={{fontSize:"10px",whiteSpace:"nowrap"}}>{r.cat}</TD>
                <TD fw={600}>{r.item}</TD>
                <TD align="center" col={C.t3}>{r.und}</TD>
                <TD align="right" mono col={C.green} fw={700}>{r.of.toFixed(2)}</TD>
                <TD align="right" mono col="#0369a1" fw={700}>{r.ay.toFixed(2)}</TD>
                <td style={{padding:"4px 6px",textAlign:"center",borderBottom:`1px solid ${C.border2}`}}>
                  <button onClick={()=>onApply(r.of,r.ay)}
                    style={{background:C.accent,color:"white",border:"none",borderRadius:"5px",
                      padding:"4px 10px",fontWeight:800,fontSize:"11px",cursor:"pointer"}}>
                    Aplicar
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

/* ══════════ VISTA PLAN DE OBRA ══════════ */
function PlanObra({tc,setTareas,rec,setRec,cfg,setCfg,rubros,grupos,cuadGrupos,setCuadGrupos,cuadRubros,setCuadRubros,conflictos,erroresMap,proyecto,moItems,setMoItems,prof,nota=''}){
  const exportPDF=()=>{
    const fD=d=>d instanceof Date?d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
    const tFin=tc.reduce((mx,t)=>t.fFin&&(!mx||t.fFin>mx)?t.fFin:mx,null);
    makePDF({
      titulo:'Plan de Obra',subtitulo:'Ítems · Duración · Fechas',proyecto,orientation:'landscape',
      kpis:[
        {label:'Ítems',value:tc.length},
        {label:'F. Inicio',value:fD(tc[0]?.fIni)},
        {label:'F. Fin',value:fD(tFin)},
      ],
      cols:['#','Ítem','Rubro','Unidad','Cantidad','F.Inicio','F.Fin','Dur.'],
      rows:tc.map(t=>{const rub=rubros.find(r=>r.id===t.rubroId);return[
        String(t.id),t.item,rub?.nombre||'—',t.und||'—',
        t.qty%1===0?String(t.qty):t.qty.toFixed(1),
        fD(t.fIni),fD(t.fFin),(t.dFin||'?')+'d'];
      }),
      colStyles:{
        0:{halign:'center',cellWidth:18},
        1:{halign:'left'},
        2:{halign:'center'},
        3:{halign:'center',cellWidth:34},
        4:{halign:'center',cellWidth:38},
        5:{halign:'center',cellWidth:48},
        6:{halign:'center',cellWidth:48},
        7:{halign:'center',cellWidth:28},
      },
      tableOptions:{
        didParseCell:(data)=>{
          const{section,column,cell}=data;
          if(section==='head'){
            if(column.index===0)cell.styles.fillColor=[215,225,240];
            if(column.index===5)cell.styles.fillColor=[198,232,210];
            if(column.index===6)cell.styles.fillColor=[255,218,175];
            if(column.index===7)cell.styles.fillColor=[220,215,242];
          }
          if(section==='body'){
            if(column.index===1)cell.styles.fontStyle='bold';
            if(column.index===5){cell.styles.textColor=[22,101,52];cell.styles.fontStyle='bold';}
            if(column.index===6){cell.styles.textColor=[180,80,0];cell.styles.fontStyle='bold';}
            if(column.index===7){cell.styles.textColor=[76,29,149];cell.styles.fontStyle='bold';}
          }
        },
        willDrawCell:(data)=>{
          if([5,7].includes(data.column.index)){
            data.doc.setDrawColor(110,135,170);data.doc.setLineWidth(0.6);
            data.doc.line(data.cell.x,data.cell.y,data.cell.x,data.cell.y+data.cell.height);
          }
        },
      },
      prof,nota,
    });
  };
  const [showAdd,setShowAdd]=useState(false);
  const [showCuad,setShowCuad]=useState(false);
  const [sortByRubro,setSortByRubro]=useState(false);
  const [nv,setNv]=useState({rubroId:rubros[0]?.id||"",item:"",und:"m²",qty:1,hsOf:1,hsAy:.7,nOf:1,nAy:1,pred:"",obs:""});
  const [editTask,setEditTask]=useState(null);
  const [et,setEt]=useState({});
  const [rendPick,setRendPick]=useState(null);
  // Vista ordenada por rubro (sólo para display, no modifica el array almacenado)
  // Orden visual que replica exactamente la jerarquía: grupos → rubros dentro de cada grupo → ítems del rubro
  const displayTc=sortByRubro
    ?grupos.flatMap(g=>rubros.filter(r=>r.grupo===g.id).flatMap(r=>tc.filter(t=>t.rubroId===r.id)))
    :tc;

  const tHOf=tc.reduce((s,t)=>s+t.hOf,0);
  const tHAy=tc.reduce((s,t)=>s+t.hAy,0);
  const fFin=tc.reduce((mx,t)=>!mx||t.fFin>mx?t.fFin:mx,null);
  const errGlobal=conflictos.filter(e=>!e.taskId);

  const addItem=()=>{
    if(!nv.item.trim())return;
    // Insertar después del último ítem del mismo rubro
    let insertIdx=tc.length;
    for(let i=tc.length-1;i>=0;i--){if(tc[i].rubroId===nv.rubroId){insertIdx=i+1;break;}}
    const newTask={...nv,id:0,qty:+nv.qty,hsOf:+nv.hsOf,hsAy:+nv.hsAy,nOf:+nv.nOf,nAy:+nv.nAy};
    const raw=[...tc.slice(0,insertIdx).map(toRaw),newTask,...tc.slice(insertIdx).map(toRaw)];
    const{tareas:rt,moItems:rmo}=renumberTareas(raw,moItems);
    setTareas(rt);setMoItems(rmo);
    setNv(prev=>({...prev,item:"",pred:"",obs:""}));
    setShowAdd(false);
  };
  const openEdit=t=>{setEditTask(t.id);setEt({...t});};
  const saveEdit=()=>{
    const oldItem=tc.find(t=>t.id===editTask)?.item;
    const newItem=et.item?.trim();
    setTareas(p=>p.map(t=>t.id===editTask?{...toRaw(et),id:t.id,item:newItem||t.item,qty:+et.qty,hsOf:+et.hsOf,hsAy:+et.hsAy,nOf:+et.nOf,nAy:+et.nAy}:t));
    if(oldItem&&newItem&&oldItem!==newItem)
      setRec(p=>p.map(r=>r.item===oldItem?{...r,item:newItem}:r));
    setEditTask(null);
  };
  const saveQty=(id,qty)=>setTareas(p=>p.map(t=>t.id===id?{...t,qty}:t));
  const savePred=(id,pred)=>setTareas(p=>p.map(t=>t.id===id?{...t,pred}:t));
  const saveDias=(id,dias)=>setTareas(p=>p.map(t=>t.id===id?{...t,dias:Math.max(1,+dias||1)}:t));
  const saveSolapa=(id,v)=>setTareas(p=>p.map(t=>t.id===id?{...t,solapa:v}:t));
  const saveFIni=(id,fIniManual)=>{
    // Advertir si la fecha manual se superpone con otros ítems
    const self=tc.find(x=>x.id===id);
    if(self){
      const newIni=pF(fIniManual);
      const newFin=aD(new Date(newIni),self.dFin-1);
      const solapados=tc.filter(x=>x.id!==id&&x.fIni&&x.fFin&&newIni<=x.fFin&&x.fIni<=newFin);
      if(solapados.length){
        const lista=solapados.map(x=>`  #${x.id} ${x.item} (${fF(x.fIni)} → ${fF(x.fFin)})`).join('\n');
        alert(`⚠ La fecha fijada se superpone con:\n${lista}\n\nSe guardó de todos modos. Revisá las predecesoras.`);
      }
    }
    setTareas(p=>p.map(t=>t.id===id?{...t,fIniManual}:t));
  };
  const clearFIni=(id)=>setTareas(p=>p.map(t=>t.id===id?{...t,fIniManual:undefined}:t));
  const delItem=id=>{
    const t=tc.find(x=>x.id===id);
    if(!t)return;
    if(!window.confirm(`¿Eliminar "${t.item}"?\nTambién se eliminarán sus recursos asociados.`))return;
    setRec(p=>p.filter(r=>r.item!==t.item));
    const raw=tc.filter(x=>x.id!==id).map(toRaw);
    const{tareas:rt,moItems:rmo}=renumberTareas(raw,moItems);
    setTareas(rt);setMoItems(rmo);
  };
  const mover=(id,dir)=>{
    const i=tc.findIndex(t=>t.id===id);
    if((dir<0&&i===0)||(dir>0&&i===tc.length-1))return;
    const n=[...tc];[n[i],n[i+dir]]=[n[i+dir],n[i]];
    const{tareas:rt,moItems:rmo}=renumberTareas(n.map(toRaw),moItems);
    setTareas(rt);setMoItems(rmo);
  };

  return(
    <div>
      {/* Errores globales */}
      {errGlobal.length>0&&(
        <div style={{background:`${C.red}11`,border:`1px solid ${C.red}44`,borderRadius:"8px",padding:"10px 14px",marginBottom:"12px"}}>
          <div style={{fontWeight:700,color:C.red,fontSize:"12px",marginBottom:"4px"}}>⚠ Errores en la red de predecesoras</div>
          {errGlobal.map((e,i)=><div key={i} style={{fontSize:"11px",color:C.red}}>{e.msg}</div>)}
        </div>
      )}

      {/* Barra config */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"9px",padding:"9px 13px",
        marginBottom:"11px",display:"flex",flexWrap:"wrap",gap:"13px",alignItems:"center"}}>
        {(()=>{
          const inpSt={border:`1px solid ${C.accent}55`,borderRadius:"5px",padding:"4px 8px",
            background:`${C.accent}11`,color:C.accent,fontWeight:700,fontSize:"12px",textAlign:"center"};
          const handleDateKD=e=>{
            const cur=cfg.fechaInicio||'';
            if(e.key==='Backspace'){
              e.preventDefault();
              let s=cur;if(s.endsWith('/'))s=s.slice(0,-1);
              setCfg(c=>({...c,fechaInicio:s.slice(0,-1)}));return;
            }
            if(!/^\d$/.test(e.key))return;
            e.preventDefault();
            const digs=(cur.replace(/\//g,'')+e.key).slice(0,8);
            let r=digs;
            if(digs.length>2)r=digs.slice(0,2)+'/'+digs.slice(2);
            if(digs.length>4)r=digs.slice(0,2)+'/'+digs.slice(2,4)+'/'+digs.slice(4);
            setCfg(c=>({...c,fechaInicio:r}));
          };
          return(<>
            <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
              <span style={{fontSize:"10px",fontWeight:700,color:C.t3}}>INICIO</span>
              <input value={cfg.fechaInicio||''} onChange={()=>{}} onKeyDown={handleDateKD}
                placeholder="DD/MM/AAAA" maxLength={10} style={{...inpSt,width:"100px"}}/>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
              <span style={{fontSize:"10px",fontWeight:700,color:C.t3}}>HS/DÍA</span>
              <input value={cfg.hsDia} onChange={e=>setCfg(c=>({...c,hsDia:Math.max(1,+e.target.value||8)}))}
                type="number" style={{...inpSt,width:"50px"}}/>
            </div>
            <label style={{display:"flex",alignItems:"center",gap:"5px",cursor:"pointer"}}>
              <input type="checkbox" checked={!!cfg.sabado}
                onChange={e=>setCfg(c=>({...c,sabado:e.target.checked}))}
                style={{accentColor:C.accent,width:"14px",height:"14px",cursor:"pointer"}}/>
              <span style={{fontSize:"10px",fontWeight:700,color:cfg.sabado?C.accent:C.t3}}>SAB ½ día</span>
            </label>
          </>);
        })()}
        <div style={{display:"flex",gap:"10px",fontSize:"11px",color:C.t2,marginLeft:"auto",flexWrap:"wrap",alignItems:"center"}}>
          {errGlobal.length===0&&conflictos.length===0&&<span style={{color:C.green,fontSize:"10px"}}>✓ Sin conflictos</span>}
          {(errGlobal.length>0||conflictos.filter(e=>e.taskId).length>0)&&<span style={{color:C.red,fontSize:"10px"}}>⚠ {conflictos.length} error{conflictos.length!==1?"es":""}</span>}
          <span>Fin: <b style={{color:C.accent,fontFamily:"monospace"}}>{fF(fFin)}</b></span>
          <span>Hs·Of: <b style={{color:C.green,fontFamily:"monospace"}}>{fN(tHOf,1)}</b></span>
          <span>Hs·Ay: <b style={{color:"#0369a1",fontFamily:"monospace"}}>{fN(tHAy,1)}</b></span>
        </div>
        <Btn onClick={()=>setShowCuad(v=>!v)} accent={showCuad?C.accent:C.t3} sm>👷 Cuadrillas</Btn>
        <Btn onClick={()=>setSortByRubro(v=>!v)} accent={sortByRubro?C.blue:C.t3} sm>📋 Por rubro</Btn>
        <Btn onClick={()=>setShowAdd(v=>!v)} accent={C.green} sm>+ Ítem</Btn>
        <Btn onClick={exportPDF} accent={C.orange} sm>📄 PDF</Btn>
      </div>

      {/* Panel cuadrillas */}
      {showCuad&&<CuadrillasPanel tareas={tc} rubros={rubros} grupos={grupos} cuadGrupos={cuadGrupos} setCuadGrupos={setCuadGrupos} cuadRubros={cuadRubros} setCuadRubros={setCuadRubros}/>}

      {/* Formulario nuevo ítem */}
      {showAdd&&(
        <div style={{background:C.card,border:`1px solid ${C.green}44`,borderRadius:"9px",
          padding:"12px",marginBottom:"11px",display:"flex",flexWrap:"wrap",gap:"9px",alignItems:"flex-end"}}>
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>RUBRO</div>
            <select value={nv.rubroId} onChange={e=>setNv(d=>({...d,rubroId:e.target.value}))}
              style={{border:`1px solid ${C.border}`,borderRadius:"4px",padding:"5px 7px",
                background:C.surface,color:C.t1,fontSize:"12px",minWidth:"170px"}}>
              {grupos.map(g=>(
                <optgroup key={g.id} label={g.nombre}>
                  {rubros.filter(r=>r.grupo===g.id).map(r=><option key={r.id} value={r.id}>{r.nombre}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
          <div>
            <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>NOMBRE</div>
            <Inp value={nv.item} onChange={v=>setNv(d=>({...d,item:v}))} w="175px" ph="Ej: Vigas de encadenado"/>
          </div>
          {[["UND",nv.und,v=>setNv(d=>({...d,und:v})),"text","52px",""],
            ["CANT.",nv.qty,v=>setNv(d=>({...d,qty:v})),"number","62px",""],
            ["HS/OF",nv.hsOf,v=>setNv(d=>({...d,hsOf:v})),"number","58px",""],
            ["HS/AY",nv.hsAy,v=>setNv(d=>({...d,hsAy:v})),"number","58px",""],
            ["N°OF",nv.nOf,v=>setNv(d=>({...d,nOf:v})),"number","44px",""],
            ["N°AY",nv.nAy,v=>setNv(d=>({...d,nAy:v})),"number","44px",""],
            ["PRED.",nv.pred,v=>setNv(d=>({...d,pred:v})),"text","60px","3,5"]].map(([l,val,set,t,w,ph])=>(
            <div key={l}>
              <div style={{fontSize:"9px",fontWeight:700,color:C.t3,marginBottom:"2px"}}>{l}</div>
              <Inp value={val} onChange={set} type={t} w={w} ph={ph} right={t==="number"}/>
            </div>
          ))}
          <Btn onClick={addItem} accent={C.green} sm>Agregar</Btn>
          <Btn onClick={()=>setShowAdd(false)} accent={C.red} sm>✕</Btn>
        </div>
      )}

      {/* Leyenda */}
      <div style={{display:"flex",gap:"6px",flexWrap:"wrap",fontSize:"9px",color:C.t3,marginBottom:"8px"}}>
        {[["🔵 Azul bold","cantidad principal editable (clic)"],["🩵 Azul fino","predecesora editable (clic)"],["🩵 Cian ✏","abre editor completo del ítem"],["⚠ Rojo","error en predecesora"],["🟣 Violeta","duración calculada"]].map(([a,b])=>(
          <span key={a} style={{background:C.card,border:`1px solid ${C.border}`,padding:"2px 7px",borderRadius:"3px"}}>{a} = {b}</span>
        ))}
      </div>

      {/* Tabla principal */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",overflowX:"auto"}}>
        <table className="trhov" style={{width:"100%",borderCollapse:"collapse",fontSize:"11px",minWidth:"1000px"}}>
          <thead><tr>
            <TH w="26px" align="center">#</TH>
            <TH>RUBRO</TH><TH>ÍTEM</TH><TH align="center">UND</TH>
            <TH align="right" bg="#1d4ed8" w="80px">CANT. ✎</TH>
            <TH align="right" w="58px">HS/OF</TH><TH align="right" w="58px">HS/AY</TH>
            <TH align="right" w="45px">N°OF</TH><TH align="right" w="45px">N°AY</TH>
            <TH align="right" bg="#166534" w="65px">HS·OF</TH>
            <TH align="right" bg="#075985" w="65px">HS·AY</TH>
            <TH align="center" bg="#4c1d95" w="30px" title="Solapar: comenzar al mismo tiempo que el predecesor">∥</TH>
            <TH align="right" bg="#4c1d95" w="65px">DUR.</TH>
            <TH align="center" w="120px">PRED. ✎</TH>
            <TH align="center" w="90px" title="📌 = fecha fijada manualmente">INICIO ✎</TH><TH align="center" w="80px">FIN</TH>
            <TH align="center" w="78px">ACCIONES</TH>
          </tr></thead>
          <tbody>
            {displayTc.map((t,idx)=>{
              const rub=rubros.find(r=>r.id===t.rubroId);
              const errs=erroresMap[t.id]||[];
              const hasErr=errs.length>0;
              const rowBg=idx%2===0?C.card:C.surface;
              return(
                <tr key={t.id} style={{background:hasErr?`${C.red}06`:rowBg}}>
                  {(()=>{const gl=isGL(t);return(<>
                  <TD align="center" mono col={C.t3} style={{fontSize:"9px"}}>{t.id}</TD>
                  <TD>{rub&&<Chip label={rub.nombre} color={rub.color} sm/>}</TD>
                  <TD fw={500}>{t.item}{hasErr&&<span title={errs.map(e=>e.msg).join("\n")} style={{marginLeft:"5px",color:C.red,cursor:"help",fontSize:"10px"}}>⚠</span>}</TD>
                  <TD align="center" col={C.t3}>{t.und}</TD>
                  {/* Cantidad editable inline */}
                  <QtyCell t={t} onSave={qty=>saveQty(t.id,qty)}/>
                  {/* GL: horas no aplican → mostrar "—" */}
                  <TD align="right" mono col={gl?C.t3:C.t2}>{gl?'—':fN(t.hsOf,2)}</TD>
                  <TD align="right" mono col={gl?C.t3:C.t2}>{gl?'—':fN(t.hsAy,2)}</TD>
                  <TD align="right" mono col={gl?C.t3:undefined}>{gl?'—':t.nOf}</TD>
                  <TD align="right" mono col={gl?C.t3:undefined}>{gl?'—':t.nAy}</TD>
                  <TD align="right" mono col={gl?C.t3:C.green} fw={700} bg={gl?undefined:`${C.green}0a`}>{gl?'—':fN(t.hOf,1)}</TD>
                  <TD align="right" mono col={gl?C.t3:"#0369a1"} fw={700} bg={gl?undefined:"#bae6fd"}>{gl?'—':fN(t.hAy,1)}</TD>
                  {/* GL: duración editable directamente; no-GL: calculada */}
                  {/* Checkbox solapar (∥) */}
                  <td style={{padding:"0 4px",textAlign:"center",borderBottom:`1px solid ${C.border2}`,background:t.solapa?"#4c1d9511":undefined}}>
                    <input type="checkbox" checked={!!t.solapa} title="Solapar: comenzar al mismo tiempo que el predecesor (SS)"
                      onChange={e=>saveSolapa(t.id,e.target.checked)}
                      style={{accentColor:"#7c3aed",cursor:"pointer",width:"13px",height:"13px"}}/>
                  </td>
                  {gl?<DurCell t={t} onSave={dias=>saveDias(t.id,dias)}/>
                    :<TD align="right" mono col="white" fw={800} bg="#4c1d95">{t.dFin}d</TD>}
                  </>);})()}
                  {/* Predecesoras editables inline */}
                  <PredCell t={t} todos={tc} erroresMap={erroresMap} onSave={pred=>savePred(t.id,pred)}/>
                  {/* Fecha inicio: manual o auto */}
                  <IniCell t={t} onSave={v=>saveFIni(t.id,v)} onClear={()=>clearFIni(t.id)}/>
                  <TD align="center" mono col={C.accent} fw={700} style={{fontSize:"10px"}}>{fF(t.fFin)}</TD>
                  <td style={{padding:"3px 6px",textAlign:"center",borderBottom:`1px solid ${C.border2}`,whiteSpace:"nowrap"}}>
                    {!sortByRubro&&<button onClick={()=>mover(t.id,-1)} style={{...btnS("#475569"),marginRight:"2px"}}>↑</button>}
                    {!sortByRubro&&<button onClick={()=>mover(t.id,1)} style={{...btnS("#475569"),marginRight:"2px"}}>↓</button>}
                    {!isGL(t)&&<button onClick={()=>setRendPick(t.id)} style={{...btnS(C.violet),marginRight:"2px"}} title="Cargar rendimiento desde base de datos">📊</button>}
                    <button onClick={()=>openEdit(t)} style={{...btnS(C.cyan),marginRight:"2px"}}>✏</button>
                    <button onClick={()=>delItem(t.id)} style={btnS(C.red)}>✕</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
          <tfoot><tr style={{background:C.surface}}>
            <td colSpan={9} style={{padding:"7px 10px",fontWeight:700,color:C.t2,fontSize:"10px"}}>TOTALES</td>
            <td style={{padding:"7px 9px",textAlign:"right",fontFamily:"monospace",fontWeight:700,color:C.green,background:`${C.green}08`}}>{fN(tHOf,1)}</td>
            <td style={{padding:"7px 9px",textAlign:"right",fontFamily:"monospace",fontWeight:700,color:"#0369a1",background:"#bae6fd"}}>{fN(tHAy,1)}</td>
            <td colSpan={5}/>
          </tr></tfoot>
        </table>
      </div>

      {/* Modal rendimientos */}
      {rendPick&&<RendPicker
        taskName={tc.find(t=>t.id===rendPick)?.item||''}
        onClose={()=>setRendPick(null)}
        onApply={(of,ay)=>{setTareas(p=>p.map(t=>t.id===rendPick?{...toRaw(t),hsOf:of,hsAy:ay}:t));setRendPick(null);}}
      />}

      {/* Modal edición completa */}
      {editTask&&(()=>{
        const hOf=+et.qty*+et.hsOf,hAy=+et.qty*+et.hsAy;
        const dOf=Math.max(1,Math.ceil(hOf/(Math.max(1,+et.nOf)*cfg.hsDia)));
        const dAy=Math.max(1,Math.ceil(hAy/(Math.max(1,+et.nAy)*cfg.hsDia)));
        const dFin=Math.max(dOf,dAy);
        return(
          <Modal title={`Editar ítem #${editTask}: ${et.item}`} onClose={()=>setEditTask(null)} onEnter={()=>{if(et.item?.trim())saveEdit();}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"11px"}}>
              <Fld label="NOMBRE DEL ÍTEM"><FInp value={et.item} onChange={v=>setEt(d=>({...d,item:v}))}/></Fld>
              <Fld label="RUBRO">
                <FSel value={et.rubroId} onChange={v=>setEt(d=>({...d,rubroId:v}))}>
                  {grupos.map(g=>(
                    <optgroup key={g.id} label={g.nombre}>
                      {rubros.filter(r=>r.grupo===g.id).map(r=><option key={r.id} value={r.id}>{r.nombre}</option>)}
                    </optgroup>
                  ))}
                </FSel>
              </Fld>
              <Fld label="UNIDAD">
                <FSel value={et.und||"m²"} onChange={v=>setEt(d=>({...d,und:v}))}>
                  {["m²","m³","ml","un","gl","kg"].map(u=><option key={u}>{u}</option>)}
                </FSel>
              </Fld>
              <Fld label="CANTIDAD"><FInp value={et.qty} onChange={v=>setEt(d=>({...d,qty:v}))} type="number" step="0.1"/></Fld>
              <Fld label="HS OFICIAL / UNIDAD"><FInp value={et.hsOf} onChange={v=>setEt(d=>({...d,hsOf:v}))} type="number" step="0.01"/></Fld>
              <Fld label="HS AYUDANTE / UNIDAD"><FInp value={et.hsAy} onChange={v=>setEt(d=>({...d,hsAy:v}))} type="number" step="0.01"/></Fld>
              <Fld label="N° OFICIALES"><FInp value={et.nOf} onChange={v=>setEt(d=>({...d,nOf:v}))} type="number" step="1"/></Fld>
              <Fld label="N° AYUDANTES"><FInp value={et.nAy} onChange={v=>setEt(d=>({...d,nAy:v}))} type="number" step="1"/></Fld>
              <Fld label="PREDECESORAS (IDs separados por coma)">
                <FInp value={et.pred} onChange={v=>setEt(d=>({...d,pred:v}))} ph="Ej: 3,5"/>
              </Fld>
              <Fld label="OBSERVACIONES"><FInp value={et.obs} onChange={v=>setEt(d=>({...d,obs:v}))}/></Fld>
            </div>
            {/* Cálculo preview */}
            <div style={{marginTop:"14px",background:C.surface,borderRadius:"8px",padding:"10px 12px",
              display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"8px"}}>
              {[["Hs·Of tot.",fN(hOf,1),C.blue],["Hs·Ay tot.",fN(hAy,1),C.violet],
                ["Dur. oficial",dOf+"d","#93c5fd"],["DUR. FINAL",dFin+"d",C.accent]].map(([l,v,a])=>(
                <div key={l} style={{textAlign:"center"}}>
                  <div style={{fontSize:"9px",color:C.t3,marginBottom:"2px"}}>{l}</div>
                  <div style={{fontFamily:"monospace",fontWeight:800,color:a,fontSize:"15px"}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:"10px",marginTop:"14px",justifyContent:"flex-end"}}>
              <Btn onClick={()=>setEditTask(null)} accent={C.t3}>Cancelar</Btn>
              <Btn onClick={()=>{if(et.item?.trim())saveEdit();}} accent={C.green}>Guardar cambios</Btn>
            </div>
          </Modal>
        );
      })()}
    </div>
  );
}

/* ══════════ GANTT ══════════ */
// El % de incremento se carga en la pestaña Recursos $; acá sólo se refleja en los montos.
function GanttView({tc,cfg,rubros,conflictos,proyecto,prof,nota='',rec=[],moItems={},matIncr={}}){
  const errIds=new Set(conflictos.filter(e=>e.taskId).map(e=>e.taskId));
  const [showMoney,setShowMoney]=useState(true);
  const fi=pF(cfg.fechaInicio);
  const ff=tc.reduce((mx,t)=>t.fFin&&t.fFin>mx?t.fFin:mx,fi);

  /* Arreglo de todos los días calendario fi → ff */
  const allDays=useMemo(()=>{
    const days=[];
    const d=new Date(pF(cfg.fechaInicio));
    const l=tc.reduce((mx,t)=>t.fFin&&t.fFin>mx?t.fFin:mx,pF(cfg.fechaInicio));
    const end=new Date(l);end.setDate(end.getDate()+1);
    while(d<=end){days.push(new Date(d));d.setDate(d.getDate()+1);}
    return days;
  },[cfg.fechaInicio,tc]);

  const isSatHalf=d=>!!cfg.sabado&&d.getDay()===6;
  const isWk=d=>{const n=d.getDay();return n===0||(n===6&&!cfg.sabado);};
  const WORK_W=38,WKND_W=12; // px por día hábil / fin de semana
  const SAT_W=Math.round(WORK_W*0.55);
  const dayW=d=>d.getDay()===0?WKND_W:isSatHalf(d)?SAT_W:WORK_W;

  /* Posiciones pixel acumuladas */
  const dayPx=useMemo(()=>{
    const a=[];let p=0;
    allDays.forEach(d=>{a.push(p);p+=dayW(d);});
    a.push(p);return a;
  },[allDays,cfg.sabado]);
  const totalW=dayPx[dayPx.length-1]||0;

  const gIdx=d=>Math.max(0,Math.min(allDays.length-1,Math.round((d-fi)/86400000)));
  const gLeft=d=>dayPx[gIdx(d)];
  const gRight=d=>{const i=gIdx(d);return dayPx[i]+(allDays[i]?dayW(allDays[i]):WORK_W);};

  /* Segmentos de días hábiles entre fIni y fFin (excluye fin de semana) */
  const getSegs=(fIni,fFin)=>{
    if(!fIni||!fFin)return[];
    const segs=[];let segStart=null;
    const cur=new Date(fIni);cur.setHours(0,0,0,0);
    const end=new Date(fFin);end.setHours(0,0,0,0);
    while(cur<=end){
      const wk=isWk(cur);
      if(!wk&&segStart===null){segStart=new Date(cur);}
      if(wk&&segStart!==null){
        const prev=new Date(cur);prev.setDate(prev.getDate()-1);
        segs.push({s:new Date(segStart),e:prev});
        segStart=null;
      }
      cur.setDate(cur.getDate()+1);
    }
    if(segStart!==null)segs.push({s:segStart,e:new Date(end)});
    return segs;
  };

  /* Grupos de semanas (nueva semana = lunes) */
  const weeks=useMemo(()=>{
    const ws=[];
    allDays.forEach((d,i)=>{
      if(i===0||d.getDay()===1)ws.push({si:i,px:dayPx[i],days:[i]});
      else ws[ws.length-1].days.push(i);
    });
    return ws;
  },[allDays,dayPx]);

  /* Costos semanales (mat + MO distribuidos por días hábiles trabajados) */
  const weekCosts=useMemo(()=>{
    return weeks.map(wk=>{
      const wkSet=new Set(wk.days);
      let mat=0,mo=0;
      tc.forEach(t=>{
        if(!t.fIni||!t.fFin)return;
        let totalWD=0,wkWD=0;
        allDays.forEach((d,i)=>{
          if(isWk(d))return;
          const inTask=d>=t.fIni&&d<=t.fFin;
          if(inTask){totalWD++;if(wkSet.has(i))wkWD++;}
        });
        if(!totalWD||!wkWD)return;
        const ratio=wkWD/totalWD;
        const cMatFinal=sumRecIncr(rec.filter(r=>r.item===t.item),matIncr[t.id]||0);
        const moV=moItems[t.id];
        const cMO=moV?.valor?(moV.tipo==='total'?+moV.valor:+moV.valor*+t.qty):0;
        mat+=cMatFinal*ratio;mo+=cMO*ratio;
      });
      return{mat,mo,total:mat+mo};
    });
  },[weeks,tc,allDays,rec,moItems,matIncr]);

  /* Gradiente de fins de semana para el fondo del track */
  const wkBg=useMemo(()=>{
    if(!allDays.length)return undefined;
    let inW=false;const s=[];
    allDays.forEach((d,i)=>{
      const w=isWk(d);
      if(isSatHalf(d)&&!inW){
        // Saturday half-day: gray only first half
        s.push(`transparent ${dayPx[i]}px`,`rgba(148,163,184,.18) ${dayPx[i]}px`,
               `rgba(148,163,184,.18) ${dayPx[i]+SAT_W/2}px`,`transparent ${dayPx[i]+SAT_W/2}px`);
      } else if(w&&!inW){s.push(`transparent ${dayPx[i]}px`,`rgba(148,163,184,.15) ${dayPx[i]}px`);inW=true;}
      else if(!w&&inW){s.push(`rgba(148,163,184,.15) ${dayPx[i]}px`,`transparent ${dayPx[i]}px`);inW=false;}
    });
    if(inW)s.push(`rgba(148,163,184,.15) ${totalW}px`);
    else if(s.length)s.push(`transparent ${totalW}px`);
    return s.length>1?`linear-gradient(to right,${s.join(',')})`:undefined;
  },[allDays,dayPx,totalW,cfg.sabado]);

  /* ══ PDF GRÁFICO — paginación horizontal por chunks de 8 semanas ══ */
  const exportGanttPDF=()=>{
    if(!window.jspdf)return void alert('jsPDF no cargó. Verificá tu conexión a internet.');
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'letter'});
    const PW=792,PH=612,MG=38;
    const ORG=[217,119,6],DRK=[34,34,34],GRY=[100,100,100],LGY=[232,236,240],VLG=[248,250,252],WKE=[222,226,235];
    const hxR=h=>{h=(h||'#646464').replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
    const fD=d=>d instanceof Date&&!isNaN(d)?d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';

    const drawHdr=(pn,rangeLabel)=>{
      doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...DRK);
      doc.text('Cronograma',MG,31);
      doc.setFillColor(...ORG);doc.roundedRect(PW-MG-68,16,68,17,2.5,2.5,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,255,255);
      doc.text('ObraGestión  v4',PW-MG-5,27,{align:'right'});
      doc.setFillColor(...ORG);doc.rect(MG,40,PW-MG*2,2.5,'F');
      const dStr=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
      doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...GRY);
      const sub=rangeLabel
        ?`Secuencia y fechas de ejecución  ·  ${proyecto}  ·  ${rangeLabel}  ·  ${dStr}`
        :`Secuencia y fechas de ejecución  ·  ${proyecto}  ·  ${dStr}`;
      doc.text(sub,MG,52);
    };
    const hasProfData=prof&&prof.nombre;
    const hasNota=!!(nota&&nota.trim());
    const NH=hasNota?80:0;
    const FTRH_G=hasProfData?62:37;const BOTTOM_CONTENT=PH-FTRH_G-(hasNota?NH+8:10);
    const drawFtr=(pn,tot)=>{
      const dtStr=new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
      // ── NOTA arriba del pie de página ──
      if(hasNota){
        const nW=PW-2*MG;const nHH=NH-6;
        const ny=PH-FTRH_G-nHH-4;
        doc.setFillColor(248,250,253);doc.setDrawColor(190,205,220);doc.setLineWidth(.5);
        doc.roundedRect(MG,ny,nW,nHH,2.5,2.5,'FD');
        const px=MG+5,tw=nW-10,lh=7;
        let cy=ny+10;
        doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(65,65,65);
        doc.text('NOTA:',px,cy);cy+=lh+1;
        doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(85,85,85);
        doc.splitTextToSize(nota.trim(),tw).slice(0,8).forEach(l=>{doc.text(l,px,cy);cy+=lh;});
      }
      // ── Pie de página ──
      if(hasProfData){
        doc.setDrawColor(...LGY);doc.setLineWidth(.4);doc.line(MG,PH-62,PW-MG,PH-62);
        doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...GRY);
        doc.text(`ObraGestión v4 — ${dtStr}`,MG,PH-51);
        doc.text(`Pág. ${pn} / ${tot}`,PW-MG,PH-51,{align:'right'});
        doc.setFillColor(...ORG);doc.rect(MG,PH-44,PW-MG*2,3.5,'F');
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...ORG);
        doc.text((prof.nombre||'').toUpperCase(),MG,PH-31);
        doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...DRK);
        if(prof.titulo)doc.text((prof.titulo||'').toUpperCase(),MG,PH-21);
        doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...GRY);
        if(prof.matricula)doc.text(prof.matricula,MG,PH-12);
        doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...GRY);
        if(prof.telefono)doc.text(String(prof.telefono),PW-MG,PH-31,{align:'right'});
        if(prof.email)doc.text(String(prof.email),PW-MG,PH-21,{align:'right'});
        if(prof.direccion)doc.text(String(prof.direccion),PW-MG,PH-12,{align:'right'});
      }else{
        doc.setDrawColor(...LGY);doc.setLineWidth(.4);doc.line(MG,PH-37,PW-MG,PH-37);
        doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...GRY);
        doc.text(`ObraGestión v4 — ${dtStr}`,MG,PH-25);
        doc.text(`Pág. ${pn} / ${tot}`,PW-MG,PH-25,{align:'right'});
      }
    };

    /* Layout — LABW ampliado para nombres completos */
    const LABW=210,ROW_H=18,WH=42;
    const TX=MG+LABW,TW=PW-MG-TX;

    const BOTTOM_LIMIT=BOTTOM_CONTENT; // no dibujar sobre el pie de página

    /* Construir semanas */
    const pWks=[];
    allDays.forEach((d,i)=>{
      if(i===0||d.getDay()===1)pWks.push({si:i,days:[i]});
      else pWks[pWks.length-1].days.push(i);
    });

    /* Costos por semana (mat + MO distribuidos por días hábiles) */
    const pWkCosts=pWks.map(wk=>{
      const wkSet=new Set(wk.days);
      let mat=0,mo=0;
      tc.forEach(t=>{
        if(!t.fIni||!t.fFin)return;
        let totalWD=0,wkWD=0;
        allDays.forEach((d,i)=>{
          if(isWk(d))return;
          const inTask=d>=t.fIni&&d<=t.fFin;
          if(inTask){totalWD++;if(wkSet.has(i))wkWD++;}
        });
        if(!totalWD||!wkWD)return;
        const ratio=wkWD/totalWD;
        const cMatFinal=sumRecIncr(rec.filter(r=>r.item===t.item),matIncr[t.id]||0);
        const moV=moItems[t.id];
        const cMO=moV?.valor?(moV.tipo==='total'?+moV.valor:+moV.valor*+t.qty):0;
        mat+=cMatFinal*ratio;mo+=cMO*ratio;
      });
      return{mat,mo,total:mat+mo};
    });

    /* Dividir en chunks de 8 semanas */
    const WEEKS_PER_CHUNK=8;
    const chunks=[];
    for(let i=0;i<pWks.length;i+=WEEKS_PER_CHUNK)chunks.push(pWks.slice(i,i+WEEKS_PER_CHUNK));
    if(!chunks.length)return;

    let pn=0;
    let rowIdx=0; // contador global de filas para alternado consistente

    chunks.forEach((chunk,chunkIdx)=>{
      /* Calcular posiciones x para este chunk */
      const chunkDayIds=chunk.flatMap(w=>w.days);
      const chunkFirst=chunkDayIds[0];
      const chunkLast=chunkDayIds[chunkDayIds.length-1];
      const chunkStartDate=allDays[chunkFirst];
      const chunkEndDate=allDays[chunkLast];

      // Escala DW para que este chunk llene exactamente TW
      const wkDch=chunkDayIds.filter(di=>!isWk(allDays[di])&&!isSatHalf(allDays[di])).length;
      const satDch=chunkDayIds.filter(di=>isSatHalf(allDays[di])).length;
      const weDch=chunkDayIds.filter(di=>isWk(allDays[di])).length;
      const DWch=TW/Math.max(1,wkDch+satDch*0.55+weDch*0.32);
      const WeWch=DWch*0.32;
      const SatWch=DWch*0.55;
      const showDNch=DWch>=4;

      // Mapa dayIdx → x
      const pdxCh={};let pxc=TX;
      chunkDayIds.forEach(di=>{pdxCh[di]=pxc;pxc+=isWk(allDays[di])?WeWch:isSatHalf(allDays[di])?SatWch:DWch;});
      const chunkRightEdge=pxc;

      // Helpers para posición x de una fecha (clamped al chunk)
      const dayToX=(d,right)=>{
        if(!d||!(d instanceof Date)||isNaN(d))return right?chunkRightEdge:TX;
        const i=gIdx(d);
        if(pdxCh[i]!==undefined)return right?pdxCh[i]+(isWk(allDays[i])?WeWch:isSatHalf(allDays[i])?SatWch:DWch):pdxCh[i];
        if(i<chunkFirst)return TX;
        return chunkRightEdge;
      };

      // Dibujar header de timeline para este chunk
      const drawTLch=(sy)=>{
        chunk.forEach((wk,wi)=>{
          const globalWi=chunkIdx*WEEKS_PER_CHUNK+wi;
          const wx=pdxCh[wk.si];
          const li=wk.days[wk.days.length-1];
          const wxE=pdxCh[li]+(isWk(allDays[li])?WeWch:isSatHalf(allDays[li])?SatWch:DWch);
          const ww=wxE-wx;
          doc.setFillColor(...VLG);doc.rect(wx,sy,ww,WH,'F');
          doc.setDrawColor(...LGY);doc.setLineWidth(.25);doc.rect(wx,sy,ww,WH,'S');
          if(ww>14){
            const sd=allDays[wk.si];
            const ed=allDays[li];
            const wkCostData=pWkCosts[globalWi]||{mat:0,mo:0,total:0};
            // Línea 1: número de semana
            doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(...GRY);
            doc.text(`Semana ${globalWi+1}`,wx+ww/2,sy+9,{align:'center'});
            // Línea 2: rango de fechas
            if(ww>40){
              const sdStr=sd.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
              const edStr=ed.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
              doc.setFont('helvetica','normal');doc.setFontSize(5);doc.setTextColor(...GRY);
              doc.text(`${sdStr} - ${edStr}`,wx+ww/2,sy+18,{align:'center'});
            }
            // Línea 3: costos de la semana
            if(showMoney&&ww>55&&wkCostData.total>0){
              doc.setFont('helvetica','normal');doc.setFontSize(4.5);
              doc.setTextColor(60,120,180);
              doc.text('Mat:$'+Math.round(wkCostData.mat).toLocaleString('es-AR'),wx+ww/2,sy+27,{align:'center'});
              if(wkCostData.mo>0){
                doc.setTextColor(124,58,237);
                doc.text('MO:$'+Math.round(wkCostData.mo).toLocaleString('es-AR'),wx+ww/2,sy+33,{align:'center'});
              }
              doc.setFont('helvetica','bold');doc.setTextColor(...ORG);
              doc.text('Tot:$'+Math.round(wkCostData.total).toLocaleString('es-AR'),wx+ww/2,sy+39,{align:'center'});
            }
          }
        });
        doc.setDrawColor(...LGY);doc.setLineWidth(.35);
        doc.line(MG,sy,PW-MG,sy);
        doc.line(MG,sy+WH,PW-MG,sy+WH);
      };

      // Etiqueta de rango de fechas para el subtítulo
      const rangeLabel=`${fD(chunkStartDate)} – ${fD(chunkEndDate)}`;

      // Primera página de este chunk
      pn++;if(pn>1)doc.addPage();
      drawHdr(pn,rangeLabel);
      let sy=62;

      // KPIs sólo en el primer chunk
      if(chunkIdx===0){
        const tFin=tc.reduce((mx,t)=>t.fFin&&t.fFin>mx?t.fFin:mx,null);
        [{label:'Ítems',value:tc.length},{label:'F. Inicio',value:fD(fi)},{label:'F. Fin',value:fD(tFin)}].forEach((k,i,arr)=>{
          const kW=(PW-MG*2)/arr.length,kx=MG+i*kW;
          doc.setFillColor(...VLG);doc.roundedRect(kx+3,sy,kW-6,29,2.5,2.5,'F');
          doc.setDrawColor(...LGY);doc.setLineWidth(.5);doc.roundedRect(kx+3,sy,kW-6,29,2.5,2.5,'S');
          doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(...GRY);doc.text(String(k.label),kx+kW/2,sy+10,{align:'center'});
          doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(...DRK);doc.text(String(k.value),kx+kW/2,sy+22,{align:'center'});
        });
        sy+=37+4;
      }

      drawTLch(sy);sy+=WH;

      // Generar segmentos de barra para una tarea, clipeados al chunk
      const getSegsChunk=(fIni,fFin)=>{
        if(!fIni||!fFin||!(fIni instanceof Date)||!(fFin instanceof Date))return[];
        const segs=[];let segStart=null;
        chunkDayIds.forEach(di=>{
          const d=allDays[di];
          if(d<fIni||d>fFin){if(segStart!==null){segs.push({s:segStart,e:di-1});segStart=null;}return;}
          if(isWk(d)){if(segStart!==null){segs.push({s:segStart,e:di-1});segStart=null;}return;}
          if(segStart===null)segStart=di;
        });
        if(segStart!==null)segs.push({s:segStart,e:chunkLast});
        return segs;
      };

      // Nueva página dentro del mismo chunk (misma timeline)
      const newPageInChunk=()=>{
        pn++;doc.addPage();drawHdr(pn,rangeLabel);sy=62;drawTLch(sy);sy+=WH;
      };

      /* Filas de tareas para este chunk */
      tc.forEach(t=>{
        if(sy+ROW_H>BOTTOM_LIMIT)newPageInChunk();
        const rub=rubros.find(r=>r.id===t.rubroId);
        const hasE=errIds.has(t.id);
        const col=hasE?[220,38,38]:hxR(rub?.color||'#64748b');

        // Alternado de filas
        const rowBg=rowIdx%2===0?VLG:[241,245,249];
        const wkeBg=rowIdx%2===0?WKE:[210,216,228];

        // ① FILLS primero (el orden importa: los strokes vendrán después)
        doc.setFillColor(...rowBg);doc.rect(MG,sy,PW-MG*2,ROW_H,'F');
        chunkDayIds.forEach(di=>{if(isWk(allDays[di])){doc.setFillColor(...wkeBg);doc.rect(pdxCh[di],sy,WeWch,ROW_H,'F');}else if(isSatHalf(allDays[di])){doc.setFillColor(...wkeBg);doc.rect(pdxCh[di],sy,SatWch/2,ROW_H,'F');}});
        doc.setFillColor(...rowBg);doc.rect(MG,sy,LABW,ROW_H,'F');

        // ② TEXTO y BARRAS (sobre los fills)
        const rubNombre=rub?.nombre||'—';
        const fullLbl=(hasE?'! ':'')+`#${t.id} `+rubNombre;
        const lblLines=doc.splitTextToSize(fullLbl,LABW-6);
        const lns=lblLines.slice(0,2);
        const lineH=6;
        const blockH=lns.length*lineH;
        const textY=sy+(ROW_H-blockH)/2+lineH*0.85;
        doc.setFont('helvetica',hasE?'bold':'normal');doc.setFontSize(5.5);
        doc.setTextColor(...(hasE?[220,38,38]:DRK));
        lns.forEach((l,li)=>doc.text(l,MG+LABW/2,textY+li*lineH,{align:'center'}));
        // Barras
        const segs=getSegsChunk(t.fIni,t.fFin);
        segs.forEach((seg)=>{
          const bx=pdxCh[seg.s];
          const ex=pdxCh[seg.e]+(isWk(allDays[seg.e])?WeWch:isSatHalf(allDays[seg.e])?SatWch:DWch);
          const bW=Math.max(2,ex-bx);
          const bH=ROW_H*.52,bY=sy+(ROW_H-bH)/2;
          doc.setFillColor(...col);doc.roundedRect(bx,bY,bW,bH,.9,.9,'F');
        });

        // ③ LÍNEAS DIVISORAS al final — siempre encima de cualquier fill
        // El fill de la PRÓXIMA fila tapará el borde inferior dibujado aquí,
        // pero la PRÓXIMA fila dibujará su propio borde superior al mismo y,
        // garantizando que la línea sea siempre visible.
        const SC=[150,168,190];
        doc.setDrawColor(...SC);doc.setLineWidth(.55);
        doc.line(MG,sy,PW-MG,sy);              // borde superior de esta fila
        doc.line(MG,sy+ROW_H,PW-MG,sy+ROW_H); // borde inferior (= borde sup. de la sig.)
        doc.line(TX,sy,TX,sy+ROW_H);           // separador vertical label | timeline

        sy+=ROW_H;
        rowIdx++;
      });
    });

    const tot=doc.internal.getNumberOfPages();
    for(let i=1;i<=tot;i++){doc.setPage(i);drawFtr(i,tot);}
    doc.save('obraGestion_gantt.pdf');
  };

  if(!tc.length)return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"40px",textAlign:"center",color:C.t3}}>
      Sin ítems para mostrar en el Gantt. Agregá tareas en Plan de Obra.
    </div>
  );

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",overflowX:"auto"}}>
      <div style={{padding:"6px 12px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:"8px",background:C.surface}}>
        <span style={{fontSize:"10px",color:C.t3,flex:1}}>Cronograma — vista semanal · días hábiles destacados</span>
        <Btn onClick={()=>setShowMoney(v=>!v)} accent={showMoney?C.violet:C.t3} sm>
          {showMoney?'💰 Ocultar montos':'📊 Solo barras'}
        </Btn>
        <Btn onClick={exportGanttPDF} accent={C.orange} sm>📄 PDF</Btn>
      </div>
      {conflictos.length>0&&(
        <div style={{padding:"8px 14px",background:`${C.red}0d`,borderBottom:`1px solid ${C.red}33`}}>
          <span style={{fontWeight:700,color:C.red,fontSize:"11px"}}>⚠ Gantt con errores — </span>
          <span style={{color:C.t3,fontSize:"10px"}}>Los ítems con conflicto se muestran en rojo y pueden tener fechas incorrectas</span>
        </div>
      )}
      <div style={{padding:"12px",minWidth:"600px"}}>
        {/* Encabezado: semanas con costos */}
        <div style={{display:"flex",alignItems:"flex-start",marginBottom:"4px",gap:"8px"}}>
          <div style={{width:"162px",minWidth:"162px",flexShrink:0}}/>
          <div style={{position:"relative",width:totalW+"px",height:"58px",flexShrink:0}}>
            {weeks.map((wk,wi)=>{
              const lastI=wk.days[wk.days.length-1];
              const wEnd=dayPx[lastI]+(allDays[lastI]?dayW(allDays[lastI]):WORK_W);
              const ww=wEnd-wk.px;
              const sd=allDays[wk.si];
              const ed=allDays[lastI];
              const wc=weekCosts[wi]||{mat:0,mo:0,total:0};
              return(
                <div key={wi} style={{position:"absolute",left:wk.px+"px",width:ww+"px",
                  height:"58px",top:0,
                  background:C.surface,
                  borderLeft:`1px solid ${C.border}`,borderTop:`1px solid ${C.border}`,
                  overflow:"hidden",display:"flex",flexDirection:"column",
                  alignItems:"center",justifyContent:"space-evenly",
                  padding:"2px 1px",boxSizing:"border-box"}}>
                  {ww>20&&<span style={{fontSize:"7px",fontWeight:800,color:C.t2,textAlign:"center",lineHeight:1,whiteSpace:"nowrap"}}>
                    {ww>45?`Semana ${wi+1}`:`S${wi+1}`}
                  </span>}
                  {ww>55&&sd&&ed&&<span style={{fontSize:"6px",color:C.t3,textAlign:"center",lineHeight:1,whiteSpace:"nowrap"}}>
                    {sd.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})} – {ed.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})}
                  </span>}
                  {showMoney&&ww>70&&wc.total>0&&<div style={{textAlign:"center",lineHeight:1.3,width:"100%"}}>
                    <div style={{fontSize:"5.5px",color:C.t2,whiteSpace:"nowrap",textAlign:"center"}}>Mat: {fM(Math.round(wc.mat))}</div>
                    {wc.mo>0&&<div style={{fontSize:"5.5px",color:C.violet,whiteSpace:"nowrap",textAlign:"center"}}>MO: {fM(Math.round(wc.mo))}</div>}
                    <div style={{fontSize:"6px",fontWeight:700,color:C.accent,whiteSpace:"nowrap",textAlign:"center"}}>Tot: {fM(Math.round(wc.total))}</div>
                  </div>}
                </div>
              );
            })}
          </div>
          <div style={{width:"38px",flexShrink:0}}/>
        </div>

        {/* Filas de tareas */}
        {tc.map(t=>{
          const rub=rubros.find(r=>r.id===t.rubroId);
          const bL=gLeft(t.fIni);
          const bW=Math.max(3,gRight(t.fFin)-bL);
          const hasErr=errIds.has(t.id);
          const col=hasErr?C.red:(rub?.color||C.t3);
          return(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"2px"}}>
              <div style={{width:"162px",minWidth:"162px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",gap:"4px"}}>
                <span style={{fontFamily:"monospace",fontSize:"9px",color:C.t3,minWidth:"16px",textAlign:"center"}}>{t.id}</span>
                <span style={{fontSize:"10px",color:hasErr?C.red:(rub?.color||C.t2),overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,textAlign:"center",fontWeight:600}} title={rub?.nombre||t.item}>
                  {hasErr&&"⚠ "}{rub?.nombre||'—'}
                </span>
              </div>
              <div style={{width:totalW+"px",flexShrink:0,height:"14px",
                backgroundColor:`${C.border}33`,backgroundImage:wkBg,
                borderRadius:"3px",position:"relative"}}>
                {getSegs(t.fIni,t.fFin).map((seg,si)=>{
                  const sl=gLeft(seg.s);
                  const sw=Math.max(2,gRight(seg.e)-sl);
                  return(
                    <div key={si} style={{position:"absolute",left:sl+"px",width:sw+"px",height:"100%",
                      background:col,borderRadius:"3px",opacity:.85,minWidth:"2px"}}
                      title={`${fF(t.fIni)} → ${fF(t.fFin)} (${t.dFin}d)`}/>
                  );
                })}
              </div>
              <div style={{width:"38px",flexShrink:0,fontSize:"9px",color:C.t3,textAlign:"right",fontFamily:"monospace"}}>{t.dFin}d</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════ VISTA INCIDENCIA CON MANO DE OBRA ══════════ */
function Incidencia({tc,rec,rubros,grupos,moItems,setMoItems,proyecto,prof,nota=''}){
  const [nivel,setNivel]=useState("item");
  const [moModal,setMoModal]=useState(false);
  const [moEdit,setMoEdit]=useState({});
  const [sortCol,setSortCol]=useState(null); // null = orden por jerarquía de rubros
  const [sortDir,setSortDir]=useState("desc");
  const toggleSort=col=>{if(sortCol===col)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortCol(col);setSortDir("desc");}};
  const SortArrow=({col})=><span style={{marginLeft:"3px",fontSize:"8px",opacity:sortCol===col?1:.3,fontFamily:"system-ui"}}>{sortCol===col?(sortDir==="asc"?"↑":"↓"):"⇅"}</span>;

  const costoMatTotal=rec.reduce((s,r)=>s+r.qty*r.pu,0);
  const hsTotOf=tc.reduce((s,t)=>s+t.hOf,0);

  const getMO=(t)=>{
    const mo=moItems[t.id];
    if(!mo||!mo.valor)return 0;
    return mo.tipo==="total"?+mo.valor:+mo.valor*+t.qty;
  };
  const costoMOTotal=tc.reduce((s,t)=>s+getMO(t),0);
  const costoTotal=costoMatTotal+costoMOTotal;

  // Enriquecer cada tarea con costos y porcentajes
  const enrich=t=>{
    const rub=rubros.find(r=>r.id===t.rubroId);
    const grp=grupos.find(g=>g.id===rub?.grupo);
    const cMat=rec.filter(r=>r.item===t.item).reduce((s,r)=>s+r.qty*r.pu,0);
    const cMO=getMO(t);
    const cTotal=cMat+cMO;
    const pctMat=costoTotal>0?(cMat/costoTotal*100):0;
    const pctMO=costoTotal>0?(cMO/costoTotal*100):0;
    const pctTotal=costoTotal>0?(cTotal/costoTotal*100):0;
    const pctHs=hsTotOf>0?(t.hOf/hsTotOf*100):0;
    const fuente=moItems[t.id]?.fuente||"real";
    return{...t,rub,grp,cMat,cMO,cTotal,pctMat,pctMO,pctTotal,pctHs,fuente};
  };
  // Base: orden por jerarquía de rubros (grupos → rubros → ítems)
  const baseEnriquecidos=grupos.flatMap(g=>
    rubros.filter(r=>r.grupo===g.id).flatMap(r=>
      tc.filter(t=>t.rubroId===r.id).map(enrich)
    )
  );
  // Ítems huérfanos (sin rubro en la jerarquía) al final
  const inBase=new Set(baseEnriquecidos.map(t=>t.id));
  tc.filter(t=>!inBase.has(t.id)).forEach(t=>baseEnriquecidos.push(enrich(t)));
  // Sort de columna sólo si el usuario lo seleccionó explícitamente
  const enriquecidos=sortCol
    ?[...baseEnriquecidos].sort((a,b)=>{
        const m=sortDir==="asc"?1:-1;
        if(sortCol==="item")return m*a.item.localeCompare(b.item,"es");
        if(sortCol==="rubro")return m*(a.rub?.nombre||"").localeCompare(b.rub?.nombre||"","es");
        return m*((a[sortCol]||0)-(b[sortCol]||0));
      })
    :baseEnriquecidos;

  // Por rubro
  const porRubro=rubros.map(r=>{
    const its=enriquecidos.filter(t=>t.rubroId===r.id);
    const cMat=its.reduce((s,t)=>s+t.cMat,0);
    const cMO=its.reduce((s,t)=>s+t.cMO,0);
    const cTotal=cMat+cMO;
    const pct=costoTotal>0?(cTotal/costoTotal*100):0;
    const grp=grupos.find(g=>g.id===r.grupo);
    return{...r,grp,cMat,cMO,cTotal,pct,items:its};
  }).filter(r=>r.cTotal>0);

  // Por grupo
  const porGrupo=grupos.map(g=>{
    const rubs=porRubro.filter(r=>r.grupo===g.id);
    const cMat=rubs.reduce((s,r)=>s+r.cMat,0);
    const cMO=rubs.reduce((s,r)=>s+r.cMO,0);
    const cTotal=cMat+cMO;
    const pct=costoTotal>0?(cTotal/costoTotal*100):0;
    return{...g,rubs,cMat,cMO,cTotal,pct};
  }).filter(g=>g.cTotal>0);

  // Abrir modal MO
  const openMOModal=()=>{
    const init={};
    tc.forEach(t=>{
      const ex=moItems[t.id];
      init[t.id]=ex?{fuente:"real",...ex}:{tipo:"total",valor:"",fuente:"real"};
    });
    setMoEdit(init);setMoModal(true);
  };
  const saveMO=()=>{setMoItems({...moEdit});setMoModal(false);};

  const MiniBar=({pctMO,pctMat,total=100})=>(
    <div style={{height:"6px",background:C.border,borderRadius:"3px",overflow:"hidden",width:"100px",display:"inline-block"}}>
      <div style={{display:"flex",height:"100%"}}>
        <div style={{width:`${(pctMO/total*100)||0}%`,background:C.violet,minWidth:pctMO>0?"2px":0}}/>
        <div style={{width:`${(pctMat/total*100)||0}%`,background:C.t2,minWidth:pctMat>0?"2px":0}}/>
      </div>
    </div>
  );

  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:"10px",marginBottom:"14px"}}>
        <KPI label="Total obra (mat+MO)" value={fM(costoTotal)} accent={C.red}/>
        <KPI label="Total materiales" value={fM(costoMatTotal)} accent={C.t2}/>
        <KPI label="Total mano de obra" value={fM(costoMOTotal)} accent={C.violet}/>
        {costoTotal>0&&<KPI label="% MO s/total" value={fN(costoMOTotal/costoTotal*100,1)} unit="%" accent={C.violet}/>}
        {costoTotal>0&&<KPI label="% Materiales" value={fN(costoMatTotal/costoTotal*100,1)} unit="%" accent={C.t2}/>}
      </div>

      {/* Leyenda barra */}
      <div style={{display:"flex",gap:"12px",marginBottom:"12px",fontSize:"10px",color:C.t2,alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:"4px"}}><div style={{width:"12px",height:"6px",background:C.violet,borderRadius:"2px"}}/>Mano de obra</div>
        <div style={{display:"flex",alignItems:"center",gap:"4px"}}><div style={{width:"12px",height:"6px",background:C.t2,borderRadius:"2px"}}/>Materiales</div>
        <Btn onClick={openMOModal} accent={C.violet} sm>✎ Cargar costos de MO</Btn>
        <Btn onClick={()=>{
          const filasTotales=[
            '',
            'TOTAL OBRA',
            '',
            costoMatTotal>0?'$'+Math.round(costoMatTotal).toLocaleString('es-AR'):'—',
            costoTotal>0?(costoMatTotal/costoTotal*100).toFixed(2)+'%':'—',
            costoMOTotal>0?'$'+Math.round(costoMOTotal).toLocaleString('es-AR'):'—',
            costoTotal>0?(costoMOTotal/costoTotal*100).toFixed(2)+'%':'—',
            costoTotal>0?'$'+Math.round(costoTotal).toLocaleString('es-AR'):'—',
            costoTotal>0?'100.00%':'—',
          ];
          makePDF({
          titulo:'Análisis de Incidencia',subtitulo:'Distribución de costos por ítem',proyecto,
          kpis:[
            {label:'Total obra (mat+MO)',value:'$'+Math.round(costoTotal).toLocaleString('es-AR')},
            {label:'Materiales',value:'$'+Math.round(costoMatTotal).toLocaleString('es-AR')},
            {label:'Mano de obra',value:'$'+Math.round(costoMOTotal).toLocaleString('es-AR')},
            {label:'% MO s/total',value:costoTotal>0?(costoMOTotal/costoTotal*100).toFixed(1)+'%':'—'},
            {label:'% Mat s/total',value:costoTotal>0?(costoMatTotal/costoTotal*100).toFixed(1)+'%':'—'},
          ],
          orientation:'landscape',
          cols:['#','Ítem','Rubro','Materiales','% Mat/obra','Mano de Obra','% MO/obra','Total','% Tot/obra'],
          rows:[
            ...enriquecidos.map(t=>[
              String(t.id),t.item,t.rub?.nombre||'—',
              t.cMat>0?'$'+Math.round(t.cMat).toLocaleString('es-AR'):'—',
              t.cMat>0?t.pctMat.toFixed(2)+'%':'—',
              t.cMO>0?'$'+Math.round(t.cMO).toLocaleString('es-AR')+((t.fuente==='estimado'||t.fuente==='simulado')?' (est.)':''):'sin dato',
              t.cMO>0?t.pctMO.toFixed(2)+'%':'—',
              t.cTotal>0?'$'+Math.round(t.cTotal).toLocaleString('es-AR'):'—',
              t.cTotal>0?t.pctTotal.toFixed(2)+'%':'—',
            ]),
            filasTotales,
          ],
          colStyles:{0:{halign:'right',cellWidth:18},3:{halign:'right',cellWidth:88},4:{halign:'right',cellWidth:48},
            5:{halign:'right',cellWidth:88},6:{halign:'right',cellWidth:48},7:{halign:'right',cellWidth:88},8:{halign:'right',cellWidth:52}},
          tableOptions:{
            // Jerarquía visual: nombre de ítem en negrita, fila de totales destacada, divisores de grupos
            didParseCell:(data)=>{
              const {section,column,row,cell}=data;
              const isTotal=row.index===enriquecidos.length; // última fila = totales
              // Fila de totales: negrita + fondo naranja suave + texto más grande
              if(isTotal){
                cell.styles.fontStyle='bold';
                cell.styles.fontSize=8;
                cell.styles.fillColor=[255,243,220];
                cell.styles.textColor=[120,50,0];
              }
              // Nombre del ítem (col 1): negrita y ligeramente más grande
              if(section==='body'&&!isTotal&&column.index===1){
                cell.styles.fontStyle='bold';
                cell.styles.fontSize=8;
              }
              // Cabeceras de grupos de columnas
              if(section==='head'){
                if([3,4].includes(column.index))cell.styles.fillColor=[220,232,244];
                if([5,6].includes(column.index))cell.styles.fillColor=[233,225,255];
                if([7,8].includes(column.index))cell.styles.fillColor=[255,225,225];
                if([3,5,7].includes(column.index)){
                  cell.styles.fontStyle='bold';
                }
              }
              // % columnas en body: gris más sutil
              if(section==='body'&&!isTotal&&[4,6].includes(column.index)){
                cell.styles.textColor=[120,120,120];
                cell.styles.fontSize=7;
              }
              // Total y % total: resaltados
              if(section==='body'&&!isTotal&&column.index===7){
                cell.styles.fontStyle='bold';
              }
              if(section==='body'&&!isTotal&&column.index===8){
                cell.styles.fontStyle='bold';
                cell.styles.textColor=[180,50,0];
              }
            },
            willDrawCell:(data)=>{
              // Divisor vertical grueso entre grupos de columnas
              if([3,5,7].includes(data.column.index)){
                const doc2=data.doc;
                doc2.setDrawColor(100,120,150);doc2.setLineWidth(0.8);
                doc2.line(data.cell.x,data.cell.y,data.cell.x,data.cell.y+data.cell.height);
              }
            },
          },
          prof,nota,
        })}} accent={C.orange} sm>📄 PDF</Btn>
        <span style={{fontSize:"9px",color:C.t3,background:C.card,border:`1px solid ${C.border}`,padding:"2px 7px",borderRadius:"3px"}}
          title="Los porcentajes %MO, %Mat y %Total expresan la incidencia de cada ítem sobre el costo TOTAL de la obra, no sobre el costo del ítem individual.">
          ℹ % = incidencia s/total obra
        </span>
        <div style={{marginLeft:"auto",display:"flex",gap:"6px"}}>
          {[["item","Por ítem"],["rubro","Por rubro"],["grupo","Por grupo"]].map(([k,l])=>(
            <Btn key={k} onClick={()=>setNivel(k)} accent={nivel===k?C.accent:C.t3} sm>{l}</Btn>
          ))}
        </div>
      </div>

      {/* Vista por ÍTEM */}
      {nivel==="item"&&(
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",overflow:"auto",maxHeight:"calc(100vh - 260px)"}}>
          <table className="sth trhov" style={{width:"100%",borderCollapse:"collapse",fontSize:"11px"}}>
            <thead><tr>
              <TH w="28px">#</TH>
              <TH onClick={()=>toggleSort("item")}>Ítem<SortArrow col="item"/></TH>
              <TH onClick={()=>toggleSort("rubro")}>Rubro<SortArrow col="rubro"/></TH>
              <TH align="right" bg="#e2e8f0" w="90px" style={{color:"#1e293b"}} onClick={()=>toggleSort("cMat")}>Materiales<SortArrow col="cMat"/></TH>
              <TH align="right" w="65px" style={{fontSize:"9px"}} onClick={()=>toggleSort("pctMat")}>%Mat/obra<SortArrow col="pctMat"/></TH>
              <TH align="right" bg="#4c1d95" w="90px" onClick={()=>toggleSort("cMO")}>Mano de Obra<SortArrow col="cMO"/></TH>
              <TH align="right" w="65px" style={{fontSize:"9px"}} onClick={()=>toggleSort("pctMO")}>%MO/obra<SortArrow col="pctMO"/></TH>
              <TH align="right" bg="#7f1d1d" w="90px" onClick={()=>toggleSort("cTotal")}>Total<SortArrow col="cTotal"/></TH>
              <TH align="right" w="65px" style={{fontSize:"9px"}} onClick={()=>toggleSort("pctTotal")}>%Total/obra<SortArrow col="pctTotal"/></TH>
              <TH w="100px">Distribución</TH>
            </tr></thead>
            <tbody>
              {enriquecidos.map((t,i)=>(
                <tr key={t.id} style={{background:i%2===0?C.card:C.surface}}>
                  <TD mono col={C.t3} style={{fontSize:"9px"}}>{t.id}</TD>
                  <TD fw={500}>{t.item}</TD>
                  <TD>{t.rub&&<Chip label={t.rub.nombre} color={t.rub.color} sm/>}</TD>
                  <TD align="right" mono col={C.t2} fw={700}>{t.cMat>0?fM(t.cMat):"—"}</TD>
                  <TD align="right" mono col={C.t2}>{t.cMat>0?fN(t.pctMat,2)+"%":"—"}</TD>
                  <TD align="right" mono col={C.violet} fw={700}>
                    {t.cMO>0
                      ?<span style={{display:"inline-flex",alignItems:"center",gap:"4px"}}>
                          {fM(t.cMO)}
                          {(t.fuente==="estimado"||t.fuente==="simulado")&&<span style={{fontSize:"8px",background:`${C.orange}18`,color:C.orange,border:`1px solid ${C.orange}44`,borderRadius:"3px",padding:"0 3px",fontWeight:700,fontFamily:"system-ui"}}>EST</span>}
                        </span>
                      :<span style={{color:C.t3,fontSize:"9px"}}>sin dato</span>}
                  </TD>
                  <TD align="right" mono col={C.violet}>{t.cMO>0?fN(t.pctMO,2)+"%":"—"}</TD>
                  <TD align="right" mono col={C.accent} fw={700}>{t.cTotal>0?fM(t.cTotal):"—"}</TD>
                  <TD align="right" mono fw={700} col={C.red}>{t.cTotal>0?fN(t.pctTotal,2)+"%":"—"}</TD>
                  <td style={{padding:"6px 9px",borderBottom:`1px solid ${C.border2}`}}>
                    <div style={{height:"6px",background:C.border,borderRadius:"3px",overflow:"hidden",width:"90px"}}>
                      <div style={{width:`${t.pctTotal}%`,background:t.rub?.color||C.t3,height:"100%"}}/>
                    </div>
                  </td>
                </tr>
              ))}

              <Btn onClick={()=>setMoEdit(p=>{const n={};Object.entries(p).forEach(([k,v])=>{n[k]={...v,tipo:"unidad"};});return n;})} accent={C.violet} sm>Por unidad</Btn>
