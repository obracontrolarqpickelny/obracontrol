{"tipo":"grupo","nombre":"Obra Gruesa"}
{"tipo":"rubro","nombre":"Mampostería","grupo":"Obra Gruesa"}
{"tipo":"tarea","rubro":"Mampostería","item":"Mamp. ladrillo hueco 18","und":"m²","qty":320,"hsOf":0.9,"hsAy":0.65,"nOf":2,"nAy":2,"pred":"Losa de hormigón","obs":""}
{"tipo":"editar_tarea","item":"Revoque grueso","campos":{"qty":540,"nOf":3}}
{"tipo":"borrar_tarea","item":"Pintura exterior"}
{"tipo":"config","fechaInicio":"01/03/2026","hsDia":8,"sabado":false}

Unidades válidas típicas: m², m³, ml, un, gl, kg, hs, glb.
fechaInicio siempre en formato DD/MM/AAAA.`;

function AsistenteChat({tareas,setTareas,rubros,setRubros,grupos,setGrupos,cfg,setCfg,moItems,setMoItems,proyecto}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [rec,setRec]=useState(false);
  const [key,setKey]=useState(getAIKey());
  const [showKey,setShowKey]=useState(!getAIKey());
  const [err,setErr]=useState('');
  const [undo,setUndo]=useState(null);
  const scRef=useRef();
  const recRef=useRef(null);
  const baseRef=useRef('');

  useEffect(()=>{if(scRef.current)scRef.current.scrollTop=scRef.current.scrollHeight;},[msgs,busy]);

  /* ── Dictado por voz (Web Speech API) ── */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const toggleVoz=()=>{
    if(!SR){setErr('Este navegador no soporta dictado por voz. Usá Chrome o Edge.');return;}
    if(rec){try{recRef.current&&recRef.current.stop();}catch{} setRec(false);return;}
    const r=new SR();
    r.lang='es-AR';r.continuous=true;r.interimResults=true;
    baseRef.current=input?input+' ':'';
    r.onresult=e=>{
      let fin='',int='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const tx=e.results[i][0].transcript;
        if(e.results[i].isFinal)fin+=tx+' ';else int+=tx;
      }
      if(fin)baseRef.current+=fin;
      setInput(baseRef.current+int);
    };
    r.onerror=e=>{setErr('Dictado: '+e.error);setRec(false);};
    r.onend=()=>setRec(false);
    recRef.current=r;
    try{r.start();setRec(true);setErr('');}catch(e){setErr('No se pudo iniciar el dictado.');}
  };

  /* ── Contexto actual de la obra para la IA ── */
  const buildContext=()=>{
    const rubrosTxt=rubros.map(r=>{
      const g=grupos.find(x=>x.id===r.grupo);
      return `- ${r.nombre} (grupo: ${g?g.nombre:'—'})`;
    }).join('\n')||'(ninguno)';
    const tareasTxt=tareas.length?tareas.map(t=>{
      const r=rubros.find(x=>x.id===t.rubroId);
      const pn=String(t.pred||'').split(',').filter(Boolean)
        .map(n=>{const p=tareas.find(x=>String(x.id)===n.trim());return p?p.item:n.trim();}).join(', ');
      return `#${t.id} [${r?r.nombre:'?'}] ${t.item} — ${t.qty} ${t.und} | hsOf ${t.hsOf} hsAy ${t.hsAy} | ${t.nOf} of + ${t.nAy} ay${pn?` | tras: ${pn}`:''}${t.obs?` | obs: ${t.obs}`:''}`;
    }).join('\n'):'(el plan está vacío)';
    const rend=REND_DB.map(r=>`${r.cat}|${r.item}|${r.und}|of ${r.of}|ay ${r.ay}`).join('\n');
    return `OBRA: ${proyecto||'(sin nombre)'}
CONFIG: inicio ${cfg.fechaInicio||'(sin definir)'} | ${cfg.hsDia} hs/día | sábados ${cfg.sabado?'sí':'no'}

GRUPOS EXISTENTES:
${grupos.map(g=>'- '+g.nombre).join('\n')||'(ninguno)'}

RUBROS EXISTENTES:
${rubrosTxt}

ÍTEMS YA CARGADOS EN EL PLAN:
${tareasTxt}

BASE DE RENDIMIENTOS DE REFERENCIA (cat|ítem|und|hs oficial|hs ayudante):
${rend}`;
  };

  /* ── Aplicar acciones al estado ── */
  const aplicar=acciones=>{
    if(!acciones||!acciones.length)return[];
    const snap={tareas:JSON.parse(JSON.stringify(tareas)),rubros:JSON.parse(JSON.stringify(rubros)),
      grupos:JSON.parse(JSON.stringify(grupos)),cfg:{...cfg},moItems:JSON.parse(JSON.stringify(moItems||{}))};
    let G=[...grupos],R=[...rubros],T=tareas.map(toRaw),CF={...cfg};
    const log=[];
    let _tmpId=-1;   // ids provisorios de ítems nuevos; renumberTareas los reemplaza por 1..N
    const norm=s=>String(s||'').trim().toLowerCase();
    const findG=n=>G.find(g=>norm(g.nombre)===norm(n));
    const findR=n=>R.find(r=>norm(r.nombre)===norm(n));
    const findT=n=>T.find(t=>norm(t.item)===norm(n))||T.find(t=>norm(t.item).includes(norm(n)));
    const PAL=['#ef4444','#f97316','#d97706','#16a34a','#0891b2','#2563eb','#7c3aed','#db2777','#64748b','#84cc16'];

    acciones.forEach(a=>{
      const tipo=norm(a.tipo);
      if(tipo==='grupo'){
        if(!a.nombre||findG(a.nombre))return;
        G.push({id:uid(),nombre:String(a.nombre).trim(),color:a.color||PAL[G.length%PAL.length]});
        log.push(`Grupo «${a.nombre}»`);
      }
      else if(tipo==='rubro'){
        if(!a.nombre||findR(a.nombre))return;
        let g=findG(a.grupo);
        if(!g){g={id:uid(),nombre:String(a.grupo||'Otros').trim(),color:PAL[G.length%PAL.length]};G.push(g);}
        R.push({id:uid(),grupo:g.id,nombre:String(a.nombre).trim(),color:a.color||PAL[R.length%PAL.length]});
        log.push(`Rubro «${a.nombre}»`);
      }
      else if(tipo==='tarea'){
        if(!a.item)return;
        let r=findR(a.rubro);
        if(!r){
          let g=G.find(x=>norm(x.nombre)==='otros')||G[G.length-1];
          if(!g){g={id:uid(),nombre:'Otros',color:'#94a3b8'};G.push(g);}
          r={id:uid(),grupo:g.id,nombre:String(a.rubro||'Varios').trim(),color:PAL[R.length%PAL.length]};
          R.push(r);log.push(`Rubro «${r.nombre}»`);
        }
        const nt={id:_tmpId--,rubroId:r.id,item:String(a.item).trim(),und:a.und||'un',
          qty:+a.qty||1,hsOf:+a.hsOf||0,hsAy:+a.hsAy||0,
          nOf:Math.max(1,+a.nOf||1),nAy:Math.max(0,a.nAy==null?1:+a.nAy),
          _predNames:a.pred||'',pred:'',obs:a.obs||''};
        // Insertar después del último ítem del mismo rubro (mantiene el orden por rubro)
        let idx=T.length;
        for(let i=T.length-1;i>=0;i--){if(T[i].rubroId===r.id){idx=i+1;break;}}
        T.splice(idx,0,nt);
        log.push(`${nt.item} — ${nt.qty} ${nt.und} (${nt.nOf} of + ${nt.nAy} ay)`);
      }
      else if(tipo==='editar_tarea'){
        const t=findT(a.item);
        if(!t)return;
        const c=a.campos||{};
        ['qty','hsOf','hsAy','nOf','nAy'].forEach(k=>{if(c[k]!=null)t[k]=+c[k];});
        ['und','obs'].forEach(k=>{if(c[k]!=null)t[k]=c[k];});
        if(c.item)t.item=String(c.item).trim();
        if(c.pred!=null)t._predNames=c.pred;
        if(c.rubro){const r2=findR(c.rubro);if(r2)t.rubroId=r2.id;}
        log.push(`Editado: ${t.item}`);
      }
      else if(tipo==='borrar_tarea'){
        const t=findT(a.item);
        if(!t)return;
        T=T.filter(x=>x!==t);
        log.push(`Eliminado: ${t.item}`);
      }
      else if(tipo==='config'){
        if(a.fechaInicio)CF.fechaInicio=a.fechaInicio;
        if(a.hsDia)CF.hsDia=Math.max(1,+a.hsDia);
        if(a.sabado!=null)CF.sabado=!!a.sabado;
        log.push(`Config: ${a.fechaInicio?'inicio '+a.fechaInicio+' ':''}${a.hsDia?a.hsDia+' hs/día ':''}${a.sabado!=null?'sábados '+(a.sabado?'sí':'no'):''}`.trim());
      }
    });

    // Resolver predecesoras por nombre → ID de tarea (renumberTareas los pasa a 1..N)
    const pos={};T.forEach(t=>{pos[norm(t.item)]=t.id;});
    T.forEach(t=>{
      if(t._predNames){
        t.pred=String(t._predNames).split(',').map(s=>{
          const n=norm(s);
          if(!n)return null;
          if(pos[n]!=null&&pos[n]!==t.id)return String(pos[n]);
          const k=Object.keys(pos).find(x=>(x.includes(n)||n.includes(x))&&pos[x]!==t.id);
          return k?String(pos[k]):null;
        }).filter(Boolean).join(',');
      }
      delete t._predNames;
    });

    const {tareas:rt,moItems:rmo}=renumberTareas(T,moItems);
    setGrupos(G);setRubros(R);setTareas(rt);setMoItems(rmo);setCfg(CF);
    setUndo(snap);
    return log;
  };

  const deshacer=()=>{
    if(!undo)return;
    setTareas(undo.tareas);setRubros(undo.rubros);setGrupos(undo.grupos);
    setCfg(undo.cfg);setMoItems(undo.moItems);
    setUndo(null);
    setMsgs(m=>[...m,{rol:'sys',txt:'↩ Se deshizo la última carga.'}]);
  };

  /* ── Enviar ── */
  const enviar=async()=>{
    const txt=input.trim();
    if(!txt||busy)return;
    const k=getAIKey();
    if(!k){setShowKey(true);setErr('Cargá tu API key de Anthropic para usar el asistente.');return;}
    if(rec){try{recRef.current&&recRef.current.stop();}catch{} setRec(false);}
    setErr('');setInput('');setBusy(true);
    const nuevos=[...msgs,{rol:'user',txt}];
    setMsgs(nuevos);
    try{
      const hist=nuevos.filter(m=>m.rol==='user'||m.rol==='ai')
        .map(m=>({role:m.rol==='user'?'user':'assistant',content:m.rol==='user'?m.txt:JSON.stringify({mensaje:m.txt,acciones:[]})}));
      hist[hist.length-1]={role:'user',content:`ESTADO ACTUAL DE LA OBRA\n${buildContext()}\n\n─────────\nEL USUARIO DICE:\n${txt}`};
      const r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':k,
          'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:AI_MODEL,max_tokens:4000,system:AI_SYSTEM,messages:hist})
      });
      if(!r.ok){
        const e=await r.text();
        throw new Error(r.status===401?'API key inválida o sin crédito.':`Error ${r.status}: ${e.slice(0,180)}`);
      }
      const data=await r.json();
      let raw=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
      raw=raw.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
      const i0=raw.indexOf('{'),i1=raw.lastIndexOf('}');
      if(i0>=0&&i1>i0)raw=raw.slice(i0,i1+1);
      let obj;
      try{obj=JSON.parse(raw);}catch{obj={mensaje:raw,acciones:[]};}
      const log=aplicar(obj.acciones);
      setMsgs(m=>[...m,{rol:'ai',txt:obj.mensaje||'Listo.',log}]);
    }catch(e){
      setMsgs(m=>[...m,{rol:'sys',txt:'⚠ '+e.message}]);
      setErr(e.message);
    }finally{setBusy(false);}
  };

  const S={
    burbUser:{alignSelf:'flex-end',background:C.blue,color:'#fff',borderRadius:'12px 12px 3px 12px',
      padding:'8px 12px',maxWidth:'82%',fontSize:'13px',lineHeight:1.45,whiteSpace:'pre-wrap'},
    burbAI:{alignSelf:'flex-start',background:C.card,border:`1px solid ${C.border}`,color:C.t1,
      borderRadius:'12px 12px 12px 3px',padding:'9px 12px',maxWidth:'88%',fontSize:'13px',lineHeight:1.5,whiteSpace:'pre-wrap'},
    burbSys:{alignSelf:'center',background:'#fef2f2',border:'1px solid #fecaca',color:C.red,
      borderRadius:'8px',padding:'6px 10px',fontSize:'11px',fontWeight:600,maxWidth:'90%'},
  };

  const EJEMPLOS=[
    'La obra arranca el 15/03/2026, jornada de 8 horas, sin sábados.',
    'Vamos a hacer 320 m² de mampostería de ladrillo hueco con 2 oficiales y 2 ayudantes.',
    'Sumá revoque grueso y fino, 500 m² cada uno, va después de la mampostería.',
    'La cuadrilla de pintura son 4 personas, 500 m² interior y 200 exterior.',
  ];

  return(
    <div style={{maxWidth:'900px',margin:'0 auto'}}>

      {/* Cabecera */}
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px',flexWrap:'wrap'}}>
        <div style={{fontSize:'13px',fontWeight:800,color:C.t1}}>🎙 Asistente de carga</div>
        <div style={{fontSize:'11px',color:C.t2,flex:1,minWidth:'200px'}}>
          Contale la obra hablando o escribiendo. Él completa rubros, ítems, cantidades, cuadrillas y predecesoras.
        </div>
        <button onClick={()=>setShowKey(s=>!s)} style={{...btnS(C.t2),fontSize:'10px'}}>
          {getAIKey()?'🔑 API key ✓':'🔑 Configurar API key'}
        </button>
        {undo&&<button onClick={deshacer} style={{...btnS(C.red),fontSize:'10px'}}>↩ Deshacer última carga</button>}
        {msgs.length>0&&<button onClick={()=>{setMsgs([]);setUndo(null);}} style={{...btnS(C.t3),fontSize:'10px'}}>🗑 Limpiar chat</button>}
      </div>

      {/* API key */}
      {showKey&&(
        <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'8px',padding:'11px 13px',marginBottom:'10px'}}>
          <div style={{fontSize:'11px',fontWeight:800,color:'#92400e',marginBottom:'6px'}}>API KEY DE ANTHROPIC</div>
          <div style={{fontSize:'11px',color:'#78350f',marginBottom:'8px',lineHeight:1.5}}>
            Se guarda sólo en este navegador (localStorage), nunca se sube a Drive ni al archivo de la obra.
            Sacala de console.anthropic.com → API Keys.
          </div>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
            <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-api03-..."
              style={{flex:1,minWidth:'220px',padding:'7px 9px',border:`1px solid ${C.border}`,borderRadius:'5px',fontSize:'12px'}}/>
            <button onClick={()=>{setAIKey(key.trim());setShowKey(false);setErr('');}}
              style={{background:C.green,color:'#fff',border:'none',borderRadius:'5px',padding:'7px 16px',
                fontSize:'12px',fontWeight:700,cursor:'pointer'}}>Guardar</button>
          </div>
        </div>
      )}

      {/* Chat */}
      <div ref={scRef} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:'10px',
        padding:'14px',height:'52vh',minHeight:'320px',overflowY:'auto',
        display:'flex',flexDirection:'column',gap:'10px'}}>
        {msgs.length===0&&(
          <div style={{margin:'auto',textAlign:'center',maxWidth:'480px'}}>
            <div style={{fontSize:'32px',marginBottom:'8px'}}>🎙</div>
            <div style={{fontSize:'13px',fontWeight:700,color:C.t1,marginBottom:'4px'}}>Contame la obra</div>
            <div style={{fontSize:'11.5px',color:C.t2,lineHeight:1.6,marginBottom:'14px'}}>
              De a un ítem o de a diez, en el orden que te venga. Si falta un dato lo estima y después lo ajustás.
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
              {EJEMPLOS.map((e,i)=>(
                <button key={i} onClick={()=>setInput(e)}
                  style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'7px',padding:'7px 11px',
                    fontSize:'11.5px',color:C.t2,cursor:'pointer',textAlign:'left',lineHeight:1.4}}>
                  «{e}»
                </button>
              ))}
            </div>
          </div>
        )}
        {msgs.map((m,i)=>(
          <div key={i} style={m.rol==='user'?S.burbUser:m.rol==='sys'?S.burbSys:S.burbAI}>
            {m.txt}
            {m.log&&m.log.length>0&&(
              <div style={{marginTop:'8px',paddingTop:'8px',borderTop:`1px dashed ${C.border}`}}>
                <div style={{fontSize:'9.5px',fontWeight:800,color:C.green,marginBottom:'4px',letterSpacing:'.3px'}}>
                  ✓ CARGADO EN EL PLAN
                </div>
                {m.log.map((l,j)=>(
                  <div key={j} style={{fontSize:'11px',color:C.t2,padding:'1.5px 0'}}>• {l}</div>
                ))}
              </div>
            )}
          </div>
        ))}
        {busy&&<div style={{...S.burbAI,color:C.t3,fontStyle:'italic'}}>Pensando…</div>}
      </div>

      {err&&<div style={{fontSize:'11px',color:C.red,marginTop:'6px',fontWeight:600}}>{err}</div>}

      {/* Entrada */}
      <div style={{display:'flex',gap:'7px',marginTop:'10px',alignItems:'flex-end'}}>
        <button onClick={toggleVoz} title={rec?'Detener dictado':'Dictar por voz'}
          style={{background:rec?C.red:C.card,color:rec?'#fff':C.t2,border:`1.5px solid ${rec?C.red:C.border}`,
            borderRadius:'8px',width:'44px',height:'44px',fontSize:'19px',cursor:'pointer',flexShrink:0,
            animation:rec?'none':'none'}}>
          {rec?'⏹':'🎤'}
        </button>
        <textarea value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}}}
          placeholder={rec?'Escuchando… hablá tranquilo':'Contame un ítem, o varios… (Enter para enviar, Shift+Enter salto de línea)'}
          rows={2}
          style={{flex:1,padding:'10px 12px',border:`1.5px solid ${rec?C.red:C.border}`,borderRadius:'8px',
            fontSize:'13px',fontFamily:'inherit',resize:'vertical',minHeight:'44px',lineHeight:1.45}}/>
        <button onClick={enviar} disabled={busy||!input.trim()}
          style={{background:busy||!input.trim()?C.border:C.blue,color:'#fff',border:'none',borderRadius:'8px',
            padding:'0 18px',height:'44px',fontSize:'13px',fontWeight:800,
            cursor:busy||!input.trim()?'default':'pointer',flexShrink:0}}>
          {busy?'…':'Enviar'}
        </button>
      </div>
      <div style={{fontSize:'10px',color:C.t3,marginTop:'6px'}}>
        {rec?'🔴 Grabando — el texto aparece a medida que hablás. Revisalo y mandá.'
            :'Todo lo que cargue queda en Rubros / Plan de Obra / Gantt. Podés corregir a mano en cualquier momento.'}
      </div>
    </div>
  );
}

/* ══════════ APP ROOT ══════════ */
const TABS=[
  {id:"rubros",    label:"Rubros / Ítems", icon:"🗂"},
  {id:"plan",      label:"Plan de Obra",   icon:"📅"},
  {id:"gantt",     label:"Gantt",          icon:"📊"},
  {id:"recursos",  label:"Recursos $",     icon:"💰"},
  {id:"incidencia",label:"Incidencia",     icon:"📈"},
  {id:"asistente", label:"Asistente IA",  icon:"🎙"},
];

function App(){
  const importRef=useRef();
  const [tab,setTab]=useState("rubros");
  const [tareas,setTareas]=useState(_saved?.tareas||[]);
  const [rec,setRec]=useState(_saved?.rec||[]);
  const [grupos,setGrupos]=useState(_saved?.grupos||DEMO_GRUPOS);
  const [rubros,setRubros]=useState(_saved?.rubros||DEMO_RUBROS);
  const [cfg,setCfg]=useState(_saved?.cfg||{fechaInicio:'',hsDia:8,sabado:false});
  const [proyecto,setProyecto]=useState(_saved?.proyecto||_urlObra||'');
  const [cuadGrupos,setCuadGrupos]=useState(_saved?.cuadGrupos||{});
  const [cuadRubros,setCuadRubros]=useState(_saved?.cuadRubros||{});
  const [moItems,setMoItems]=useState(_saved?.moItems||{});
  const [matIncr,setMatIncr]=useState(_saved?.matIncr||{});
  const [imprevistos,setImprevistos]=useState(_saved?.imprevistos||0);
  const [notaPDF,setNotaPDF]=useState(_saved?.notaPDF||NOTA_PDF_DEFAULT);
  const PROF_DEFAULT={nombre:'Federico Pickelny',titulo:'Arquitecto',matricula:'MP 2304',telefono:'264 4397772',email:'federicopickelny@gmail.com',direccion:'B. Rivadavia Oeste 114'};
  const [prof,setProf]=useState(_saved?.prof||PROF_DEFAULT);
  const [editProy,setEditProy]=useState(false);
  const [newP,setNewP]=useState(_saved?.proyecto||_urlObra||'');
  const [lastSaved,setLastSaved]=useState(null);
  const [modified,setModified]=useState(false);
  const _initDone=useRef(false);
  const _fileHandle=useRef(null);
  const _guardarFn=useRef(null);
  const _driveTimer=useRef(null);
  const [driveStatus,setDriveStatus]=useState('idle'); // idle | loading | pending | saving | saved | error

  // Auto-save local + Drive auto-sync (debounce 15s)
  useEffect(()=>{
    const data={tareas,rec,grupos,rubros,cfg,proyecto,cuadGrupos,cuadRubros,moItems,matIncr,prof,imprevistos,notaPDF};
    guardarStorage(data);
    setLastSaved(new Date());
    if(DRIVE_URL&&_initDone.current&&proyecto){
      if(_driveTimer.current)clearTimeout(_driveTimer.current);
      setDriveStatus('pending');
      _driveTimer.current=setTimeout(async()=>{
        setDriveStatus('saving');
        const ok=await _driveSave(proyecto,data);
        setDriveStatus(ok?'saved':'error');
        if(ok)setTimeout(()=>setDriveStatus('idle'),4000);
      },15000);
    }
  },[tareas,rec,grupos,rubros,cfg,proyecto,cuadGrupos,cuadRubros,moItems,matIncr,prof,imprevistos,notaPDF]);

  // Título de la pestaña Chrome — se actualiza con el nombre del proyecto
  useEffect(()=>{
    document.title=proyecto?`ObraGestión — ${proyecto}`:'ObraGestión v4';
  },[proyecto]);

  // Carga inicial desde Drive (cuando se llega con ?obra=X desde ObraControl)
  useEffect(()=>{
    if(!DRIVE_URL||!_urlObra)return;
    setDriveStatus('loading');
    _driveLoad(_urlObra).then(d=>{
      if(!d){setDriveStatus('idle');return;}
      if(d.tareas)setTareas(d.tareas);
      if(d.rec)setRec(d.rec);
      if(d.grupos)setGrupos(d.grupos);
      if(d.rubros)setRubros(d.rubros);
      if(d.cfg)setCfg(d.cfg);
      if(d.proyecto){setProyecto(d.proyecto);setNewP(d.proyecto);}
      if(d.cuadGrupos)setCuadGrupos(d.cuadGrupos);
      if(d.cuadRubros)setCuadRubros(d.cuadRubros);
      if(d.moItems)setMoItems(d.moItems);
      if(d.matIncr)setMatIncr(d.matIncr);
      if(d.prof)setProf(d.prof);
      if(d.imprevistos!=null)setImprevistos(d.imprevistos);
      if(d.notaPDF)setNotaPDF(d.notaPDF);
      setDriveStatus('saved');
      setTimeout(()=>setDriveStatus('idle'),3000);
    });
  },[]);

  // Indicador de "modificado" (hay cambios sin guardar en el archivo HTML)
  useEffect(()=>{
    if(!_initDone.current){_initDone.current=true;return;}
    setModified(true);
  },[tareas,rec,grupos,rubros,cfg,proyecto,cuadGrupos,cuadRubros,moItems,matIncr,prof,imprevistos,notaPDF]);

  // Exportar JSON
  const exportarJSON=()=>{
    const data={tareas,rec,grupos,rubros,cfg,proyecto,cuadGrupos,cuadRubros,moItems,matIncr,prof,imprevistos,notaPDF};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`obracalc_${proyecto.replace(/[^a-z0-9]/gi,"_").slice(0,30)}_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // Importar datos desde JSON o desde un HTML guardado con "Guardar HTML"
  const importarJSON=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        let raw=ev.target.result;
        // Si es un HTML, extraer el snapshot embebido
        if(file.name.endsWith('.html')||file.name.endsWith('.htm')){
          const m=raw.match(/\/\* @SNAP \*\/([\s\S]*?)\/\* \/@SNAP \*\//);
          if(!m||m[1]==='null')throw new Error('Este HTML no contiene datos de obra guardados.');
          raw=m[1];
        }
        const d=JSON.parse(raw);
        if(d.tareas)setTareas(d.tareas);
        if(d.rec)setRec(d.rec);
        if(d.grupos)setGrupos(d.grupos);
        if(d.rubros)setRubros(d.rubros);
        if(d.cfg)setCfg(d.cfg);
        if(d.proyecto){setProyecto(d.proyecto);setNewP(d.proyecto);}
        if(d.cuadGrupos)setCuadGrupos(d.cuadGrupos);
        if(d.cuadRubros)setCuadRubros(d.cuadRubros);
        if(d.moItems)setMoItems(d.moItems);
        if(d.matIncr)setMatIncr(d.matIncr);
        if(d.prof)setProf(d.prof);
        setModified(false);
      }catch(err){alert('Archivo inválido:\n'+err.message);}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  // Resetear al demo
  const resetearDemo=()=>{
    if(!window.confirm("¿Resetear al proyecto demo? Se perderán todos los datos actuales."))return;
    setTareas(DEMO_TAREAS);setRec(DEMO_REC);setGrupos(DEMO_GRUPOS);setRubros(DEMO_RUBROS);
    setCfg({fechaInicio:"01/03/2025",hsDia:8});
    const p="Vivienda unifamiliar — San Juan";setProyecto(p);setNewP(p);
    setCuadGrupos({});setCuadRubros({});setMoItems({});setMatIncr({});
  };

  // ── Construir el HTML de la obra (código fuente + datos embebidos) ──────────
  const _buildObraHTML=(snapData)=>{
    const jsonStr=JSON.stringify(snapData).replace(/<\/script/gi,'<\\/script');
    const babelEl=document.querySelector('script[type="text/babel"]');
    const styleEl=document.querySelector('style');
    if(!babelEl)throw new Error('Script Babel no encontrado en el DOM.');
    let sc=babelEl.textContent;
    const snapRx=/\/\* @SNAP \*\/[\s\S]*?\/\* \/@SNAP \*\//;
    if(!snapRx.test(sc))throw new Error('Marcador @SNAP no encontrado en el script.');
    sc=sc.replace(snapRx,`/* @SNAP */${jsonStr}/* /@SNAP */`);
    const css=styleEl?styleEl.textContent:'';
    const SRC=[
      'https://unpkg.com/react@18/umd/react.production.min.js',
      'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
      'https://unpkg.com/@babel/standalone/babel.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
    ];
    const tit=`ObraGestión — ${snapData.proyecto}`.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return [
      '<!DOCTYPE html>','<html lang="es">','<head>',
      '<meta charset="UTF-8"/>','<meta name="viewport" content="width=device-width,initial-scale=1"/>',
      `<title>${tit}<\/title>`,
      SRC.map(u=>`<script src="${u}"><\/script>`).join('\n'),
      `<style>\n${css}\n<\/style>`,
      '<\/head>','<body>','<div id="root"><\/div>',
      `<script type="text/babel">\n${sc}\n<\/script>`,
      '<\/body>','<\/html>',
    ].join('\n');
  };

  // ── Guardar / Guardar como ────────────────────────────────────────────────
  // guardarComo=false → sobrescribe el archivo actual (sin diálogo si ya hay handle)
  // guardarComo=true  → siempre muestra el selector de archivo
  const guardarHTML=async(guardarComo=false)=>{
    try{
      const pid=__SNAP__?._pid||(Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      const snapData={tareas,rec,grupos,rubros,cfg,proyecto,cuadGrupos,cuadRubros,moItems,matIncr,prof,imprevistos,notaPDF,_pid:pid};
      const html=_buildObraHTML(snapData);
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      const nombre=proyecto.replace(/[^a-z0-9áéíóúüñÁÉÍÓÚÜÑ]/gi,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,32)||'obra';

      if(window.showSaveFilePicker){
        // Recuperar handle guardado en IDB si no hay en memoria y no es "Guardar como"
        if(!guardarComo&&!_fileHandle.current){
          const saved=await _fhLoad();
          if(saved){
            try{
              const perm=await saved.queryPermission({mode:'readwrite'});
              if(perm==='granted'){_fileHandle.current=saved;}
              else{const np=await saved.requestPermission({mode:'readwrite'});if(np==='granted')_fileHandle.current=saved;}
            }catch{_fileHandle.current=null;}
          }
        }
        // Mostrar selector solo si es "Guardar como" o no tenemos handle válido
        if(guardarComo||!_fileHandle.current){
          const handle=await window.showSaveFilePicker({
            suggestedName:`ObraGestion_${nombre}.html`,
            types:[{description:'Archivo HTML de obra',accept:{'text/html':['.html']}}],
            startIn:'downloads',
          });
          _fileHandle.current=handle;
          const fname=handle.name.replace(/\.html?$/i,'').replace(/^ObraGestion_/i,'').replace(/_/g,' ').trim();
          if(fname&&fname!==proyecto){setProyecto(fname);setNewP(fname);}
        }
        // Sobrescribir silenciosamente
        const w=await _fileHandle.current.createWritable();
        await w.write(blob);await w.close();
        // Persistir handle en IDB para próxima sesión
        await _fhSave(_fileHandle.current);
      }else{
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`ObraGestion_${nombre}.html`;
        a.click();URL.revokeObjectURL(a.href);
      }
      try{localStorage.setItem(`obracalc_pro_v4_p_${pid}`,JSON.stringify(snapData));}catch{}
      setModified(false);
    }catch(e){
      if(e.name!=='AbortError')alert('Error al guardar:\n\n'+e.message);
    }
  };

  // Ctrl+S = Guardar | Ctrl+Mayús+S = Guardar como
  _guardarFn.current=guardarHTML;
  useEffect(()=>{
    const h=(e)=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){
        e.preventDefault();_guardarFn.current(e.shiftKey);
      }
    };
    document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[]);

  // ── Nueva obra en blanco ──────────────────────────────────────────────────
  const nuevaObra=()=>{
    if(!window.confirm('¿Crear una nueva obra en blanco?\n\nTodos los datos actuales se borrarán de la vista.\nSi no los guardaste primero, los perderás.'))return;
    setTareas([]);setRec([]);setGrupos(DEMO_GRUPOS);setRubros(DEMO_RUBROS);
    setCfg({fechaInicio:'',hsDia:8});
    const p='Nueva Obra';setProyecto(p);setNewP(p);
    setCuadGrupos({});setCuadRubros({});setMoItems({});setMatIncr({});
    _fileHandle.current=null; // nueva obra = nuevo archivo → resetear handle
    setModified(false);
  };

  // Aplicar cuadrillas 3 niveles: Rubro override > Grupo global > Ítem propio
  const tareasConCuad=useMemo(()=>tareas.map(t=>{
    const rub=rubros.find(r=>r.id===t.rubroId);
    const cr=cuadRubros[t.rubroId];
    const cg=cuadGrupos[rub?.grupo];
    if(cr?.global)return{...t,nOf:cr.nOf,nAy:cr.nAy};
    if(cg?.global)return{...t,nOf:cg.nOf,nAy:cg.nAy};
    return t;
  }),[tareas,cuadRubros,cuadGrupos,rubros]);

  const tc=useMemo(()=>calcFechas(tareasConCuad,cfg.fechaInicio,cfg.hsDia,!!cfg.sabado),[tareasConCuad,cfg]);
  const conflictos=useMemo(()=>detectConflicts(tareasConCuad),[tareasConCuad]);
  const erroresMap=useMemo(()=>{
    const m={};conflictos.filter(e=>e.taskId).forEach(e=>{(m[e.taskId]=m[e.taskId]||[]).push(e);});return m;
  },[conflictos]);

  const costoMat=rec.reduce((s,r)=>s+r.qty*r.pu,0);
  const costoMO=tc.reduce((s,t)=>{const mo=moItems[t.id];if(!mo||!mo.valor)return s;return s+(mo.tipo==="total"?+mo.valor:+mo.valor*+t.qty);},0);
  const fFin=tc.reduce((mx,t)=>!mx||t.fFin>mx?t.fFin:mx,null);

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"system-ui,sans-serif",color:C.t1}}>
      {/* HEADER */}
      <div className="hdr-wrap" style={{background:C.surface,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 8px rgba(0,0,0,.07)"}}>
        <div className="hdr" style={{display:"flex",alignItems:"center"}}>
          <div className="hdr-brand" style={{display:"flex",alignItems:"center",gap:"8px",padding:"9px 14px",borderRight:`1px solid ${C.border}`,minWidth:"155px",flexShrink:0}}>
            <div style={{background:C.accent,width:"28px",height:"28px",borderRadius:"7px",display:"flex",alignItems:"center",justifyContent:"center",color:"white",flexShrink:0}}>
              <svg viewBox="0 0 22 18" width="15" height="12" fill="none">
                <rect x="2" y="1.5" width="12" height="4" rx="2" fill="white"/>
                <rect x="6" y="7" width="10" height="4" rx="2" fill="white" opacity=".85"/>
                <rect x="9" y="12.5" width="11" height="4" rx="2" fill="white" opacity=".7"/>
              </svg>
            </div>
            <div>
              <div style={{fontWeight:800,fontSize:"14px",letterSpacing:"-.3px",color:C.t1}}>ObraGestión</div>
              <div style={{fontSize:"8px",color:C.t3,letterSpacing:".2px"}}>v4 · gestión de obra</div>
            </div>
          </div>
          <div className="hdr-tabs" style={{display:"flex",overflowX:"auto",flex:1}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{background:"transparent",border:"none",cursor:"pointer",padding:"0 13px",height:"45px",
                  display:"flex",alignItems:"center",gap:"5px",fontWeight:700,fontSize:"10px",
                  whiteSpace:"nowrap",color:tab===t.id?C.accent:C.t3,
                  borderBottom:tab===t.id?`2px solid ${C.accent}`:"2px solid transparent",
                  position:"relative"}}>
                <span style={{fontSize:"12px"}}>{t.icon}</span>{t.label.toUpperCase()}
                {(t.id==="plan"||t.id==="gantt")&&conflictos.length>0&&(
                  <span style={{position:"absolute",top:"8px",right:"5px",background:C.red,color:"white",
                    borderRadius:"8px",padding:"0 4px",fontSize:"8px",fontWeight:800,lineHeight:"14px"}}>
                    {conflictos.length}
                  </span>
                )}
              </button>
            ))}
          </div>
          <div className="hdr-actions" style={{display:"flex",gap:"6px",padding:"0 10px",flexShrink:0,alignItems:"center",fontSize:"10px",color:C.t3,flexWrap:"wrap"}}>
            <span>Fin: <b style={{color:C.accent,fontFamily:"monospace"}}>{fF(fFin)}</b></span>
            <span>Mat: <b style={{color:C.blue,fontFamily:"monospace"}}>{fM(costoMat)}</b></span>
            {costoMO>0&&<span>MO: <b style={{color:C.violet,fontFamily:"monospace"}}>{fM(costoMO)}</b></span>}
            <div style={{width:"1px",height:"20px",background:C.border,margin:"0 2px"}}/>
            {/* Indicador de guardado automático */}
            {lastSaved&&!modified&&<span style={{fontSize:"9px",color:C.green,fontWeight:700,whiteSpace:"nowrap"}}>
              ✓ {lastSaved.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}
            </span>}
            {modified&&<span style={{fontSize:"9px",color:C.orange,fontWeight:700,whiteSpace:"nowrap",
              padding:"2px 6px",borderRadius:"4px",background:"rgba(234,88,12,.1)"}}>
              ● sin guardar HTML
            </span>}
            <div style={{width:"1px",height:"20px",background:C.border,margin:"0 2px"}}/>
            {/* Guardar (sobrescribe el archivo actual) */}
            <button onClick={()=>guardarHTML(false)}
              title="Guardar en el archivo actual · Ctrl+S"
              style={{...btnS(C.accent),padding:"3px 10px",fontSize:"10px",fontWeight:800}}>💾 Guardar</button>
            {/* Guardar como (elige nombre/ubicación) */}
            <button onClick={()=>guardarHTML(true)}
              title="Guardar como archivo nuevo · Ctrl+Mayús+S"
              style={{...btnS(C.blue),padding:"3px 8px",fontSize:"10px"}}>📂 Guardar como</button>
            {/* Nueva obra en blanco */}
            <button onClick={nuevaObra}
              title="Limpiar la vista para comenzar una nueva obra desde cero"
              style={{...btnS(C.t3),padding:"3px 8px",fontSize:"10px"}}>🆕 Nueva</button>
            <div style={{width:"1px",height:"20px",background:C.border,margin:"0 2px"}}/>
            {/* Exportar/Importar JSON (backup) */}
            <button onClick={exportarJSON}
              title="Exportar datos como JSON (respaldo)"
              style={{...btnS(C.blue),padding:"3px 8px",fontSize:"10px"}}>⬇ JSON</button>
            <button onClick={()=>importRef.current.click()}
              title="Importar datos desde JSON o desde otro archivo HTML guardado"
              style={{...btnS(C.green),padding:"3px 8px",fontSize:"10px"}}>⬆ Importar</button>
            <input ref={importRef} type="file" accept=".json,.html" onChange={importarJSON} style={{display:"none"}}/>
            {DRIVE_URL&&(
              <span title={{idle:'Drive sincronizado',pending:'Cambios pendientes…',saving:'Guardando en Drive…',saved:'Guardado en Drive ✓',error:'Error de sincronización',loading:'Cargando desde Drive…'}[driveStatus]||''}
                style={{fontSize:"10px",fontWeight:700,padding:"3px 8px",borderRadius:"4px",
                  color:{idle:'#16a34a',pending:'#d97706',saving:'#2563eb',saved:'#16a34a',error:'#dc2626',loading:'#2563eb'}[driveStatus],
                  background:{idle:'#16a34a18',pending:'#d9770618',saving:'#2563eb18',saved:'#16a34a18',error:'#dc262618',loading:'#2563eb18'}[driveStatus]}}>
                {({idle:'☁ Drive',pending:'☁ …',saving:'☁ Guardando',saved:'☁ Guardado ✓',error:'☁ Error',loading:'☁ Cargando'})[driveStatus]}
              </span>
            )}
            <div style={{width:"1px",height:"20px",background:C.border,margin:"0 2px"}}/>
            <button onClick={()=>{setNewP(proyecto);setEditProy(true);}}
              style={{background:"transparent",border:`1px solid ${C.border}`,color:C.t2,
                borderRadius:"5px",padding:"4px 9px",cursor:"pointer",fontSize:"10px",fontWeight:700,maxWidth:"140px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              ⚙ {proyecto?(proyecto.length>18?proyecto.slice(0,16)+'…':proyecto):<span style={{color:C.t3,fontStyle:'italic'}}>Nombre de obra</span>}
            </button>
          </div>
        </div>
        <div style={{padding:"4px 14px",background:C.bg,display:"flex",alignItems:"center",gap:"5px",borderTop:`1px solid ${C.border2}`}}>
          <span style={{fontSize:"9px",fontWeight:700,color:C.t3}}>{proyecto}</span>
          <span style={{color:C.border}}>›</span>
          <span style={{fontSize:"9px",fontWeight:800,color:C.accent}}>{TABS.find(t=>t.id===tab)?.label.toUpperCase()}</span>
          {conflictos.length>0&&tab!=="plan"&&(
            <span style={{marginLeft:"8px",fontSize:"9px",color:C.red,fontWeight:700}}>⚠ {conflictos.length} conflicto{conflictos.length!==1?"s":""} en predecesoras</span>
          )}
        </div>
      </div>

      {DRIVE_URL&&(
        <div title={{idle:'Drive sincronizado',pending:'Cambios pendientes…',saving:'Guardando en Drive…',saved:'Guardado en Drive ✓',error:'Error de sincronización',loading:'Cargando desde Drive…'}[driveStatus]||''}
          style={{position:"fixed",bottom:"16px",right:"16px",zIndex:9999,
            fontSize:"11px",fontWeight:800,padding:"6px 12px",borderRadius:"20px",
            boxShadow:"0 2px 8px rgba(0,0,0,.18)",cursor:"default",
            color:{idle:'#16a34a',pending:'#d97706',saving:'#2563eb',saved:'#16a34a',error:'#dc2626',loading:'#2563eb'}[driveStatus],
            background:{idle:'#f0fdf4',pending:'#fffbeb',saving:'#eff6ff',saved:'#f0fdf4',error:'#fef2f2',loading:'#eff6ff'}[driveStatus],
            border:`1.5px solid ${{idle:'#16a34a44',pending:'#d9770644',saving:'#2563eb44',saved:'#16a34a44',error:'#dc262644',loading:'#2563eb44'}[driveStatus]}`}}>
          {({idle:'☁ Drive ✓',pending:'☁ pendiente…',saving:'☁ Guardando…',saved:'☁ Guardado ✓',error:'☁ Error Drive',loading:'☁ Cargando…'})[driveStatus]}
        </div>
      )}
      <div style={{padding:"12px 14px"}}>
        {tab==="rubros"    &&<EditorRubros grupos={grupos} setGrupos={setGrupos} rubros={rubros} setRubros={setRubros} tareas={tareas} setTareas={setTareas} rec={rec} setRec={setRec} proyecto={proyecto} moItems={moItems} setMoItems={setMoItems} prof={prof} nota={notaPDF}/>}
        {tab==="plan"      &&<PlanObra tc={tc} setTareas={setTareas} rec={rec} setRec={setRec} cfg={cfg} setCfg={setCfg} rubros={rubros} grupos={grupos} cuadGrupos={cuadGrupos} setCuadGrupos={setCuadGrupos} cuadRubros={cuadRubros} setCuadRubros={setCuadRubros} conflictos={conflictos} erroresMap={erroresMap} proyecto={proyecto} moItems={moItems} setMoItems={setMoItems} prof={prof} nota={notaPDF}/>}
        {tab==="gantt"     &&<GanttView tc={tc} cfg={cfg} rubros={rubros} conflictos={conflictos} proyecto={proyecto} prof={prof} nota={notaPDF} rec={rec} moItems={moItems} matIncr={matIncr}/>}
        {tab==="recursos"  &&<Recursos rec={rec} setRec={setRec} tareas={tareas} rubros={rubros} proyecto={proyecto} prof={prof} imprevistos={imprevistos} setImprevistos={setImprevistos} nota={notaPDF} matIncr={matIncr} setMatIncr={setMatIncr}/>}
        {tab==="asistente" &&<AsistenteChat tareas={tareas} setTareas={setTareas} rubros={rubros} setRubros={setRubros} grupos={grupos} setGrupos={setGrupos} cfg={cfg} setCfg={setCfg} moItems={moItems} setMoItems={setMoItems} proyecto={proyecto}/>}
        {tab==="incidencia"&&<Incidencia tc={tc} rec={rec} rubros={rubros} grupos={grupos} moItems={moItems} setMoItems={setMoItems} proyecto={proyecto} prof={prof} nota={notaPDF}/>}
      </div>

      {editProy&&(
        <Modal title="Datos del proyecto" onClose={()=>setEditProy(false)} onEnter={()=>{if(newP.trim()){setProyecto(newP.trim());setEditProy(false);}}}>
          <Fld label="NOMBRE DE LA OBRA"><FInp value={newP} onChange={setNewP} ph="Ej: Vivienda unifamiliar — San Juan"/></Fld>
          <Fld label="NOTA LEGAL EN TODOS LOS PDFs" style={{marginTop:"12px"}}>
            <textarea value={notaPDF} onChange={e=>setNotaPDF(e.target.value)} rows={4}
              style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:"6px",padding:"8px 10px",
                background:C.surface,color:C.t1,fontSize:"12px",resize:"vertical",lineHeight:1.5}}/>
            <div style={{display:"flex",gap:"6px",marginTop:"4px"}}>
              <span style={{fontSize:"9px",color:C.t3,flex:1}}>Aparece al pie de todos los PDFs generados.</span>
              <button onClick={()=>setNotaPDF(NOTA_PDF_DEFAULT)}
                style={{...btnS(C.t3),fontSize:"9px",padding:"2px 7px"}}>↺ Restablecer</button>
            </div>
          </Fld>
          <div style={{display:"flex",gap:"10px",marginTop:"14px",justifyContent:"flex-end"}}>
            <Btn onClick={()=>setEditProy(false)} accent={C.t3}>Cancelar</Btn>
            <Btn onClick={()=>{if(newP.trim()){setProyecto(newP.trim());setEditProy(false);}}} accent={C.green}>Guardar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function HomePanel(){
  const [obras,setObras]=React.useState(()=>{
    const list=[];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key&&key.startsWith('obracalc_pro_v4_w_')){
        try{
          const d=JSON.parse(localStorage.getItem(key));
          if(d&&d.proyecto)list.push({name:d.proyecto,key,ts:d._ts||0});
        }catch{}
      }
    }
    list.sort((a,b)=>b.ts-a.ts);
    return list;
  });
  const [newName,setNewName]=React.useState('');
  const openObra=n=>{ window.location.href='?obra='+encodeURIComponent(n); };
  const delObra=(key,name)=>{
    if(!window.confirm(`¿Eliminar "${name}" de este dispositivo?\nNo afecta lo guardado en Drive.`))return;
    localStorage.removeItem(key);
    setObras(p=>p.filter(o=>o.key!==key));
  };
  return(
    <div style={{minHeight:'100vh',background:C.bg,fontFamily:'system-ui,sans-serif'}}>
      <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,padding:'0 16px',
        display:'flex',alignItems:'center',gap:'12px',height:'52px',
        boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
        <div style={{background:C.accent,borderRadius:'10px',width:'34px',height:'34px',
          display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',flexShrink:0}}>⊞</div>
        <div>
          <div style={{fontWeight:800,fontSize:'16px',color:C.t1,lineHeight:1}}>ObraGestión</div>
          <div style={{fontSize:'10px',color:C.t3}}>v4 · gestión de obra</div>
        </div>
      </div>
      <div style={{padding:'20px 16px',maxWidth:'800px',margin:'0 auto'}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',
          padding:'16px',marginBottom:'24px'}}>
          <div style={{fontWeight:700,fontSize:'11px',color:C.t3,marginBottom:'10px',
            letterSpacing:'.5px'}}>NUEVA OBRA</div>
          <div style={{display:'flex',gap:'8px'}}>
            <input value={newName} onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&newName.trim()&&openObra(newName.trim())}
              placeholder="Nombre de la obra (ej: Casa García)"
              style={{flex:1,border:`1px solid ${C.blue}55`,borderRadius:'7px',padding:'9px 12px',
                background:`${C.blue}08`,color:C.t1,fontWeight:600,fontSize:'14px'}}/>
            <button onClick={()=>newName.trim()&&openObra(newName.trim())}
              style={{background:C.accent,color:'white',border:'none',borderRadius:'7px',
                padding:'9px 18px',fontWeight:800,fontSize:'14px',cursor:'pointer'}}>
              Crear →
            </button>
          </div>
        </div>
        <div style={{fontWeight:700,fontSize:'11px',color:C.t3,marginBottom:'12px',
          letterSpacing:'.5px'}}>
          {obras.length?`${obras.length} OBRA${obras.length!==1?'S':''} GUARDADA${obras.length!==1?'S':''} EN ESTE DISPOSITIVO`:'NO HAY OBRAS GUARDADAS EN ESTE DISPOSITIVO'}
        </div>
        <div style={{display:'grid',gap:'10px',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))'}}>
          {obras.map(o=>(
            <div key={o.key} style={{background:C.card,border:`1px solid ${C.border}`,
              borderRadius:'11px',padding:'14px 16px',display:'flex',flexDirection:'column',
              gap:'6px',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
              <div style={{fontWeight:800,fontSize:'15px',color:C.t1}}>{o.name}</div>
              {o.ts>0&&<div style={{fontSize:'10px',color:C.t3}}>
                Guardado: {new Date(o.ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
              </div>}
              <div style={{display:'flex',gap:'6px',marginTop:'6px'}}>
                <button onClick={()=>openObra(o.name)}
                  style={{flex:1,background:C.accent,color:'white',border:'none',
                    borderRadius:'7px',padding:'8px 0',fontWeight:800,fontSize:'14px',
                    cursor:'pointer'}}>
                  Abrir →
                </button>
                <button onClick={()=>delObra(o.key,o.name)}
                  style={{background:'transparent',color:C.t3,border:`1px solid ${C.border}`,
                    borderRadius:'7px',padding:'8px 12px',fontWeight:600,fontSize:'13px',
                    cursor:'pointer'}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  _urlObra ? <App/> : <HomePanel/>
);
</script>
</body>
</html>
